# scripts/ci/run-script-tests.sh 的跳过清单。
#
# 格式: <用例文件名>|<理由>
#
# ⛔ 跳过会被打成 `SKIPPED:<原因>` 而**不是**绿 —— 它是「这次没量到」, 不是「没问题」。
# ⛔ 理由必须写清**缺什么**(docker / psql / ssh key / 某台服务器), 不许写「CI 里跑不了」。
# ⛔ 指向不存在的文件的条目会让 runner 直接 exit 2 —— 一条保护空气的跳过, 会在将来
#    出现同名文件时替那个新文件跳过。
#
# 📌 这份清单**只填实测结果**: 先让 CI 真跑一次全量, 按它给出的 rc 和日志填,
#    ⛔ 不要凭「这个看起来要连服务器」预先填进来 —— 那样会把本来能跑的用例也关掉,
#    而闸的覆盖率是悄悄归零的。
