# ─────────────────────────────────────────────────────────────────────────────
# 声明式豁免: scripts/cron/ 下**不**经安装器上服务器的那些
# ─────────────────────────────────────────────────────────────────────────────
# 两个类别, ⛔ 不许混用 —— 它们是**两种不同的状态**, 后续动作也不同:
#
#   `# NOT_INSTALLED <仓库路径>  <理由>`
#       服务器上**没有会漂的第二份** —— 在跑, 副本由 deploy-smartbi-python.sh 3d 把
#       scripts/cron/*.sh **整目录 rsync** 到 /www/wwwroot/cretas/code/scripts/cron/,
#       每次 Python 部署都重刷 ⇒ 跟着 Python 部署走, 结构上没有漂移面。
#       ⚠️ 2026-09-06 订正: 原文写「从服务器那份 git checkout 直接跑, 跟着代码走」——
#       **不对**。那棵 checkout 停在 2026-05-07 (#135), scripts/cron/ 在那里是 untracked;
#       副本是 3d rsync 来的, ⛔ 不是 git pull 来的。改了 scripts/cron/* 之后要跑一次
#       Python 部署(或让 organizer 手动 rsync 同一目录)才会上服务器。
#       后续动作: 无。
#
#   `# NOT_SCHEDULED <仓库路径>  <理由>`
#       **根本没在跑** —— crontab 里一次都没出现。这是"机制在、没接上"(形态 B),
#       不是"不需要检查漂移"。
#       后续动作: 各自另立任务决定接不接。⛔ 别把它读成「已经安排好了」。
#
# 第一版把两者都写成 NOT_INSTALLED, 审查者第一遍就读混了 —— 一个"没有部署副本"和
# 一个"压根没运行"长得一样, 而后者是个待办。
#
# 写它是为了让"为什么不检查它"可审阅, 与上面 REPO_PATH 写 '-' 同一条纪律:
# ⛔ 声明式忽略, 不是静默跳过。
#
# 实测(2026-09-06, root crontab): 下面 10 个 NOT_INSTALLED 都是从 checkout 跑的。
# ⚠️ hasdel 快照一度挂在这儿, 后来改成**登记**(上面第 31 行) —— watch 脚本要在线上
#    拿它跟真库对账, 所以它必须装到服务器上, 也就真的有了一份会漂的第二份。
# soft-delete-orphans-watch.sh 是这批里**唯一**手 scp 到
# /www/wwwroot/cretas/scripts/ 的, 所以只有它需要登记。
# NOT_INSTALLED scripts/cron/daily-close-push.sh  从服务器 git checkout 跑
# NOT_INSTALLED scripts/cron/flywheel-promotion-staleness-daily.sh  从服务器 git checkout 跑
# NOT_INSTALLED scripts/cron/forecast-backtest-watch.sh  从服务器 git checkout 跑
# NOT_INSTALLED scripts/cron/llm-provider-health-daily.sh  从服务器 git checkout 跑
# NOT_INSTALLED scripts/cron/margin-parity-daily.sh  从服务器 git checkout 跑
# NOT_INSTALLED scripts/cron/refresh-demo-rest.sh  从服务器 git checkout 跑
# NOT_INSTALLED scripts/cron/replay-equivalence-daily.sh  从服务器 git checkout 跑
# NOT_INSTALLED scripts/cron/restaurant-ai-eval.sh  从服务器 git checkout 跑
# NOT_INSTALLED scripts/cron/restaurant-unfreeze-watch.sh  从服务器 git checkout 跑
# NOT_INSTALLED scripts/cron/time-phrase-backlog-daily.sh  从服务器 git checkout 跑
# NOT_INSTALLED scripts/cron/cron-common.sh  被 source 的公共函数库(钉 PATH / 缺命令 rc=2 / venv 守卫), 随 3d 整目录 rsync, 不单独执行
#
# 下面这 3 个是 NOT_SCHEDULED (实测 crontab -l 里一次都没出现)。
# ⚠️ 这是"机制在、没接上"的样子, 不是本条豁免要解决的问题 —— 各自另立任务。
# NOT_SCHEDULED scripts/cron/async-failure-backlog-daily.sh  未接入 crontab; 且与 soft-delete 同款 ss/PATH 隐患, 另立任务
# NOT_SCHEDULED scripts/cron/probe-llm-registry.sh  未接入 crontab
# NOT_SCHEDULED scripts/cron/restaurant-flywheel-promotion-backlog-daily.sh  未接入 crontab
