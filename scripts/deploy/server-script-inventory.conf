# 服务器脚本清单 —— check-server-script-drift.sh 与 install-server-scripts.sh 的唯一来源。
#
# 为什么单独一个文件: 这两个工具必须对"有哪些脚本、装在哪、源码在哪"完全一致。各存一份
# 清单就等于又造了一个漂移源, 而它们存在的理由正是消除漂移。
#
# 格式: HOST|REMOTE_PATH|REPO_PATH|NOTE
#   HOST        tokyo | ecs
#   REPO_PATH   仓库内相对路径; '-' 表示 IGNORE
#   NOTE        作用说明 / 为什么 IGNORE
#
# REPO_PATH 写 '-' 是【声明式忽略】而不是静默跳过 —— 这样"为什么不检查它"是可审阅的。
# 现有 IGNORE 项都是东京出口/VPN 自身的运维脚本, 不属于 cretas 发布链路。
#
# 新增仓库跟踪的服务器脚本后必须在这里登记, 否则 scripts/tests/test-server-script-drift.sh
# 的第 6 条会失败(那条闸是唯一能在 CI 里防"忘了登记"的)。

tokyo|/usr/local/sbin/github-artifact-stage|scripts/deploy/lightsail/github-artifact-stage|GitHub 制品下载+解包
tokyo|/usr/local/sbin/github-web-artifact-stage|scripts/deploy/lightsail/github-web-artifact-stage|web dist 制品下载+解包(取回落本机, 不走 OSS)
tokyo|/usr/local/sbin/oss-put-artifact|scripts/deploy/lightsail/oss-put-artifact|签名 URL 上传到上海 OSS
tokyo|/usr/local/sbin/github-cache-put|scripts/deploy/lightsail/github-cache-put|东京侧 GitHub 制品缓存写入
tokyo|/usr/local/sbin/github-cache-clean|scripts/deploy/lightsail/github-cache-clean|缓存 LRU 驱逐
tokyo|/usr/local/sbin/github-artifact-cache-rollback|scripts/deploy/lightsail/github-artifact-cache-rollback|缓存设施回滚
tokyo|/usr/local/sbin/install-tokyo-usage-meter|-|东京 VPN 流量计, 非发布链路
tokyo|/usr/local/sbin/test-amnezia-openvpn-netns|-|VPN netns 自测, 非发布链路
tokyo|/usr/local/sbin/tokyo-openvpn-firewall|-|VPN 防火墙, 非发布链路
tokyo|/usr/local/sbin/tokyo-vpn-usage-collector|-|VPN 流量采集, 非发布链路
ecs|/usr/local/sbin/oss-sign-put.py|scripts/deploy/ecs/oss-sign-put.py|OSS 签名 URL 生成
ecs|/usr/local/sbin/oss-verify-artifact.sh|scripts/deploy/ecs/oss-verify-artifact.sh|ECS 侧下载+校验+落缓存
ecs|/www/wwwroot/cretas/scripts/soft-delete-orphans-watch.sh|scripts/cron/soft-delete-orphans-watch.sh|软删孤儿日扫
ecs|/www/wwwroot/cretas/scripts/soft-delete-orphans.sql|scripts/cron/soft-delete-orphans.sql|软删孤儿日扫的扫描面(生成物, 由 check-soft-delete-orphans.sh --write 产出)

# ─────────────────────────────────────────────────────────────────────────────
# 声明式豁免: scripts/cron/ 下**不**经安装器上服务器的那些
# ─────────────────────────────────────────────────────────────────────────────
# 格式: `# NOT_INSTALLED <仓库路径>  <理由>` —— test-server-script-drift.sh 第 6 条
# 认这一行。写它是为了让"为什么不检查它"可审阅, 与上面 REPO_PATH 写 '-' 同一条纪律:
# ⛔ 声明式忽略, 不是静默跳过。
