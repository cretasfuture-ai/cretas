# Standalone test preview; never routes to Cretas production upstreams.
map $uri $blacklake_preview_api_key {
    default "";
    ~/(smartbi-api|__blacklake)/ $binary_remote_addr;
}
limit_req_zone $blacklake_preview_api_key zone=blacklake_preview_api_rate:10m rate=20r/s;
limit_conn_zone $blacklake_preview_api_key zone=blacklake_preview_api_connections:10m;
server {
    listen 80;
    server_name test.cretaceousfuture.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name test.cretaceousfuture.com;
    include /www/server/nginx/conf/snippets/block-ambiguous-path.conf;
    ssl_certificate /www/server/panel/vhost/cert/test.cretaceousfuture.com.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/test.cretaceousfuture.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    limit_req zone=blacklake_preview_api_rate burst=40 nodelay;
    limit_req_status 429;
    limit_conn blacklake_preview_api_connections 16;
    limit_conn_status 429;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    location / {
        proxy_pass http://127.0.0.1:19378;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Preview-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 190s;
        proxy_buffering off;
    }
    access_log off;
    error_log /www/wwwlogs/blacklake-preview.error.log;
}
