/* 称重表单：读取 / 预览 / 保存 */
function subRow(kind) {
  var opts = (kind === 'd' ? DEFECTS : BYPRODUCTS).map(function (n) { return '<option>' + n + '</option>'; }).join('');
  return '<div class="r" data-kind="' + kind + '"><select aria-label="名称">' + opts + '</select><input type="number" inputmode="decimal" min="0" step="0.1" placeholder="kg" aria-label="重量 kg"><button class="link" type="button" data-delrow>删除</button></div>';
}
function readForm() {
  function num(id) { var v = $(id).value; return v === '' ? null : parseFloat(v); }
  function sub(k) { return Array.prototype.map.call(document.querySelectorAll('#rows-' + k + ' .r'), function (r) { var v = r.querySelector('input').value; return { name: r.querySelector('select').value, kg: v === '' ? 0 : parseFloat(v) }; }); }
  return { inKg: num('#f-in'), gross: num('#f-gross'), tare: num('#f-tare'), start: $('#f-start').value, end: $('#f-end').value, defects: sub('d'), by: sub('b') };
}
function calc(f) {
  var errs = [], t = taskOf(S.task);
  var empty = f.inKg == null || f.gross == null;
  if (f.inKg != null && f.inKg <= 0) errs.push('投入量要大于 0');
  if (f.gross != null && f.gross <= 0) errs.push('良品毛重要大于 0');
  var tare = f.tare == null ? 0 : f.tare;
  if (tare < 0) errs.push('皮重不能是负数');
  if (f.gross != null && tare > f.gross) errs.push('皮重不能大于毛重');
  if (f.defects.concat(f.by).some(function (x) { return !(x.kg >= 0); })) errs.push('次品和副产品重量不能是负数');
  if (f.start && f.end && f.end < f.start) errs.push('结束时间早于开始时间');
  if (f.end && f.end > '2026-11-16T15:35') errs.push('结束时间晚于现在（示例时间 15:30）');
  var good = empty ? null : f.gross - tare;
  var dk = f.defects.reduce(function (a, x) { return a + (x.kg || 0); }, 0), bk = f.by.reduce(function (a, x) { return a + (x.kg || 0); }, 0);
  var loss = empty ? null : f.inKg - good - dk - bk;
  if (loss != null && loss < -1e-6) errs.push('出料合计比投入多 ' + fmt(-loss, 1) + ' kg，请核对');
  var y = (empty || f.inKg <= 0) ? null : good / f.inKg * 100;
  return { errs: errs, empty: empty, good: good, dk: dk, bk: bk, loss: loss, y: y, t: t };
}
function updatePreview() {

  else st = Math.abs(c.y - t.std) <= t.tol ? pill('达标', 'ok') : pill('偏离标准 ' + (c.y - t.std > 0 ? '+' : '') + (c.y - t.std).toFixed(1) + ' 点', 'risk');

/* ---------- 通用页面引擎：每个页面由 reg(路由, 页面描述) 登记，描述由若干「块」组成 ---------- */

MENU.forEach(function (g) { g[1].forEach(function (x) { BYID[pid(x[1])] = x[1]; }); });
function titleOf(route) { var t = route; MENU.forEach(function (g) { g[1].forEach(function (x) { if (x[1] === route) t = x[0]; }); }); return t; }
function groupOf(id) { var r = ''; MENU.forEach(function (g) { g[1].forEach(function (x) { if (!r && pid(x[1]) === id) r = g[0]; }); }); return r; }
function cell(v, c) {
  if (v == null || v === '') return '<span class="muted">—</span>';
  if (typeof v === 'number') return fmt(v, (c && c.d) || 0);
  if (c && c.p) return autoPill(v);
  return esc(v);
}
function plain(v, c) { return v == null || v === '' ? '—' : typeof v === 'number' ? fmt(v, (c && c.d) || 0) : String(v); }
function autoPill(v) {
  var s = String(v), cls = '';

  else if (/可查看/.test(s)) cls = 'run';
  else if (/(超期|不合格|驳回|过期|缺料|异常|高|失败|拒绝|超温|差异|召回|逾期|报废|未对上|未通过|缺口)/.test(s)) cls = 'risk';
  else if (/(已取消|草稿|未开始|停用|已作废|已关闭|低)/.test(s)) cls = 'mute';
  else if (/(执行中|进行中|处理中|待审批|审批中|生产中|运输中|检验中|待处理|新建|待)/.test(s)) cls = 'run';

}

BLK.kpis = function (b) {
  return '<div class="kpis">' + b.items.map(function (k) { return '<div class="kpi"><span>' + esc(k[0]) + '</span><strong>' + (typeof k[1] === 'number' ? fmt(k[1], k[3] || 0) : esc(k[1])) + '</strong>' + (k[2] ? '<small style="color:var(--fg2)">' + esc(k[2]) + '</small>' : '') + '</div>'; }).join('') + '</div>';
