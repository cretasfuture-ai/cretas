:root {
  --bg: #f4f6f9;

  --subtle: #f7f9fc;
  --fg: #1a293d;
  --fg2: #52647a;

  --brand-soft: #eaf2fa;
  --ok: #24724f;
  --ok-soft: #e4f3ee;
  --warn: #8f6420;
  --warn-soft: #f8f0df;
  --risk: #b0443f;
  --risk-soft: #f8e9e8;
  --idle: #9aaabd;
  --on: #ffffff;
  --font: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1722; --card: #17212f; --subtle: #1b2738; --fg: #e6edf6; --fg2: #a9b8cc; --line: #26344a;
    --brand: #5aa3e0; --brand-soft: #16304a; --ok: #5cc2a4; --ok-soft: #14332b;
    --warn: #e0b765; --warn-soft: #3a2f16; --risk: #e48b86; --risk-soft: #3d2120; --idle: #6d7f96; --on: #0f1722;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1722; --card: #17212f; --subtle: #1b2738; --fg: #e6edf6; --fg2: #a9b8cc; --line: #26344a;
  --brand: #5aa3e0; --brand-soft: #16304a; --ok: #5cc2a4; --ok-soft: #14332b;
  --warn: #e0b765; --warn-soft: #3a2f16; --risk: #e48b86; --risk-soft: #3d2120; --idle: #6d7f96; --on: #0f1722;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 14px/1.6 var(--font); font-variant-numeric: tabular-nums;
  padding-block: 0 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
h1 { font-size: 20px; margin: 0; line-height: 1.3; }
h2 { font-size: 15px; margin: 0; }
h3 { font-size: 14px; margin: 0; }
small, .muted { color: var(--fg2); font-size: 12px; }
.shell { max-width: 1240px; margin: 0 auto; }
.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding-block: 14px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand b { font-size: 16px; }
.demo-note { background: var(--warn-soft); color: var(--fg); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; }
.body { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 800px) { .body { grid-template-columns: minmax(0, 1fr); } }
.nav { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 8px; }
.nav { max-height: calc(100vh - 16px); overflow-y: auto; }
@media (max-width: 800px) { .nav { position: static; max-height: 50vh; } }
.nav .grp { font-weight: 600; }
.nav .grp i { font-style: normal; font-weight: 400; color: var(--fg2); font-size: 12px; }
.nav .grp[aria-expanded="true"] i { color: var(--brand); }
.nav .sb { padding-left: 22px; font-size: 13px; }
.bar { display: grid; grid-template-columns: minmax(70px, 150px) minmax(0, 1fr) minmax(70px, auto); gap: 10px; align-items: center; margin: 7px 0; font-size: 13px; }
.bar .bt { background: var(--subtle); border-radius: 4px; height: 12px; overflow: hidden; display: block; }
.bar .bt i { display: block; height: 100%; border-radius: 4px; }
.bar b { text-align: right; font-weight: 600; }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; align-items: start; }
.board .col { background: var(--subtle); border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.board .colh { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; }
.board .kc { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
.sw { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.sw > div { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: 12px; min-width: 0; }
.sw i { display: block; height: 38px; }
.sw span { display: block; padding: 5px 8px; color: var(--fg2); overflow-wrap: anywhere; }
.sw b { color: var(--fg); display: block; font-weight: 600; font-size: 13px; }
code { font: 12px var(--mono); background: var(--subtle); padding: 1px 5px; border-radius: 4px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.step { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; font-size: 13px; }
.step small { color: var(--fg2); }
textarea:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.nav .sec { font-size: 11px; color: var(--fg2); letter-spacing: .08em; padding: 8px 10px 2px; }
.nav button { border: 0; background: transparent; text-align: left; padding: 8px 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; gap: 10px; white-space: nowrap; }
.nav button:hover { background: var(--brand-soft); }
.nav button[aria-current="page"] { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.badge { background: var(--risk); color: var(--on); border-radius: 999px; font-size: 11px; min-width: 18px; padding: 0 6px; text-align: center; line-height: 18px; }
.nav .more { font-size: 12px; color: var(--fg2); padding: 10px; border-top: 1px solid var(--line); margin-top: 6px; }
.page { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ph { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: flex-end; }
.ph p { margin: 0 0 2px; color: var(--fg2); font-size: 12px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; text-align: left; }
.kpi:hover { border-color: var(--brand); }
.kpi span { display: block; color: var(--fg2); font-size: 12px; }
.kpi strong { display: block; font-size: 26px; font-weight: 600; line-height: 1.25; }
.kpi small { color: var(--brand); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.card > header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card .in { padding: 12px 14px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.grid3 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 14px; align-items: start; }
@media (max-width: 960px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.link { border: 0; background: none; color: var(--brand); padding: 2px 4px; font-size: 12.5px; }
.link:hover { text-decoration: underline; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 6px 12px; }
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on); }
.btn.primary:hover { filter: brightness(1.08); color: var(--on); }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.btn.sm { padding: 2px 9px; font-size: 12.5px; }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--subtle); color: var(--fg2); font-weight: 600; white-space: nowrap; font-size: 12px; }
td.n, th.n { text-align: right; }
tbody tr:last-child td { border-bottom: 0; }
tr.pick { background: var(--brand-soft); }
td small { display: block; }
.pill { display: inline-block; font-size: 11.5px; padding: 0 7px; border-radius: 4px; background: var(--warn-soft); color: var(--warn); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.run { background: var(--brand-soft); color: var(--brand); }
.pill.risk { background: var(--risk-soft); color: var(--risk); }
.pill.mute { background: var(--subtle); color: var(--fg2); border: 1px solid var(--line); }
.track { display: flex; height: 10px; border-radius: 4px; overflow: hidden; background: var(--subtle); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; margin-top: 10px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.list > div { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.list > div:last-child { border-bottom: 0; }
.list .t { min-width: 0; flex: 1 1 220px; }
.list .t b { font-weight: 600; }
.list .t small { display: block; }
.tabs { display: inline-flex; background: var(--subtle); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.tabs button { border: 0; background: transparent; padding: 5px 14px; border-radius: 6px; color: var(--fg2); }
.tabs button[aria-pressed="true"] { background: var(--card); color: var(--brand); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--fg2); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; }
.chip[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.empty { color: var(--fg2); padding: 22px 14px; text-align: center; }
.issue { border-bottom: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.issue:last-child { border-bottom: 0; }
.issue .hd { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.issue ul { margin: 0; padding-left: 18px; color: var(--fg2); font-size: 12.5px; }
.issue .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.closer { background: var(--subtle); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

.sevbar { width: 4px; align-self: stretch; border-radius: 2px; background: var(--idle); }
.form { display: grid; gap: 12px; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--fg2); min-width: 0; }
label.f input, label.f select, .tools input { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); min-width: 0; width: 100%; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tools input { flex: 1 1 160px; }
.sub { display: grid; gap: 6px; }
.sub .r { display: grid; grid-template-columns: minmax(0, 1fr) 110px auto; gap: 8px; align-items: center; }
.sub select, .sub input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); min-width: 0; width: 100%; }
.preview { background: var(--subtle); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; }
.preview .k { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.preview .k span { display: block; font-size: 12px; color: var(--fg2); }
.preview .k b { font-size: 17px; font-weight: 600; }
.errs { margin: 0; padding-left: 18px; color: var(--risk); font-size: 12.5px; }
.pickrow { cursor: pointer; }
.pickrow:hover { background: var(--brand-soft); }
.comp { display: flex; height: 12px; border-radius: 4px; overflow: hidden; background: var(--subtle); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.facts span { display: block; font-size: 12px; color: var(--fg2); }
.facts b { font-size: 16px; font-weight: 600; }
.notice { background: var(--warn-soft); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; }
.notice.ok { background: var(--ok-soft); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 13px; z-index: 30; max-width: calc(100% - 32px); }
.ov { position: fixed; inset: 0; background: rgba(10, 18, 30, .5); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; }
.dlg { background: var(--card); border-radius: 10px; max-width: 520px; width: 100%; max-height: 85vh; overflow: auto; padding: 16px 18px; border: 1px solid var(--line); }
.dlg dl { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px 12px; margin: 12px 0; font-size: 13px; }
.dlg dt { color: var(--fg2); }
.dlg dd { margin: 0; overflow-wrap: anywhere; }
a { color: var(--brand); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

    return '<div class="col"><div class="colh"><b>' + esc(c.title) + '</b><span class="pill mute">' + c.cards.length + '</span></div>' + c.cards.map(function (k) { return '<div class="kc"><b>' + esc(k.t) + '</b>' + (k.s ? '<small style="display:block">' + esc(k.s) + '</small>' : '') + (k.tag ? '<div style="margin-top:4px">' + autoPill(k.tag) + '</div>' : '') + '</div>'; }).join('') + '</div>';
  }).join('') + '</div>';
};
BLK.list = function (b) {
  return card(b.title, '<div class="list" style="margin:-12px -14px">' + b.items.map(function (i) {
    return '<div><div class="t"><b>' + esc(i.t) + '</b>' + (i.s ? '<small>' + esc(i.s) + '</small>' : '') + '</div><span>' + (i.tag ? autoPill(i.tag) : '') + (i.act ? ' <button class="btn sm" ' + (i.act.copy ? 'data-copy="' + esc(i.act.copy) + '"' : 'data-toast="' + esc(i.act.msg || '已执行（示例）') + '"') + '>' + esc(i.act.l) + '</button>' : '') + '</span></div>';
  }).join('') + '</div>');
};
BLK.swatches = function (b) {
  return card(b.title, '<div class="sw">' + b.items.map(function (s) { return '<div><i style="background:' + esc(s[2]) + '"></i><span><b>' + esc(s[1]) + '</b>' + esc(s[2]) + '<br><code>' + esc(s[0]) + '</code></span></div>'; }).join('') + '</div>');
};
BLK.kv = function (b) { return card(b.title, '<div class="facts">' + b.rows.map(function (r) { return '<div><span>' + esc(r[0]) + '</span><b>' + esc(plain(r[1])) + '</b></div>'; }).join('') + '</div>'); };
BLK.steps = function (b) {
  return card(b.title, '<div class="steps">' + b.items.map(function (s, i) {
    var cls = s.state === 'done' ? 'ok' : s.state === 'now' ? 'run' : 'mute';
    return '<div class="step"><span class="pill ' + cls + '">' + (i + 1) + '</span><b>' + esc(s.t) + '</b>' + (s.s ? '<small>' + esc(s.s) + '</small>' : '') + '</div>';
  }).join('') + '</div>');
};
BLK.tabs = function (b, key) {
  var i = S.tab[key] || 0;
  return '<div class="tabs" role="group">' + b.tabs.map(function (t, j) { return '<button data-tab="' + key + '|' + j + '" aria-pressed="' + (i === j) + '">' + esc(t.label) + '</button>'; }).join('') + '</div>' +
    (b.tabs[i].blocks || []).map(function (x, j) { return blk(x, key + '.' + i + '.' + j); }).join('');
};
BLK.toggles = function (b, key) {
  return card(b.title, '<div class="list" style="margin:-12px -14px">' + b.items.map(function (it, i) {
    var k = key + '.' + i, on = S.sw[k] === undefined ? !!it.on : S.sw[k];
    return '<div><div class="t"><b>' + esc(it.label) + '</b>' + (it.hint ? '<small>' + esc(it.hint) + '</small>' : '') + '</div><label class="chip" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-sw="' + k + '"' + (on ? ' checked' : '') + '> ' + (on ? '开' : '关') + '</label></div>';
  }).join('') + '</div>');
};
BLK.form = function (b) {
  return card(b.title, '<div class="form"><div class="row2">' + b.fields.map(function (f) {
    var inp = f.type === 'select' ? '<select>' + (f.options || []).map(function (o) { return '<option' + (o === f.value ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>' :
      f.type === 'textarea' ? '<textarea rows="3" style="padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);font:inherit;width:100%">' + esc(f.value || '') + '</textarea>' :
        '<input type="' + (f.type || 'text') + '" value="' + esc(f.value == null ? '' : f.value) + '"' + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '') + '>';
    return '<label class="f">' + esc(f.label) + inp + '</label>';
  }).join('') + '</div><div><button class="btn primary" data-toast="' + esc(b.msg || '已提交（示例，不保存）') + '">' + esc(b.submit || '提交') + '</button></div></div>');
};
function pageGeneric(id) {
  var route = BYID[id], sp = REG[route], grp = groupOf(id);
  if (!sp) return '<div class="ph"><div><p>' + esc(grp) + '</p><h1>' + esc(titleOf(route || id)) + '</h1></div></div><section class="card"><div class="empty">这个页面在原型里有，演示版还没做示例。</div></section>';
  return '<div class="ph"><div><p>' + esc(grp + (sp.sub ? ' · ' + sp.sub : '')) + '</p><h1>' + esc(sp.title) + '</h1></div>' + (sp.src ? pill(sp.src, 'mute') : '') + '</div>' +
    (sp.gap ? '<div class="notice"><b>缺口：</b>' + esc(sp.gap) + '</div>' : '') + (sp.blocks || []).map(function (b, i) { return blk(b, id + '.' + i); }).join('');
}
function openPairs(title, pairs, go) {
  $('#layer').innerHTML = '<div class="ov" data-close-dlg><div class="dlg" role="dialog" aria-modal="true" aria-label="详情"><h2>' + esc(title) + '</h2><dl>' + pairs.map(function (p) { return '<dt>' + esc(p[0]) + '</dt><dd>' + esc(p[1]) + '</dd>'; }).join('') + '</dl><small>示例数据，只读。</small><div style="margin-top:12px;text-align:right;display:flex;gap:8px;justify-content:flex-end">' + (go ? '<button class="btn primary" data-go="' + esc(go) + '">打开这页</button>' : '') + '<button class="btn" data-close-dlg-btn>关闭</button></div></div></div>';
}
function render() {
  var h = location.hash.replace('#', '') || 'today';
  if (!FN[h] && !BYID[h]) h = 'today';
  var changed = S.page !== h; S.page = h;
  renderNav();
  var fn = FN[h];
  $('#page').innerHTML = fn ? fn() : pageGeneric(h);
  if (h === 'weigh') updatePreview();
  if (changed) { try { window.scrollTo(0, 0); } catch (e) { /* 忽略 */ } }
}
/*__DATA__*/
window.addEventListener('hashchange', render);
document.addEventListener('input', function (e) {
  if (e.target.dataset && e.target.dataset.tbq) {
    var tk = e.target.dataset.tbq, tp = e.target.selectionStart; (S.tb[tk] || (S.tb[tk] = { q: '', f: {}, n: 15 })).q = e.target.value; S.tb[tk].n = 15; render();
    var tn = document.querySelector('[data-tbq="' + tk + '"]'); if (tn) { tn.focus(); try { tn.setSelectionRange(tp, tp); } catch (x) { /* 忽略 */ } } return;
  }
  if (e.target.id === 'tq') { S.q = e.target.value; var p = e.target.selectionStart; render(); var n = $('#tq'); if (n) { n.focus(); n.setSelectionRange(p, p); } return; }
  if (e.target.closest && e.target.closest('#wform')) updatePreview();
});
document.addEventListener('change', function (e) {
  if (e.target.dataset && e.target.dataset.sw) { S.sw[e.target.dataset.sw] = e.target.checked; toast((e.target.checked ? '已开启' : '已关闭') + '（示例，不保存）'); render(); return; }
  if (e.target.id === 'onlyrun') { S.onlyRun = e.target.checked; render(); return; }
  if (e.target.closest && e.target.closest('#wform')) updatePreview();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeDlg();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr.pickrow')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-go],[data-order],[data-kpi],[data-role],[data-weigh],[data-batch],[data-confirm],[data-undo],[data-src],[data-totodo],[data-closing],[data-conc],[data-close-ok],[data-close-cancel],[data-toggle-closed],[data-restore],[data-cf],[data-cost],[data-task],[data-revoke],[data-addrow],[data-delrow],[data-save],[data-act],[data-close-dlg],[data-close-dlg-btn],[data-grp],[data-tbf],[data-tbrow],[data-tbmore],[data-tab],[data-toast],[data-copy]');
  if (!el) return;
  var d = el.dataset;
  if (d.grp) { var g0 = d.grp, cur0 = (MENU.filter(function (g) { return g[0] === g0; })[0] || [0, []])[1].some(function (x) { return pid(x[1]) === S.page; }); S.openG[g0] = !(S.openG[g0] === undefined ? cur0 : S.openG[g0]); renderNav(); return; }
  if (d.tbf) { var pf = d.tbf.split('|'), sf = S.tb[pf[0]] || (S.tb[pf[0]] = { q: '', f: {}, n: 15 }); sf.f[pf[1]] = pf.slice(2).join('|'); sf.n = 15; render(); return; }
  if (d.tbrow) { var pr = d.tbrow.split('|'), tb = BLOCKS[pr[0]], row = tb.rows[+pr[1]]; var pairs = tb.cols.map(function (c) { return [c.l, plain(row[c.k], c)]; }); Object.keys(row._d || {}).forEach(function (k) { pairs.push([k, plain(row._d[k])]); }); openPairs(plain(row[tb.cols[0].k]), pairs, row._go); return; }
  if (d.copy) { var ct = d.copy, okc = function () { toast('已复制'); }; try { navigator.clipboard.writeText(ct).then(okc, function () { toast('复制被拦了，请手动选中文字复制'); }); } catch (x) { toast('复制被拦了，请手动选中文字复制'); } return; }
  if (d.tbmore) { S.tb[d.tbmore].n += 15; render(); return; }
  if (d.tab) { var pt = d.tab.split('|'); S.tab[pt[0]] = +pt[1]; render(); return; }
  if (d.toast) { toast(d.toast); return; }
  if (el.hasAttribute('data-close-dlg') && e.target !== el && !el.hasAttribute('data-close-dlg-btn')) return;
  if ('closeDlg' in d || 'closeDlgBtn' in d) { closeDlg(); return; }
  if (d.go) { closeDlg(); go(d.go); return; }
  if (d.order) { openOrder(d.order); return; }
  if (d.kpi) { if (d.kpi === 'cost') go('cost'); else toast('原型里这里会跳到「' + d.name + '」页，这版没收入'); return; }
  if (d.role) { S.role = d.role; render(); return; }
  if (d.weigh) { S.task = d.weigh; S.onlyRun = true; S.q = ''; go('weigh'); return; }
  if (d.batch) { S.batched[d.batch] = true; toast('已为 ' + d.batch + ' 建批次（示例）'); render(); return; }
  if (d.confirm) { S.issue[d.confirm] = { s: 'closed', c: '已处理', n: '已转待办并确认' }; toast('已确认'); render(); return; }
  if (d.undo) { delete S.issue[d.undo]; toast('已撤回到「发现的问题」'); render(); return; }
  if ('src' in d) { S.srcFilter = d.src; render(); return; }
  if (d.totodo) { S.issue[d.totodo] = { s: 'todo' }; toast('已转待办，见「待办」里的「等我确认」'); render(); return; }
  if (d.closing) { S.closing = d.closing; S.conc = ''; render(); return; }
  if (d.conc) { S.conc = d.conc; var n = $('#note'), v = n ? n.value : ''; render(); var n2 = $('#note'); if (n2) n2.value = v; return; }
  if (d.closeOk) {
    var note = ($('#note').value || '').trim();
    if (!S.conc) { toast('先选一个结论：已处理 / 误报 / 接受偏差'); return; }
    if (!note) { toast('再写一句原因'); return; }
    S.issue[d.closeOk] = { s: 'closed', c: S.conc, n: note }; S.closing = ''; S.conc = ''; toast('已关闭，可在「已关闭」里恢复'); render(); return;
  }
  if ('closeCancel' in d) { S.closing = ''; S.conc = ''; render(); return; }
  if ('toggleClosed' in d) { S.showClosed = !S.showClosed; render(); return; }
  if (d.restore) { delete S.issue[d.restore]; toast('已恢复'); render(); return; }
  if (d.cf) { S.costFilter = d.cf; render(); return; }
  if (d.cost) { S.costPick = d.cost; render(); return; }
  if (d.task) { S.task = d.task; render(); return; }
  if (d.revoke) { S.records.forEach(function (r) { if (r.id === d.revoke) r.revoked = true; }); toast('已撤销这笔称重'); render(); return; }
  if (d.addrow) { $('#rows-' + d.addrow).insertAdjacentHTML('beforeend', subRow(d.addrow)); updatePreview(); return; }
  if ('delrow' in d) { var r = el.closest('.r'); r.parentNode.removeChild(r); updatePreview(); return; }
  if ('save' in d) { saveWeigh(); return; }
  if (d.act === 'reset') { S = fresh(); closeDlg(); toast('已还原示例数据'); location.hash = 'today'; render(); }
});
if (!TITLES[location.hash.replace('#', '')]) S.page = 'today';
render();
</script>
