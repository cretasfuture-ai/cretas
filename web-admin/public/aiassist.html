<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="color-scheme" content="light">
  <title>白垩纪工厂操作助手</title>
  <style>
    :root {
      --ink: #17201d;
      --muted: #66706c;
      --subtle: #8b9490;
      --paper: #f7f6f2;
      --surface: #fffefa;
      --soft: #eeece6;
      --line: #deddd7;
      --accent: #176b51;
      --accent-strong: #0f5942;
      --accent-soft: #e5f0eb;
      --danger: #a63d3d;
      --danger-soft: #f9ecea;
      --shadow: 0 16px 42px rgb(32 41 37 / 8%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--paper);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
    }

    body { min-width: 320px; }

    button,
    textarea,
    input { font: inherit; }

    button,
    a { -webkit-tap-highlight-color: transparent; }

    button { cursor: pointer; }

    button:focus-visible,
    a:focus-visible,
    textarea:focus-visible,
    input:focus-visible {
      outline: 3px solid rgb(23 107 81 / 24%);
      outline-offset: 2px;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: min(100%, 860px);
      height: 100dvh;
      min-height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--surface);
      border-inline: 1px solid rgb(23 32 29 / 6%);
    }

    .topbar {
      position: relative;
      z-index: 10;
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      padding: max(10px, env(safe-area-inset-top)) 18px 10px;
      background: rgb(255 254 250 / 92%);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    .brand-mark {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 36px;
      height: 36px;
      color: #fff;
      font-size: 15px;
      font-weight: 760;
      background: var(--accent);
      border-radius: 10px;
      letter-spacing: -.03em;
    }

    .brand-copy {
      flex: 1;
      min-width: 0;
    }

    .brand-copy h1 {
      margin: 0;
      overflow: hidden;
      font-size: 16px;
      font-weight: 720;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: -.01em;
    }

    .brand-copy p {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
    }

    .top-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 6px;
    }

    .icon-button,
    .manual-link {
      display: inline-grid;
      place-items: center;
      min-width: 44px;
      min-height: 44px;
      padding: 0 11px;
      color: var(--ink);
      text-decoration: none;
      background: transparent;
      border: 0;
      border-radius: 10px;
      transition: background-color 160ms ease, color 160ms ease;
    }

    .icon-button:hover,
    .manual-link:hover { background: var(--soft); }

    .manual-link {
      grid-auto-flow: column;
      gap: 6px;
      color: var(--accent-strong);
      font-size: 13px;
      font-weight: 650;
    }

    .icon-button svg,
    .manual-link svg,
    .send-button svg,
    .attach-button svg,
    .copy-button svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .feed {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      background:
        radial-gradient(circle at 50% -20%, rgb(23 107 81 / 7%), transparent 42%),
        var(--surface);
    }

    .feed-inner {
      width: min(100%, 720px);
      min-height: 100%;
      margin: 0 auto;
      padding: 24px 22px 28px;
    }

    .welcome {
      display: grid;
      place-items: center;
      min-height: 100%;
      padding: 20px 0 34px;
      text-align: center;
    }

    .welcome-card { width: min(100%, 640px); }

    .welcome-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 16px;
      padding: 6px 10px;
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 680;
      background: var(--accent-soft);
      border-radius: 999px;
    }

    .welcome h2 {
      margin: 0;
      font-family: ui-serif, "Songti SC", "Noto Serif CJK SC", serif;
      font-size: clamp(27px, 7vw, 38px);
      font-weight: 680;
      line-height: 1.2;
      letter-spacing: -.035em;
    }

    .welcome-lead {
      max-width: 480px;
      margin: 12px auto 24px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .more-toggle {
      margin-top: 12px;
      padding: 9px 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 620;
      background: transparent;
      border: 1px dashed var(--line);
      border-radius: 11px;
      cursor: pointer;
      transition: color 160ms ease, border-color 160ms ease;
    }

    .more-toggle:hover { color: var(--ink); border-color: var(--ink); }

    .suggestions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 13px;
    }

    /* .suggestions sets display:grid, which outranks the UA [hidden] rule — without this
       the collapsed 更多示例 area renders anyway. */
    .suggestions[hidden] { display: none; }

    .suggestion {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      min-height: 54px;
      padding: 11px 12px;
      color: var(--ink);
      text-align: left;
      background: rgb(255 254 250 / 78%);
      border: 1px solid var(--line);
      border-radius: 13px;
      transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease;
    }

    .suggestion:hover {
      background: var(--accent-soft);
      border-color: rgb(23 107 81 / 35%);
    }

    .suggestion:active { transform: scale(.985); }

    .suggestion-index {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 24px;
      height: 24px;
      color: var(--accent-strong);
      font-size: 11px;
      font-weight: 720;
      background: var(--accent-soft);
      border-radius: 7px;
    }

    .suggestion span:last-child {
      font-size: 13px;
      font-weight: 580;
      line-height: 1.45;
    }

    .welcome-note {
      margin: 14px 0 0;
      color: var(--subtle);
      font-size: 12px;
      line-height: 1.55;
    }

    .message-list { padding: 2px 0 10px; }

    .message-row {
      display: flex;
      width: 100%;
      margin: 8px 0 20px;
    }

    .message-row.user { justify-content: flex-end; }

    .user-message {
      max-width: min(82%, 520px);
      padding: 10px 13px;
      color: #1d2522;
      background: var(--soft);
      border-radius: 16px 16px 5px 16px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .user-message p {
      margin: 0;
      font-size: 15px;
      line-height: 1.55;
    }

    .user-attachment {
      display: block;
      width: min(210px, 100%);
      max-height: 240px;
      margin-top: 9px;
      object-fit: cover;
      border-radius: 10px;
    }

    .message-row.assistant { display: block; }

    .assistant-message {
      position: relative;
      width: 100%;
      min-width: 0;
      padding-left: 34px;
    }

    .assistant-mark {
      position: absolute;
      top: 0;
      left: 0;
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      color: #fff;
      font-size: 10px;
      font-weight: 760;
      background: var(--accent);
      border-radius: 7px;
    }

    .assistant-status {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 24px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 620;
    }

    .stop-button {
      min-height: 34px;
      margin-left: auto;
      padding: 5px 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 620;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .stop-button:hover { color: var(--ink); background: var(--soft); }

    .thinking-dots { display: inline-flex; gap: 3px; }

    .thinking-dots i {
      width: 4px;
      height: 4px;
      background: currentColor;
      border-radius: 50%;
      animation: dot 1.2s ease-in-out infinite;
    }

    .thinking-dots i:nth-child(2) { animation-delay: 120ms; }
    .thinking-dots i:nth-child(3) { animation-delay: 240ms; }

    .markdown-body {
      color: var(--ink);
      font-size: 15px;
      line-height: 1.78;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .markdown-body > :first-child { margin-top: 0; }
    .markdown-body > :last-child { margin-bottom: 0; }

    .markdown-body p { margin: 0 0 13px; }

    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      margin: 24px 0 9px;
      color: #111815;
      font-weight: 720;
      line-height: 1.4;
      letter-spacing: -.015em;
    }

    .markdown-body h2 { font-size: 19px; }
    .markdown-body h3 { font-size: 17px; }
    .markdown-body h4 { font-size: 15px; }

    .markdown-body ul,
    .markdown-body ol {
      padding-left: 1.45em;
      margin: 8px 0 15px;
    }

    .markdown-body li { margin: 5px 0; padding-left: .15em; }

    .markdown-body strong { font-weight: 720; }

    .markdown-body code {
      padding: 2px 5px;
      color: #2d4039;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .88em;
      background: var(--soft);
      border-radius: 5px;
    }

    .markdown-body pre {
      position: relative;
      max-width: 100%;
      padding: 14px;
      overflow-x: auto;
      color: #e8f1ed;
      background: #1c2924;
      border-radius: 10px;
    }

    .markdown-body pre code { padding: 0; color: inherit; background: transparent; }

    .markdown-body a { color: var(--accent-strong); text-underline-offset: 3px; }

    .table-wrap {
      max-width: 100%;
      margin: 14px 0;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .markdown-body table {
      width: 100%;
      min-width: 420px;
      border-collapse: collapse;
      font-size: 13px;
    }

    .markdown-body th,
    .markdown-body td {
      padding: 9px 10px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line);
    }

    .markdown-body th { background: var(--soft); }
    .markdown-body tr:last-child td { border-bottom: 0; }

    .answer-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 14px;
    }

    .copy-button,
    .retry-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      padding: 7px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 620;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 9px;
    }

    .copy-button:hover { color: var(--ink); background: var(--soft); }
    .copy-button svg { width: 16px; height: 16px; }

    .sources {
      margin-top: 8px;
      color: var(--subtle);
      font-size: 12px;
    }

    .sources summary {
      min-height: 36px;
      padding: 8px 0;
      cursor: pointer;
    }

    .sources-list {
      display: grid;
      gap: 5px;
      margin-top: 3px;
      padding-left: 15px;
    }

    .related {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .related button {
      min-height: 40px;
      padding: 7px 10px;
      color: var(--accent-strong);
      font-size: 12px;
      text-align: left;
      background: var(--accent-soft);
      border: 0;
      border-radius: 9px;
    }

    .error-panel {
      padding: 13px 14px;
      color: #73302f;
      background: var(--danger-soft);
      border: 1px solid rgb(166 61 61 / 20%);
      border-radius: 11px;
    }

    .error-panel p { margin: 0 0 9px; line-height: 1.55; }

    .retry-button {
      min-height: 38px;
      color: var(--danger);
      background: #fff;
      border-color: rgb(166 61 61 / 24%);
    }

    .composer {
      position: relative;
      z-index: 10;
      flex: 0 0 auto;
      padding: 10px 16px max(10px, env(safe-area-inset-bottom));
      background: linear-gradient(to bottom, rgb(255 254 250 / 70%), var(--surface) 24%);
    }

    .composer-inner {
      width: min(100%, 720px);
      margin: 0 auto;
    }

    .attachment-preview {
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      padding: 8px 10px;
      color: var(--muted);
      font-size: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 11px;
    }

    .attachment-preview.visible { display: flex; }

    .attachment-preview img {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 8px;
    }

    .attachment-preview span {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .remove-attachment {
      min-width: 40px;
      min-height: 40px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 8px;
    }

    .composer-box {
      display: flex;
      align-items: flex-end;
      gap: 7px;
      padding: 7px;
      background: var(--surface);
      border: 1px solid #d6d5cf;
      border-radius: 17px;
      box-shadow: 0 10px 26px rgb(32 41 37 / 8%);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .composer-box:focus-within {
      border-color: rgb(23 107 81 / 55%);
      box-shadow: 0 10px 28px rgb(32 41 37 / 9%), 0 0 0 3px rgb(23 107 81 / 9%);
    }

    .attach-button,
    .send-button {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 44px;
      height: 44px;
      min-height: 44px;
      padding: 0;
      border: 0;
      border-radius: 12px;
    }

    .attach-button { color: var(--muted); background: transparent; }
    .attach-button:hover { color: var(--ink); background: var(--soft); }

    .composer textarea {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      max-height: 136px;
      padding: 10px 4px 8px;
      resize: none;
      color: var(--ink);
      background: transparent;
      border: 0;
      outline: 0;
      overflow-y: auto;
      line-height: 1.5;
    }

    .composer textarea::placeholder { color: #9a9e9b; }

    .send-button {
      color: #fff;
      background: var(--accent);
      transition: background-color 160ms ease, opacity 160ms ease, transform 160ms ease;
    }

    .send-button:not(:disabled):hover { background: var(--accent-strong); }
    .send-button:not(:disabled):active { transform: scale(.96); }

    .send-button:disabled {
      color: #9ea5a1;
      cursor: not-allowed;
      background: var(--soft);
    }

    .composer-hint {
      margin: 7px 4px 0;
      color: var(--subtle);
      font-size: 11px;
      text-align: center;
    }

    .toast {
      position: fixed;
      z-index: 50;
      right: 50%;
      bottom: calc(94px + env(safe-area-inset-bottom));
      max-width: calc(100vw - 32px);
      padding: 9px 13px;
      color: #fff;
      font-size: 13px;
      font-weight: 620;
      background: #17201d;
      border-radius: 10px;
      box-shadow: var(--shadow);
      transform: translateX(50%);
      animation: toast-in 180ms ease-out;
    }

    .hidden { display: none !important; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes dot {
      0%, 80%, 100% { opacity: .3; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-2px); }
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translate(50%, 6px); }
      to { opacity: 1; transform: translate(50%, 0); }
    }

    /* --- 工厂 / 餐饮 tab --- */
    .tab-switch {
      display: inline-flex;
      flex: 0 0 auto;
      gap: 2px;
      padding: 3px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .tab-switch button {
      padding: 5px 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 640;
      background: transparent;
      border: 0;
      border-radius: 8px;
      transition: background-color 180ms ease, color 180ms ease;
    }

    .tab-switch button[aria-pressed="true"] {
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 1px 4px rgb(23 32 29 / 10%);
    }

    /* 餐饮 tab: 全局 accent 切为暖调, 其余组件自动跟随 */
    .app.tab-restaurant {
      --accent: #9a5423;
      --accent-strong: #7c431b;
      --accent-soft: #f4ebdf;
    }

    @keyframes tab-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    .tab-anim { animation: tab-in 220ms cubic-bezier(.16, 1, .3, 1); }

    /* --- 学习模式 (纯静态, 零 token) --- */
    .learn-launch {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin-top: 14px;
      padding: 14px 16px;
      text-align: left;
      color: var(--ink);
      background: var(--accent-soft);
      border: 1px solid transparent;
      border-radius: 12px;
      transition: border-color 160ms ease, transform 160ms ease;
    }

    .learn-launch:hover { border-color: var(--accent); }
    .learn-launch:active { transform: scale(.99); }

    .learn-launch svg {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      color: var(--accent-strong);
      fill: none;
      stroke: currentcolor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .learn-launch strong {
      display: block;
      font-size: 14px;
      font-weight: 700;
    }

    .learn-launch em {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      font-style: normal;
    }

    .learn {
      display: flex;
      justify-content: center;
      padding: 22px 20px 30px;
    }

    .learn-card { width: min(100%, 640px); }

    .learn-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .learn-kicker {
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 700;
    }

    .learn-dots {
      display: flex;
      flex: 1;
      gap: 6px;
      justify-content: center;
    }

    .learn-dots i {
      width: 6px;
      height: 6px;
      background: var(--line);
      border-radius: 50%;
      transition: background-color 200ms ease, transform 200ms ease;
    }

    .learn-dots i.on {
      background: var(--accent);
      transform: scale(1.3);
    }

    .learn-exit {
      padding: 4px 8px;
      color: var(--muted);
      font-size: 12px;
      background: transparent;
      border: 0;
      border-radius: 8px;
    }

    .learn-exit:hover { color: var(--ink); background: var(--soft); }

    .lesson {
      padding: 22px 22px 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .lesson h3 {
      margin: 0 0 12px;
      font-size: 19px;
      font-weight: 740;
      letter-spacing: -.01em;
      text-wrap: balance;
    }

    .lesson-body { font-size: 14px; line-height: 1.7; }
    .lesson-body p { margin: 0 0 10px; }
    .lesson-body ul { margin: 0 0 10px; padding-left: 19px; }
    .lesson-body li { margin-bottom: 5px; }
    .lesson-body strong { font-weight: 700; }

    .lesson-note {
      margin-top: 12px;
      padding: 10px 14px;
      color: var(--accent-strong);
      font-size: 13px;
      line-height: 1.6;
      background: var(--accent-soft);
      border-radius: 10px;
    }

    .learn-asks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .learn-asks-label {
      width: 100%;
      color: var(--subtle);
      font-size: 12px;
    }

    .learn-asks button {
      padding: 7px 14px;
      color: var(--accent-strong);
      font-size: 13px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      transition: background-color 150ms ease, border-color 150ms ease;
    }

    .learn-asks button:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

      /* 学习模式课程 — 预编排静态内容, 除「深入问一问」外零网络请求 */

      var toastTimer;

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function renderInline(value) {
        var safe = escapeHtml(value);
        safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
        safe = safe.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
        safe = safe.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|\/[^\s)]+)\)/g, function (_, label, href) {
          return '<a href="' + href + '" target="_blank" rel="noopener">' + label + '</a>';
        });
        return safe;
      }

      function renderMarkdown(markdown) {
        var lines = String(markdown || '').replace(/\r\n/g, '\n').split('\n');
        var html = [];
        var paragraph = [];
        var listType = null;
        var inCode = false;
        var codeLines = [];

        function flushParagraph() {
          if (!paragraph.length) return;
          html.push('<p>' + paragraph.map(renderInline).join('<br>') + '</p>');
          paragraph = [];
        }

        function closeList() {
          if (!listType) return;
          html.push('</' + listType + '>');
          listType = null;
        }

        function openList(type) {
          if (listType === type) return;
          closeList();
          html.push('<' + type + '>');
          listType = type;
        }

        for (var i = 0; i < lines.length; i += 1) {
          var line = lines[i];

          if (/^```/.test(line.trim())) {
            flushParagraph();
            closeList();
            if (inCode) {
              html.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>');
              codeLines = [];
              inCode = false;
            } else {
              inCode = true;
            }
            continue;
          }

          if (inCode) {
            codeLines.push(line);
            continue;
          }

          if (/^\|.+\|\s*$/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
            flushParagraph();
            closeList();
            var tableLines = [line];
            i += 2;
            while (i < lines.length && /^\|.+\|\s*$/.test(lines[i])) {
              tableLines.push(lines[i]);
              i += 1;
            }
            i -= 1;
            var table = '<div class="table-wrap"><table>';
            tableLines.forEach(function (row, rowIndex) {
              var cells = row.split('|').slice(1, -1).map(function (cell) { return cell.trim(); });
              var tag = rowIndex === 0 ? 'th' : 'td';
              table += '<tr>' + cells.map(function (cell) { return '<' + tag + '>' + renderInline(cell) + '</' + tag + '>'; }).join('') + '</tr>';
            });
            table += '</table></div>';
            html.push(table);
            continue;
          }

          var heading = line.match(/^(#{2,4})\s+(.+)$/);
          if (heading) {
            flushParagraph();
            closeList();
            var level = heading[1].length;
            html.push('<h' + level + '>' + renderInline(heading[2]) + '</h' + level + '>');
            continue;
          }

          var unordered = line.match(/^\s*[-*]\s+(.+)$/);
          if (unordered) {
            flushParagraph();
            openList('ul');
            html.push('<li>' + renderInline(unordered[1]) + '</li>');
            continue;
          }

          var ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
          if (ordered) {
            flushParagraph();
            openList('ol');
            html.push('<li>' + renderInline(ordered[1]) + '</li>');
            continue;
          }

          if (!line.trim()) {
            flushParagraph();
            closeList();
            continue;
          }

          closeList();
          paragraph.push(line);
        }

        if (inCode) html.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>');
        flushParagraph();
        closeList();
        return html.join('');
      }

      /* ---------- SSE 帧解析（对齐 mobile-rest-ai/src/sse.ts，ES5 风格） ---------- */

      function splitSseFrames(input) {
        var normalized = input.replace(/\r\n/g, '\n');
        var frames = [];
        var start = 0;
        var index = normalized.indexOf('\n\n');
        while (index !== -1) {
          var frame = normalized.slice(start, index);
          if (frame.replace(/^\s+|\s+$/g, '')) frames.push(frame);
          start = index + 2;
          index = normalized.indexOf('\n\n', start);
        }
        return { frames: frames, rest: normalized.slice(start) };
      }

      function parseSseFrame(frame) {
        var event = 'message';
        var data = [];
        var lines = frame.split('\n');
        for (var i = 0; i < lines.length; i += 1) {
          var line = lines[i];
          if (!line || line.charAt(0) === ':') continue;
          var separator = line.indexOf(':');
          var field = separator === -1 ? line : line.slice(0, separator);
          var value = separator === -1 ? '' : line.slice(separator + 1);
          if (value.charAt(0) === ' ') value = value.slice(1);
          if (field === 'event') {
            event = value || 'message';
          } else if (field === 'data') {
            data.push(value);
          }
        }
        if (!data.length && event === 'message') return null;
        return { event: event, data: data.join('\n') };
      }

      /* 后端 data 段是 json.dumps 序列化的（字符串带引号，done 是对象）——先解 JSON */
      function parseSseData(raw) {
        try { return JSON.parse(raw); } catch (_) { return raw; }
      }

        } : {

      /* 旧的非流式请求 — 仅作为流式端点在收到任何 chunk 前失败时的一次性回退 */
      function legacyAnswer(body, controller) {
        var timeout = window.setTimeout(function () { controller.abort(); }, 45000);
        var clear = function () { window.clearTimeout(timeout); };
        return fetch(CHAT_ENDPOINT, {

        }).then(function (response) {
          return response.text().then(function (text) {
            var payload = {};
            try { payload = text ? JSON.parse(text) : {}; } catch (_) { payload = {}; }
            if (!response.ok || payload.success === false) {
              var serverMessage = typeof payload.message === 'string' && payload.message.length <= 240
                ? payload.message
                : '';
              throw new Error(serverMessage || ('请求失败（HTTP ' + response.status + '）'));
            }
            return payload;
          });
        }).then(function (payload) { clear(); return payload; }, function (error) { clear(); throw error; });
      }

      /*
       * 流式请求：读取 ReadableStream，解析 SSE 帧，chunk 渐进渲染（~80ms 节流），
       * status 更新占位标签，逐 chunk 空闲超时 30s（长回答不会被固定总超时切断）。
       * resolve → { answer, sources }；reject 的 error 带 fallbackEligible 标记
       * （true = 未收到任何 chunk，可透明回退非流式端点）。
       */
      function streamAnswer(body, placeholder, controller) {
        var statusLabel = placeholder.shell.querySelector('.assistant-status span');
        var markdownBody = placeholder.shell.querySelector('.markdown-body');
        var accumulated = '';
        var gotChunk = false;
        var doneData = null;
        var closed = false;
        var idleTimer = null;
        var idleTimedOut = false;
        var renderScheduled = false;
        var lastRender = 0;

        function armIdle() {
          window.clearTimeout(idleTimer);
          idleTimer = window.setTimeout(function () {
            idleTimedOut = true;
            controller.abort();
          }, SSE_IDLE_TIMEOUT_MS);
        }

        function disarmIdle() { window.clearTimeout(idleTimer); }

        function renderPartial() {
          renderScheduled = false;
          if (closed) return;
          lastRender = Date.now();
          markdownBody.innerHTML = renderMarkdown(accumulated);
          scrollToBottom(false);
        }

        function scheduleRender() {
          if (renderScheduled) return;
          renderScheduled = true;
          var wait = Math.max(0, 80 - (Date.now() - lastRender));
          window.setTimeout(function () { requestAnimationFrame(renderPartial); }, wait);
        }

        function setStatus(text) {
          if (statusLabel) statusLabel.textContent = text;
        }

        function streamError(message) {
          var error = new Error(message);
          error.fallbackEligible = !gotChunk;
          return error;
        }

        function handleFrame(frame) {
          var parsed = parseSseFrame(frame);
          if (!parsed) return;
          var data = parseSseData(parsed.data);
          if (parsed.event === 'status') {
            if (typeof data === 'string' && data) setStatus(data);
          } else if (parsed.event === 'chunk') {
            if (typeof data === 'string' && data) {
              if (!gotChunk) setStatus('正在回答');
              gotChunk = true;
              accumulated += data;
              scheduleRender();
            }
          } else if (parsed.event === 'done') {
            doneData = data && typeof data === 'object' ? data : {};
          } else if (parsed.event === 'error') {
            throw streamError(typeof data === 'string' && data ? data : '回答生成失败，请稍后重试。');
          }
        }

        return fetch(CHAT_STREAM_ENDPOINT, {
          method: 'POST',
          signal: controller.signal,
          headers: { 'Content-Type': 'application/json' },
          body: body
        }).then(function (response) {
          if (!response.ok) throw streamError('流式请求失败（HTTP ' + response.status + '）');
          if (!response.body || typeof response.body.getReader !== 'function') {
            throw streamError('当前浏览器不支持流式响应');
          }
          var reader = response.body.getReader();
          var decoder = new TextDecoder();
          var buffer = '';
          armIdle();

          function pump() {
            return reader.read().then(function (step) {
              disarmIdle();
              var i;
              if (step.done) {
                var tail = decoder.decode();
                if (tail) buffer += tail;
                if (buffer) {
                  var flush = splitSseFrames(buffer + '\n\n');
                  for (i = 0; i < flush.frames.length; i += 1) handleFrame(flush.frames[i]);
                  buffer = '';
                }
                return null;
              }
              armIdle();
              buffer += decoder.decode(step.value, { stream: true });
              var split = splitSseFrames(buffer);
              buffer = split.rest;
              for (i = 0; i < split.frames.length; i += 1) handleFrame(split.frames[i]);
              return pump();
            });
          }

          return pump().then(function () {
            disarmIdle();
            closed = true;
            if (doneData) {
              var answer = typeof doneData.answer === 'string' && doneData.answer
                ? doneData.answer
                : accumulated;
              return { answer: answer, sources: doneData.sources || [] };
            }
            throw streamError('流式回答中断，请重试。');
          }, function (error) {
            try { reader.cancel(); } catch (_) { /* reader 可能已关闭 */ }
            throw error;
          });
        }).catch(function (error) {
          disarmIdle();
          closed = true;
          if (idleTimedOut) {
            var timeoutError = new Error('回答超时');
            timeoutError.name = 'AbortError';
            timeoutError.isIdleTimeout = true;
            throw timeoutError;
          }
          if (error && typeof error.fallbackEligible === 'undefined') {
            error.fallbackEligible = !gotChunk;
          }
          throw error;
        });
      }

      function sendQuestion(rawQuestion, fromRetry) {
        if (state.sending) return;
        var question = String(rawQuestion == null ? questionInput.value : rawQuestion).trim();
        if (!question && !state.imageData) return;
        if (!question) question = '请根据截图说明当前页面的功能、下一步操作和需要注意的阻塞条件。';

        var priorHistory = historyPayload();
        var imageData = fromRetry ? null : state.imageData;
        if (!fromRetry) {
          appendUserMessage(question, imageData);
          state.messages.push(createMessageRecord('user', question));
          persistSession();
        }

        questionInput.value = '';
        clearAttachment();
        setSending(true);

        var placeholder = createAssistantPlaceholder();
        var controller = new AbortController();
        state.controller = controller;
        var body = requestPayload(question, priorHistory, imageData);

        function finalize(answer, sources) {
          var text = typeof answer === 'string' && answer.trim()
            ? answer.trim()
            : '知识库没有返回可显示的答案，请换一种方式描述当前页面或问题。';
          finishAssistant(placeholder, text, sources || []);
          state.messages.push(createMessageRecord('assistant', text));
          persistSession();
          loadRelated(placeholder.shell, question, text);
        }

        streamAnswer(body, placeholder, controller).then(function (result) {
          finalize(result.answer, result.sources);
        }, function (error) {
          /* 流式在收到任何 chunk 之前失败（网络/404/500/浏览器不支持）→
             透明回退旧的非流式端点重试一次，页面不回退。
             已收到 chunk 后不再回退（直接展示错误 + 重试按钮）。 */
          if (error && error.fallbackEligible && error.name !== 'AbortError' && !controller.signal.aborted) {
            return legacyAnswer(body, controller).then(function (payload) {
              finalize(payload.answer, payload.sources || []);
            });
          }
          throw error;
        }).catch(function (error) {
          var message = error && error.name === 'AbortError'
            ? '请求已超时或被中止。请检查网络后重试；如果问题很长，可以先只问当前一步。'
            : (error && error.message) || '网络请求失败，请稍后重试。';
          showAssistantError(placeholder, question, message);
        }).then(function () {
          if (state.controller === controller) state.controller = null;
          setSending(false);
          questionInput.focus();
        });
      }

      function resizeAndEnable() { updateComposer(); }

      function handleAttachment(file) {
        if (!file) return;
        if (!/^image\//.test(file.type)) {
          showToast('请选择图片文件');
          return;
        }
        if (file.size > 12 * 1024 * 1024) {
          showToast('图片请小于 12 MB');
          return;
        }
        var reader = new FileReader();
        reader.onload = function (event) {
          var dataUrl = event.target && event.target.result;
          if (typeof dataUrl !== 'string') return;
          var image = new Image();
          image.onload = function () {
            var maxWidth = 1280;
            var width = image.width;
            var height = image.height;
            if (width > maxWidth) {
              height = Math.round(height * maxWidth / width);
              width = maxWidth;
            }
            var canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            var context = canvas.getContext('2d');
            context.fillStyle = '#ffffff';
            context.fillRect(0, 0, width, height);
            context.drawImage(image, 0, 0, width, height);
            state.imageData = canvas.toDataURL('image/jpeg', .84);
            state.imageName = file.name;
            attachmentImage.src = state.imageData;
            attachmentName.textContent = file.name + ' · 已压缩用于识别';
            attachmentPreview.classList.add('visible');
            updateComposer();
          };
          image.onerror = function () { showToast('无法读取这张图片'); };
          image.src = dataUrl;
        };
        reader.onerror = function () { showToast('读取图片失败'); };
        reader.readAsDataURL(file);
      }

      function startNewConversation() {
        if (state.controller) state.controller.abort();
        state.controller = null;
        state.messages = [];
        state.sending = false;
        messageList.innerHTML = '';
        messageList.classList.add('hidden');
        welcome.classList.remove('hidden');
        clearAttachment();
        questionInput.value = '';
        updateComposer();
        try { sessionStorage.removeItem(TABS[state.tab].storageKey); } catch (_) { /* optional */ }
        feed.scrollTop = 0;
        questionInput.focus();
        showToast('已开始新对话');
      }

      function restoreSession() {
        try {
          var saved = JSON.parse(sessionStorage.getItem(TABS[state.tab].storageKey) || 'null');
          if (!saved || !Array.isArray(saved.messages)) return;
          saved.messages.slice(-20).forEach(function (message) {
            if (!message || typeof message.content !== 'string') return;
            if (message.role === 'user') {
              appendUserMessage(message.content, null);
            } else if (message.role === 'assistant') {
              var placeholder = createAssistantPlaceholder();
              finishAssistant(placeholder, message.content, []);
            }
            state.messages.push(createMessageRecord(message.role, message.content));
          });
          if (state.messages.length) scrollToBottom(true);
        } catch (_) {
          try { sessionStorage.removeItem(TABS[state.tab].storageKey); } catch (_) { /* optional */ }
        }
      }

      /* ---------- 工厂 / 餐饮 tab ---------- */

      function applyTabChrome(animate) {
        var config = TABS[state.tab];
        $('assistant-title').textContent = config.title;
        $('assistant-subtitle').textContent = config.subtitle;
        var manualLink = $('manual-link');
        manualLink.href = config.manualHref;
        manualLink.setAttribute('aria-label', config.manualAria);
        questionInput.placeholder = config.placeholder;
        if (animate) {
          var card = $('welcome-card');
          card.classList.remove('tab-anim');
          void card.offsetWidth;
          card.classList.add('tab-anim');
        }
      }


      /* ---------- 学习模式 (纯静态) ---------- */




      Array.prototype.forEach.call(document.querySelectorAll('.suggestion'), function (button) {
        button.addEventListener('click', function () { sendQuestion(button.dataset.question || ''); });
      });

      $('more-toggle').addEventListener('click', function () {
        var more = $('more-suggestions');
        var opening = more.hidden;
        more.hidden = !opening;
        this.setAttribute('aria-expanded', opening ? 'true' : 'false');
        this.textContent = opening ? '收起示例问题' : '更多示例问题';
      });

      feed.addEventListener('scroll', function () { state.stickToBottom = isNearBottom(); }, { passive: true });
      questionInput.addEventListener('input', resizeAndEnable);
      questionInput.addEventListener('compositionstart', function () { state.composing = true; });
      questionInput.addEventListener('compositionend', function () { state.composing = false; updateComposer(); });
      questionInput.addEventListener('keydown', function (event) {
        if (state.composing || event.isComposing || event.key !== 'Enter' || event.shiftKey) return;
        var coarsePointer = window.matchMedia('(pointer: coarse)').matches;
        if (coarsePointer && !event.ctrlKey && !event.metaKey) return;
        event.preventDefault();
        sendQuestion();
      });

      composer.addEventListener('submit', function (event) {
        event.preventDefault();
        sendQuestion();
      });

      attachmentInput.addEventListener('change', function () {
        handleAttachment(attachmentInput.files && attachmentInput.files[0]);
      });
      $('remove-attachment').addEventListener('click', clearAttachment);
      $('new-chat').addEventListener('click', startNewConversation);



      try {
      } catch (_) { /* optional */ }
      applyTabChrome(false);
      restoreSession();
      updateComposer();
    }());
  </script>
</body>
</html>
