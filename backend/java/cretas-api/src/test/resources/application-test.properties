# ==========================================
# CI / Unit Test Configuration
# ==========================================
# H2 in PostgreSQL compatibility mode — no external DB required

# 应用配置
spring.application.name=Cretas CI Test
server.port=0

# H2 in-memory with PostgreSQL compatibility
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=MONTH,YEAR,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA 配置
#
# 🔴 2026-08-27: 这里**必须**是 create, ⛔ 不能是 create-drop。
#
# 上面那个 URL 是**全 JVM 共享的一个内存库**(jdbc:h2:mem:testdb + DB_CLOSE_DELAY=-1),
# 而本仓有 83 个 @DataJpaTest 带着 @AutoConfigureTestDatabase(replace = Replace.NONE)
# —— 它们各起一个**独立的切片上下文**, 但连的是这同一个共享库。
#
# create-drop 会在 **SessionFactory 关闭时** drop 掉全部 427 张表。
# 于是任何一个切片上下文被 Spring 的测试上下文缓存驱逐(默认上限 32, 而套件里
# @SpringBootTest 就有 37 个)时, 共享库的 schema 就没了 ——
# **而其它仍在缓存里的上下文不会重建它**, 之后所有测试一律「Table not found」。
#
# 2026-08-27 CI 实测(夜间跑批完整日志):
#   05:36:12  BomRecipeDraftLifecycleJpaTest 启动后不久, 427 条 drop table ... cascade
#   之后到失败为止, create table 出现 **0 次**
#   05:36:30  ProcessSheetServiceImplTest 28 条全 error, 耗时 0.214 秒
#             (setUp 里 userRepository.saveAndFlush -> Table "users" not found)
#   连锁中招: ProcessSheet 系列 4 个类 38 条 + 另外 3 个类 11 条 = **49 条**
#
# ⚠️ 这在本机复现不出来 —— surefire 的类执行顺序在 macOS 与 Windows 上不同,
#    污染源没排在它们前面。本机全量 11888 个测试里这 49 条全绿。
#    **「本机跑绿」对这一类问题没有证明力。**
#
# 本机实测两种取值的差别(强制驱逐 maxSize=1, 跑同一个 @DataJpaTest):
#   create-drop -> drop table 854 次 (启动 427 + **关闭 427**), create table 430 次
#   create      -> drop table 427 次 (只有启动)               , create table 430 次
# ⇒ create 恰好消掉「关闭时那 427 次」, 且**不改变启动行为** —— 严格更安全。
#
# ⛔ 不要改回 create-drop 来「让每个测试拿到干净的库」: 它清的不是自己的库,
#    是所有人共用的那个。要隔离就给切片测试单独的 URL, 不要动这一行。
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

# 禁用 SQL 初始化
spring.sql.init.mode=never

# 禁用 Flyway
spring.flyway.enabled=false

# 日志配置
logging.level.root=WARN
logging.level.com.cretas.aims=DEBUG
logging.level.com.cretas.aims.test=DEBUG

# JWT 配置 (测试用)
cretas.jwt.secret=test-secret-key-for-unit-tests-only
cretas.jwt.expiration=3600000
cretas.jwt.refresh-expiration=86400000

# A5 集团联销 feature flag (CI 默认 false, 单测可通过 @TestPropertySource 覆盖)
cretas.sales.cross-factory.enabled=false

# ==========================================
# AI 复杂度路由配置
# ==========================================
ai.complexity.lambda=0.7
ai.complexity.fast-threshold=0.3
ai.complexity.analysis-threshold=0.6
ai.complexity.multi-agent-threshold=0.8

# ==========================================
# AI Agent 编排配置
# ==========================================
ai.agent.complexity-threshold=0.6
ai.agent.max-retry-rounds=3
ai.agent.enable-human-review=true

# ==========================================
# CRAG 检索评估配置
# ==========================================
ai.retrieval.correct-threshold=0.8
ai.retrieval.ambiguous-threshold=0.5
ai.retrieval.enable-fallback=true

# ==========================================
# 知识反馈配置
# ==========================================
ai.feedback.batch-size=50
ai.feedback.enable-auto-learning=false

# ==========================================
# DJL Embedding 配置 (测试时禁用实际模型加载)
# ==========================================
embedding.model-path=
embedding.enabled=false

# ==========================================
# DashScope 配置 (测试时使用 Mock)
# ==========================================
dashscope.api-key=test-api-key
dashscope.enabled=false

# ==========================================
# 外部服务禁用 (CI 环境无需连接)
# ==========================================
python-smartbi.enabled=false
python-classifier.enabled=false

# SmartBI Postgres 第二数据源禁用 (CI 环境无外部 PostgreSQL)
# 默认 application.properties 设了 true,这里在 test profile 显式覆盖,
# 否则 SmartBIPostgresDataSourceConfig 会尝试连 localhost:5432 PG 失败 →
# 全部 @SpringBootTest 加载 ApplicationContext 失败 (e.g. IntentParityTest 40/40 fail)
smartbi.postgres.enabled=false

# Redis 禁用 (CI 无 Redis)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# gRPC Embedding 客户端禁用
grpc.client.embedding-service.negotiationType=PLAINTEXT
grpc.client.embedding-service.address=static://localhost:9090

# ==========================================
# 盘点月底约束 (test profile 设 1 = 任意日期可发起)
# prod 默认 29，不改生产行为
# ==========================================
cretas.stocktake.month-end-threshold=1
