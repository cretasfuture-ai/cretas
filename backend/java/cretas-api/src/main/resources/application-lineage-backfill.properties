# ==========================================
# 一次性历史血缘回填进程 (profile: lineage-backfill)
# ==========================================
# 用法 (必须排在 pg-prod 之后, 让这里的值覆盖 pg-prod):
#   SPRING_PROFILES_ACTIVE=pg-prod,lineage-backfill LINEAGE_BACKFILL_FACTORIES=F006 \
#     LINEAGE_BACKFILL_DRY_RUN=true java -jar aims-0.0.1-SNAPSHOT.jar
# 完整说明与退出码见 dev/lineage/LineageBackfillRunner.java。
#
# 这个进程和线上实例共用同一个 jar、同一个库。它只该做一件事 —— 跑回填然后退出。
# 下面每一行都是在关掉「启动就会动手」的东西; 调度 / MQTT / WebSocket / 启动监听器
# 另外在代码里用 @Profile / @EventListener(condition) 关掉 (见 LineageBackfillMode),
# 因为配置文件里的值会被同名环境变量盖掉, 而那几样一旦漏开就会和线上各跑一份。

# 不开 web 端口: 线上蓝绿槽在 10010 / 10020 交替, management 在 10012。
# 运行时还有一道闸: Runner 发现自己跑在 web 容器里会拒绝执行并以退出码 3 结束。
spring.main.web-application-type=none

# 懒加载: 只创建回填依赖图里的 bean。
# 其余 bean 的 @PostConstruct 副作用 (Canvas 动态调度装载、工具向量写库、方言预置写库、
# Python/gRPC 健康检查线程、MCP 外呼发现、审计写线程 ...) 因此根本不会发生。
# 运行时闸: Runner 启动前检查这些 bean 都没被实例化, 有一个就拒绝执行 (退出码 3)。
spring.main.lazy-initialization=true

# 不打 banner, 日志只留回填本身
spring.main.banner-mode=off

# 回填是串行的单线程读写, 不需要线上那 30 / 10 的连接池 (别从线上实例手里抢连接)
spring.datasource.hikari.pool-name=CretasLineageBackfillPool
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

# 冗余保险 (代码里已用 profile 关掉; 这里写明意图)
mqtt.enabled=false
cretas.indicator.recompute-on-startup=false
