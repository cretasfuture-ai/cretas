server {
    listen 80;
    server_name download.cretaceousfuture.com;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/acme; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name download.cretaceousfuture.com;
    ssl_certificate /etc/letsencrypt/live/cretas-gw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cretas-gw/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    root /www/wwwroot/download;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location ~* \.html$ { add_header Cache-Control "no-cache"; }
}
