# 2026-11-12: 网关并入 47 后 nginx 没开压缩, 网页 37M 静态资源按原大小传,
# 首次加载大量请求超时 / ERR_CONNECTION_CLOSED。只压文本类; 图片、OTA 包 (已压缩) 不动。
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    image/svg+xml
    font/ttf
    application/vnd.ms-fontobject;
