server {
    listen 80;
    server_name ota.cretaceousfuture.com;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/acme; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name ota.cretaceousfuture.com;
    ssl_certificate /etc/letsencrypt/live/cretas-gw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cretas-gw/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Block scanner / probe noise just like the api vhost does.
    location ~* \.(git|svn|hg|bzr)(/|$) { return 444; }
    location ~* /\.env { return 444; }
    location = /favicon.ico { log_not_found off; access_log off; return 204; }

    # Everything under /api/ota/ → cretas_python upstream on 47:8083.
    # We keep the /api/ota/ prefix (no path rewrite) so the Python router
    # registration in main.py doesn't have to change — the manifest URLs
    # emitted by manifest_builder._asset_url stay self-consistent across
    # the nginx hop.
    location /api/ota/ {
        proxy_pass http://cretas_python;

        # NOTE: we do NOT `include cretas-python-proxy-defaults.conf` here.
        # Nginx forbids duplicate directives in the same location block, and
        # the defaults file already sets proxy_read_timeout (120s) +
        # proxy_send_timeout (60s) which would conflict with our overrides
        # below. Inline-write all directives so we can tune timeouts for the
        # OTA workload (bundle/asset transfers run longer than SmartBI JSON).

        # Forward headers (mirror defaults)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTP/1.1 + keep-alive + streaming
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;

        # OTA-tuned timeouts — bundles + assets can run to tens of MB and
        # mobile network downloads may stream slowly.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;

        # Bundle upload + manifest body size ceiling.
        client_max_body_size 50M;

        # CORS (mirror defaults) so Expo client preflight passes.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
    }

    # Catch-all on this vhost returns 404 — OTA endpoints are explicit only.
    # Prevents accidental exposure if someone misroutes a path here.
    location / {
        return 404;
    }
}
