server {
    listen 80;
    server_name aiassist.cretaceousfuture.com;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/acme; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name aiassist.cretaceousfuture.com;
    ssl_certificate /etc/letsencrypt/live/cretas-gw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cretas-gw/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    root /www/wwwroot/web-admin;
    location = / { try_files /aiassist.html =404; add_header Cache-Control "no-cache"; }
    location / { try_files $uri =404; }
    location /api/food-kb/ {
        proxy_pass http://cretas_python;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
