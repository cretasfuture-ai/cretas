# 2026-11-04 Steve: /api/mobile/{word}/... reached handlers anonymously. A stop-gap until the Java gate (#1448) is live.
# nginx cannot verify a token: this stops requests with no credential, not one with a forged header.
map $http_authorization $cretas_has_bearer {
    default 0;
    "~^Bearer [A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$" 1;
}
map "$cretas_has_bearer$cookie_cretas_access_token$cookie_cretas_web_session" $cretas_has_cred {
    default 1;
    "0" 0;
}
# $uri: normalized, so //api/mobile/... cannot slip past. First match wins. 0 = open, 1 = needs a credential, 2 = closed.
map $uri $cretas_word_path {
    default 0;
    # 2026-11-05: temp tokens carry no purpose, so a registration token resets any factory's account. SMS is not wired: nothing uses these.
    "~^/api/mobile/auth/(forgot-password|send-verification-code|verify-reset-code)$" 2;
    "~^/api/mobile/public/share/[^/]+$" 0;
    "~^/api/mobile/health$" 0;
    "~^/api/mobile/auth/(me|validate|change-password|demo-login|forgot-password|logout|refresh|register-phase-one|register-phase-two|reset-password|send-verification-code|unified-login|verify-reset-code|login|token)$" 0;
    "~^/api/mobile/activation/activate$" 0;
    "~^/api/mobile/scale-protocols(/brand-models(/[^/]+)?|/brands|/[^/]+)?$" 0;
    "~^/api/mobile/system/(health|info|release-notes|status)$" 0;
    "~^/api/mobile/voice/(formats|health|recognize)$" 0;
    "~^/api/mobile/workflow/(node-schemas(/[^/]+)*|validate)$" 0;
    "~^/api/mobile/public(/|$)" 2;
    "~^/api/mobile/(system|voice|auth|activation|health|workflow|admin|smartbi-config|scheduled-tasks|dashboard|scale-protocols|edge)(/|$)" 1;
}
map "$request_method:$cretas_word_path:$cretas_has_cred" $cretas_word_denied {
    default 0;
    "~^OPTIONS:" 0;
    "~:2:" 1;
    "~:1:0$" 1;
}
