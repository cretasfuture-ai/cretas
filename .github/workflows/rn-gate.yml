name: RN Gate

# 为什么是独立 workflow 而不是给 ci.yml 的 rn-test 松绑 (同 web-admin-gate.yml 的判断):
#
# 1. ci.yml 的 `on.push` 带着 `paths: backend/java/cretas-api/**` —— 那是为 Java 制品
#    不变量「那棵树变了 ⟺ CI 被触发」精心写的, 不该为了跑 RN 测试去动它。
# 2. 只把 rn-test 的 `if: inputs.full_audit` 放宽也没用: `inputs.*` 只在
#    workflow_dispatch 时有值, push 事件下恒为空 → 依然 skipped。而纯 RN 改动
#    **根本不会触发 ci.yml**(paths 不含 frontend/)。同一道闸有三个承载点
#    (job 的 if / workflow 的 paths / 事件类型), 只改一个等于没改。
#
# 背景 (2026-08-04): PR #2274 改了 4 个 RN 文件
# (OperatorAssignedProcessScreen / YieldStepReportScreen / operatorAssignedProcess
# 及其测试), 合并前 `rn-test` 全程 **SKIPPED** —— 那次是靠本地全量跑兜住的。
# 也就是说 **RN 改动在 CI 上没有任何闸, PR 绿 ≠ RN 被测过**。
# 这与 web-admin 在 2026-07-31 的处境是同一个形状 (那次两个真缺陷在红里躺了 8 天,
# 缺的不是用例, 是没人断言绿)。
#
# ⚠️ 上闸前提 (照 web-admin-gate 的规矩): 必须在目标环境**已经是绿的**, 否则是把
# 「不可信的绿」换成「挡所有人的红」。实测 origin/main + 本 PR:
#   - `npm ci --legacy-peer-deps --dry-run` → up to date (lockfile 与 package.json 同步)
#   - `npm test -- --ci --forceExit`        → 92 suites / 1232 tests 全绿, exit 0
#
# 📌 用 npm 而非 ci.yml 里 rn-test 那份的 yarn: 仓里 yarn.lock 与 package-lock.json
#    并存, 但 package.json 与 **package-lock.json 是同一个 commit** 更新的
#    (a774bf0a62), yarn.lock 走的是另一条 (61d0c5fb51) —— 用维护中的那个,
#    也与 web-admin-gate 的 `npm ci --legacy-peer-deps` 保持一致。
#
# 📌 只跑单测。jest.config.js 里 testPathIgnorePatterns 仍豁免 3 个
#    integration/screens/* (@react-navigation ESM transform 债, 与本闸无关);
#    tsc / build 仍留在 ci.yml 的 full_audit 里 —— 本 workflow 的目的是让
#    「套件绿」重新成为可信信号, 不是把整轮审计搬到每次 push。

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/CretasFoodTrace/**'
      - '.github/workflows/rn-gate.yml'
      # 🔴 2026-08-27: 下面这些是 RN 的契约测试用 readFileSync **真读**的后端源码
      # (transferEnumLabels / editBatchAccountFieldsLockContract / warehouseBatchAllocation
      #  等，做枚举标签、字段锁、批次分配口径的两份一致比对)。
      # 建元判据闸当天实测: 7 个文件被读着, 而触发面里一个都没有 ——
      # 一个**只改 Java 枚举**的 PR 恰好是这几道闸要守的那类漂移, 而它们看不见它。
      # ⚠️ 以后新增读后端源码的测试, 必须同步加到这里, 否则
      #    frontend/CretasFoodTrace/src/__tests__/gates/gateTriggerSurfaceCoversWhatItReads.test.ts 会红。
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/entity/enums/**'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/service/impl/MaterialBatchServiceImpl.java'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/service/impl/PermissionServiceImpl.java'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/service/inventory/impl/SalesServiceImpl.java'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/service/sales/impl/SalesDeliveryBatchAllocationServiceImpl.java'
  pull_request:
    paths:
      - 'frontend/CretasFoodTrace/**'
      - '.github/workflows/rn-gate.yml'
      # 🔴 2026-08-27: 下面这些是 RN 的契约测试用 readFileSync **真读**的后端源码
      # (transferEnumLabels / editBatchAccountFieldsLockContract / warehouseBatchAllocation
      #  等，做枚举标签、字段锁、批次分配口径的两份一致比对)。
      # 建元判据闸当天实测: 7 个文件被读着, 而触发面里一个都没有 ——
      # 一个**只改 Java 枚举**的 PR 恰好是这几道闸要守的那类漂移, 而它们看不见它。
      # ⚠️ 以后新增读后端源码的测试, 必须同步加到这里, 否则
      #    frontend/CretasFoodTrace/src/__tests__/gates/gateTriggerSurfaceCoversWhatItReads.test.ts 会红。
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/entity/enums/**'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/service/impl/MaterialBatchServiceImpl.java'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/service/impl/PermissionServiceImpl.java'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/service/inventory/impl/SalesServiceImpl.java'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/service/sales/impl/SalesDeliveryBatchAllocationServiceImpl.java'

concurrency:
  group: rn-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    # 2026-08-26: 组织 Actions 免费额度(2000 分钟/月)用尽后, 托管 runner 起不来
    #   —— job 2~4 秒、0 个 step、无日志地失败。改用自建 runner(139, 4 核/7G)。
    # ⚠️ 用具体标签 `cretas` 而不是裸 `self-hosted`: 将来多一台 runner 时
    #    裸标签会被任意机器接走, 具名标签不会。
    # 实测资源(vitest 3300+ 用例): 4分41秒 / 峰值内存 1.2G / CPU 350%。
    # 服务侧已加 Nice=10 CPUWeight=50 MemoryMax=3G, 让它抢不过业务进程。
    # CI runner 路由: **默认走托管**(快 1~2 倍、干净机器), 额度耗尽时切到自建。
    #   切换: `python scripts/ci/switch_ci_runner.py self-hosted` (或 hosted) 然后提交。
    #   ⛔ 别用组织变量 `${{ vars.X }}` —— 实测在 `runs-on` 里读到的是空。
    #   详见 .claude/rules/ci-runner-routing.md (= .codex/rules/ 同名文件)
    # ⚠️ 这里**不能**用 `${{ vars.X }}` 做路由 —— 实测 job 被派成 labels=ubuntu-latest,
    #    即 vars 在 `runs-on` 求值时读到的是空(它在 job 编排阶段求值, 上下文比步骤里窄)。
    #    配置本身没问题: 变量 visibility=all、组织变量对本仓可见、创建早于 run。
    # ⇒ 改用**分支/文件**级切换: 平时保持 ubuntu-latest;
    #    额度耗尽时执行 `python scripts/ci/switch_ci_runner.py self-hosted` 并提交,
    #    额度恢复时 `... hosted`。一条命令改三个文件, 有闸钉着三处一致。
    runs-on: [self-hosted, cretas]
    # 2026-09-15: 没有超时 + jest 在 CI 下 maxWorkers=50% (WSL 报 16 核 → 8 个 worker, RN 的 jest
    #   每个 ~1G) → 撞主 runner 的 cgroup MemoryHigh=7G 被节流 → 一个 job 跑了 20 小时, runner 连
    #   GitHub 的取消指令都收不到 (TLS 超时), 显示 offline, 之后所有 Java job 落到 4G 的 extra 上 OOM。
    #   两层都修: 超时是兜底, worker 数才是不让它撑爆的那一层 —— 而且必须由 workflow 自己带,
    #   不能依赖某台 runner 单元里恰好有 JEST_MAX_WORKERS (extra 有、主 runner 没有, 这次就是这么漏的)。
    #   正常 8 分钟; 30 分钟远高于正常、远低于 GitHub 默认 6 小时。
    timeout-minutes: 30
    env:
      JEST_MAX_WORKERS: 1
    defaults:
      run:
        working-directory: frontend/CretasFoodTrace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/CretasFoodTrace/package-lock.json
      - run: npm ci --legacy-peer-deps

      # 2026-09-07 (#678 终审 follow-up b): 此前「tsc 0 错」只是本地读数, PR 上没有任何东西跑类型检查。
      # ts-jest 只检查被测试 import 到的文件, 没被任何测试碰到的屏 (大多数) 一个类型错都报不出来。
      - name: TypeScript (tsc --noEmit)
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: npx tsc --noEmit

      # --forceExit: 套件跑完后有 worker 不能优雅退出 (既有情况, ci.yml 的
      # rn-test 同样带这个 flag)。没有它 job 会挂到超时而不是在测试跑完就结束。
      - name: Jest unit tests
        # One warm transform cache avoids per-suite worker cold starts. The
        # single heap stays inside the unchanged 6GiB runner memory boundary.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm test -- --ci --forceExit --runInBand
