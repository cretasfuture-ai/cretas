name: Source Hygiene

# ⛔ **本 workflow 故意不带 `paths:`** —— 这不是遗漏。
#
# 它跑的是**扫全仓**的检查。一道扫全仓的闸，触发面也必须是全仓；
# 把它收窄到任何一个目录，等于把它的覆盖面收窄到那个目录的改动。
#
# ## 它从哪来（2026-08-27）
#
# 原来这个检查是 `backend/java/.../NoLiteralNulByteInSourceContractTest`。
# 它扫的是**全仓**（后缀含 `.ts` `.tsx` `.vue` `.py` `.sql`），
# 但作为一个 JUnit 测试，只有 `backend/java/cretas-api/**` 变化时才会跑
# （`java-gate-pr.yml` 的 paths）。
#
# ⇒ **一个只改 `.ts` / `.vue` / `.py` 的 PR，它一次都不会执行。**
#
# 当天实测：一个新写的 RN 闸文件带着 2 个字面 `0x00` 进了 PR，
# `git` 报 `Bin 0 -> 8343 bytes` —— 是人看 `git show --stat` 发现的，
# 不是闸发现的，因为那道闸根本没被触发。
#
# ⛔ 反过来把 `java-gate-pr.yml` 的 `paths:` 撑成整个仓是错的：
#    那会让每个 PR 都跑 5 分钟 Java，为的只是一个几秒钟的字节扫描。
#
# ## 为什么这件事没有别的信号
#
# 字面 NUL 不会让编译失败、不会让测试变红、IDE 正常显示、
# `git diff` 也多半看不出（git 只探前 8000 字节判二进制）。
# 唯一的症状是「某道源码闸的读数偏小」——
# 而**偏小的读数长得和「没有问题」一模一样**。
#
# 本仓大量依赖源码级扫描闸（黑话闸 / 单位契约闸 / UTC 截断闸 / 变异可达性闸…），
# 一个 NUL 就能让它们对整份文件失明。

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: source-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-literal-nul-bytes:
    runs-on: [self-hosted, cretas]
    steps:
      - uses: actions/checkout@v7

      # ⛔ 这里**不用** `actions/setup-python` —— 它在这台自建 macOS runner 上**必失败**：
      #    它的 macOS 安装脚本把 `/Users/runner` 写死（托管 runner 的用户名就叫 runner），
      #    而本机 `/Users` 不可写 ⇒ `mkdir: /Users/runner: Permission denied`。
      #    `python-gate.yml` / `secret-regression.yml` 里已经记过这件事，
      #    它们的做法是 `if: runner.environment == 'github-hosted'` 把它跳过。
      #    🔴 本闸第一次 run 就是栽在这上面 —— 我按「谁用了 setup-python」grep 出惯例，
      #       却没读它紧挨着的守卫条件。
      #
      #    本脚本**纯标准库、不装任何包**，所以连 python-gate 那套 venv 都不需要，
      #    有个解释器就够。⇒ 直接找一个，并**把用的是哪个打出来**：
      #    「这一轮的读数是在哪个解释器上量的」必须能从日志里读出来。
      #
      # 三态（本仓硬约束 4）：0 干净 / 1 找到了 / 2 这次没量到。
      # ⚠️ rc=2 **必须**与 rc=1 用不同措辞 —— 否则「没量到」会被折叠进「没问题」，
      #    一个跑在空目录里的检查会安静地天天绿，而它一个文件都没看过。
      - name: 扫描字面 NUL 字节
        id: scan
        run: |
          set -e
          PY=""
          for c in python3 python python3.12 python3.11 python3.10; do
            if command -v "$c" >/dev/null 2>&1; then PY="$c"; break; fi
          done
          if [ -z "$PY" ]; then
            echo "✗ 这台 runner 上一个 python 都找不到 —— 本次没量到"
            echo "rc=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "PYTHON_USED=$PY ($("$PY" -c 'import sys;print("%d.%d.%d"%sys.version_info[:3])'))"
          set +e
          "$PY" scripts/ci/check_no_nul_bytes.py --repo . | tee /tmp/nul.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 判定 —— rc=2 这次没量到
        if: steps.scan.outputs.rc == '2'
        run: |
          echo "::error title=NUL 扫描没量到::扫到的源文件数低于下界。本次读数作废，⛔ 不代表没有 NUL。"
          exit 1

      - name: 判定 —— rc=1 有文件对 grep 闸隐形
        if: steps.scan.outputs.rc == '1'
        run: |
          echo "::error title=源码里有字面 NUL 字节::这些文件会被 grep 整份跳过, 所有源码级闸对它们失明。见上方清单。"
          exit 1

      # ── 制品上传策略 ────────────────────────────────────────────────
      #
      # 2026-08-29: GitHub 制品配额打满
      #   "Failed to CreateArtifact: Artifact storage quota has been hit."
      # 于是 java-full-gate 连续三个 PR 报 fail, 而「跑全量」「棘轮」两步全绿,
      # 且它后面那两步「判定」被 skip —— **这道闸连自己的结论都说不出来**。
      #
      # ⚠️ 这个红叉会训练人「java-full-gate 又红了, 不用看」。
      #    下次它因为**真的有新增红**而红时, 同样没人看。
      #
      # 本闸两个方向都守: 诊断制品必须带 continue-on-error(它不是判据),
      # 产物制品**不许**带(那个制品就是产出本身, 传不上去就是真失败)。
      #
      # 与上面那道 NUL 闸同款: 纯标准库、三态、不装任何包。
      - name: 扫描制品上传策略
        id: artifact_policy
        run: |
          set -e
          PY=""
          for c in python3 python python3.12 python3.11 python3.10; do
            if command -v "$c" >/dev/null 2>&1; then PY="$c"; break; fi
          done
          if [ -z "$PY" ]; then
            echo "✗ 这台 runner 上一个 python 都找不到 —— 本次没量到"
            echo "rc=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "PYTHON_USED=$PY"
          set +e
          "$PY" scripts/ci/check_artifact_upload_policy.py --repo . | tee /tmp/artifact_policy.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 判定 —— rc=2 制品策略这次没量到
        if: steps.artifact_policy.outputs.rc == '2'
        run: |
          echo "::error title=制品上传策略没量到::一个 upload-artifact 步骤都没扫到, 或读不到 workflows 目录。本次读数作废。"
          exit 1

      - name: 判定 —— rc=1 制品上传策略不合规
        if: steps.artifact_policy.outputs.rc == '1'
        run: |
          echo "::error title=制品上传策略不合规::诊断制品上传失败不该判死闸; 产物制品上传失败必须判死闸。见上方清单。"
          exit 1

      - name: 定时 workflow 禁止整点 cron
        id: scheduled_cron
        run: |
          PY=""
          for c in python3 python python3.12 python3.11 python3.10; do
            if command -v "$c" >/dev/null 2>&1; then PY="$c"; break; fi
          done
          if [ -z "$PY" ]; then
            echo "✗ 这台 runner 上一个 python 都找不到 —— 本次没量到"
            echo "rc=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          "$PY" scripts/ci/check_scheduled_cron_minutes.py --repo .
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 判定 —— 定时 cron 本次没量到
        if: steps.scheduled_cron.outputs.rc == '2'
        run: |
          echo "::error title=定时 cron 没量到::没有读到任何 schedule cron，本次读数作废。"
          exit 1

      - name: 判定 —— 定时 cron 落在整点
        if: steps.scheduled_cron.outputs.rc == '1'
        run: |
          echo "::error title=定时 cron 落在整点::GitHub 整点高负载时 schedule 易延迟或丢失，见上方精确位置。"
          exit 1

      - name: 判定 —— 扫描退出码不是 0/1/2
        if: >-
          (steps.scan.outputs.rc != '0' && steps.scan.outputs.rc != '1' && steps.scan.outputs.rc != '2')
          || (steps.artifact_policy.outputs.rc != '0' && steps.artifact_policy.outputs.rc != '1' && steps.artifact_policy.outputs.rc != '2')
          || (steps.scheduled_cron.outputs.rc != '0' && steps.scheduled_cron.outputs.rc != '1' && steps.scheduled_cron.outputs.rc != '2')
        run: |
          echo "::error title=退出码不在三态里::scan=${{ steps.scan.outputs.rc }} artifact_policy=${{ steps.artifact_policy.outputs.rc }} scheduled_cron=${{ steps.scheduled_cron.outputs.rc }}"
          echo "三态判定只列了 0/1/2, 任何第四种退出码都会两条判定都不命中 ⇒ 静默落进绿。"
          exit 1
