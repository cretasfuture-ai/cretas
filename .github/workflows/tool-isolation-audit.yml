name: Tool factoryId Isolation Audit (manual)

# P0-1 CI 门禁 — 防止新引入的 AI Tool 漏掉 factoryId 隔离
# 审计脚本会扫描 backend/java/cretas-api/src/main/java/com/cretas/aims/ai/tool/impl/**/*.java
# 如果发现 HIGH 级别漏洞 (factoryId 签名收但未用, 或 deviceService/repo 调用缺 factoryId),
# 脚本 process.exit(1) 阻塞 PR merge.

on:
  workflow_dispatch:

concurrency:
  group: tool-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    name: factoryId Isolation Audit
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tool-factory-isolation-audit
        run: node scripts/audit/tool-factory-isolation-audit.mjs

      - name: Upload audit results
        if: failure()
        # ⛔ 诊断制品上传失败不许判死这道闸 —— 它是给人事后查的, 不是判据本身。
        # 2026-08-29 实测: GitHub 制品配额打满
        #   "Failed to CreateArtifact: Artifact storage quota has been hit."
        # 于是 java-full-gate 连续三个 PR 报 fail, 而「跑全量」和「棘轮」两步都是绿的,
        # 更糟的是它后面那两步「判定」被 skip 掉 —— **这道闸说不出自己的结论**。
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tool-isolation-audit-results
          path: |
            scripts/audit/audit-results.csv
            scripts/audit/audit-results.md
          retention-days: 3

      - name: Post summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'scripts/audit/audit-results.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '## 🔍 Tool factoryId Isolation Audit\n\n' + body,
            });
