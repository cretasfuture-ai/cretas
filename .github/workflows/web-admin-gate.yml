concurrency:
  group: web-admin-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    # 2026-08-26: 组织 Actions 免费额度(2000 分钟/月)用尽后, 托管 runner 起不来
    #   —— job 2~4 秒、0 个 step、无日志地失败。改用自建 runner(139, 4 核/7G)。
    # ⚠️ 用具体标签 `cretas` 而不是裸 `self-hosted`: 将来多一台 runner 时
    #    裸标签会被任意机器接走, 具名标签不会。
    # 实测资源(vitest 3300+ 用例): 4分41秒 / 峰值内存 1.2G / CPU 350%。
    # 服务侧已加 Nice=10 CPUWeight=50 MemoryMax=3G, 让它抢不过业务进程。
    # CI runner 路由: **默认走托管**(快 1~2 倍、干净机器), 额度耗尽时切到自建。
    #   切换: `python scripts/ci/switch_ci_runner.py self-hosted` (或 hosted) 然后提交。
    #   ⛔ 别用组织变量 `${{ vars.X }}` —— 实测在 `runs-on` 里读到的是空。
    #   详见 .claude/rules/ci-runner-routing.md (= .codex/rules/ 同名文件)
    # ⚠️ 这里**不能**用 `${{ vars.X }}` 做路由 —— 实测 job 被派成 labels=ubuntu-latest,
    #    即 vars 在 `runs-on` 求值时读到的是空(它在 job 编排阶段求值, 上下文比步骤里窄)。
    #    配置本身没问题: 变量 visibility=all、组织变量对本仓可见、创建早于 run。
    # ⇒ 改用**分支/文件**级切换: 平时保持 ubuntu-latest;
    #    额度耗尽时执行 `python scripts/ci/switch_ci_runner.py self-hosted` 并提交,
    #    额度恢复时 `... hosted`。一条命令改三个文件, 有闸钉着三处一致。
    runs-on: [self-hosted, cretas]
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-admin/package-lock.json
      - run: npm ci --legacy-peer-deps
      # 只跑单测。build / vue-tsc 仍留在 ci.yml 的 full_audit 里 ——
      # 本 workflow 的目的是让「套件绿」重新成为可信信号, 不是把整轮审计搬到每次 push。
      - name: Vitest unit tests
        run: npm test

      # 2026-08-01 加入。此前「web-admin 有没有被检查」由**三处**决定:
      #   ci.yml 的 full_audit (workflow_dispatch 手动) / 本 workflow (只跑 vitest) /
      #   typecheck 无人负责。于是 #2086 带着一条 TS2322 进了 main 并躺了一整天,
      #   是偶然跑了一次 vue-tsc 才发现的 —— 与 #2097 修的是同一个形状, 只是高一层。
      #
      # 加进来的前提是它在目标环境**已经是绿的**(上闸前实测 origin/main
      # 30029ea43e: exit 0 无输出), 否则是把「不可信的绿」换成「挡所有人的红」。
      #
      # 只加 typecheck 不加 `npm run build`: 前者约 40s 且能抓到真缺陷; 后者是
      # 打包耗时更长, 而 web-dist.yml 已经在每次 web-admin push 上真的构建一次,
      # 构建坏了那边会红 —— 再加一遍是重复承载。
      - name: Type check (vue-tsc)
        env:
          # The full project requires more than Node's ~2 GiB default heap on
          # GitHub-hosted runners. Keep the complete check; raise only V8's
          # ceiling instead of weakening the TypeScript project or exclusions.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx vue-tsc -b --force
