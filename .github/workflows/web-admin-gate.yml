name: Web Admin Gate

# 为什么是独立 workflow 而不是给 ci.yml 的 vue-build-check 松绑:
#
# ci.yml 的 `on.push` 带着 `paths: backend/java/cretas-api/**` —— 那是为 Java 制品
# 不变量「那棵树变了 ⟺ CI 被触发」精心写的, 不该为了跑前端测试去动它。
# 只把 vue-build-check 的 `if` 改成 push 也没用: 纯前端改动**根本不会触发 ci.yml**,
# 于是同一道闸有三个承载点 (job 的 if / workflow 的 paths / 步骤里的 `|| true`),
# 只改一个等于没改。
#
# 背景 (2026-07-31): vitest 此前只在 `workflow_dispatch` 且 full_audit=true 时才跑,
# 近期每一次 push 记录里 vue-build-check 都是 skipped。最后一次真正执行是 07-30,
# 结果是 failure, 而那次 run 被 cancel 了没人追。于是两个真缺陷在红里躺了 8 天:
#   - 用户填的单位「件」被显示成「只」 (#1672 起)
#   - 工序端口分组的合法 patch 全被拒 (#1406 的功能正路走不通)
# 两个都是被现有用例当场抓到的 —— 缺的不是用例, 是没人断言绿。

on:
  push:
    branches:
      - main
    paths:
      - 'web-admin/**'
      - '.github/workflows/web-admin-gate.yml'
      # 🔴 2026-08-14: unitDisplayContract.spec.ts 直接读**后端**权威表源码比对
      # (backend/.../UnitContractServiceImpl.java), 它的文档写着「后端加了新单位而前端
      # 没跟, 这里就会红」—— 而触发条件只有 web-admin/**, 对这个场景恰好是瞎的。
      # 实测: #2628 只改了那个 Java 文件, 本闸没被触发, 38 条红藏了一整晚。
      # 闸的触发面必须覆盖它读的东西, 否则它守的正是它看不见的那类改动。
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/service/unit/impl/UnitContractServiceImpl.java'
      # 🔴 2026-08-28: rawWorkflowOwnerAnchorMatchesBackend.source.spec.ts 读**这个** Java
      # 文件里的 anchor.setName("__RAW_WORKFLOW_OWNER__"…) 字面量, 钉住前端那份不漂。
      # Java 单方面改前缀而闸不跑 ⇒ 前端安静地不再过滤, 客户重新看到
      # 「PLAN-… · __RAW_WORKFLOW_OWNER__RMT_…」当成产品名(2026-08-28 f006 实拍)。
      # ⚠️ 只加**这一个确切文件**, ⛔ 不用 backend/**/*.java 之类的宽 glob ——
      #   #253 实测宽 glob 会把 gateTriggerSurfaceCoversWhatItReads 的阴性对照
      #   (「匹配器过宽 —— 连没被引用的文件都判成已覆盖了」)变成恒真式。
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/service/impl/ProductProcessWorkflowServiceImpl.java'
      # 🔴 2026-09-01: WorkflowSpecialOutputChooser.spec.ts 读**这三个** Java 文件。
      # 前两个是副产/回料各自的判据类, 证明选择器里留的不是没人读的假选项。
      # 第三个是产品文案的真假所系: UI 上写着不良品「照常报工入库存着」, 它成立的唯一
      # 理由是 workflowOutputOptions **只把副产滤掉** —— 没有标记的半成品产出照常进
      # 报工选项。哪天有人给不良品也加一道过滤, 那句话就变成假话, 那条断言会红。
      # ⚠️ 只加这三个确切文件, ⛔ 不用 backend/**/*.java 之类的宽 glob(见上一条的理由)。
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/service/workflow/WorkflowByproductNodes.java'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/service/workflow/WorkflowReworkNodes.java'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/service/wip/impl/WipInventoryServiceImpl.java'
      # 🔴 2026-08-28: dispositionFiltersAtTheSource.source.spec.ts 读**这个** controller 的
      # `getInspections` 签名, 钉住「前端传的 result, 后端得真的声明」——
      # Spring 对未声明的请求参数静默忽略, 于是「待处置质检」屏显示全部质检记录且每条两遍。
      # 后端单方面删掉那个 @RequestParam 而闸不跑 ⇒ 缺陷原样回来。
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/controller/ProcessingController.java'
      # 🔴 2026-08-26: productionProgressWallAccess.spec.ts 读**后端**源码比对
      # (@RequireModule 的模块码 + ProductionModuleRegistry 的 permissionModule 映射),
      # 钉的是「菜单挂的模块 == 后端闸要的模块」两份一致。同上一条一样的道理:
      # 只触发 web-admin/** 时, 一个**只改 Java** 的 PR 恰好是它看不见的那类改动 ——
      # 而那正是它要守的漂移。闸的触发面必须覆盖它读的东西。
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/controller/ProductionProgressDashboardController.java'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/permission/ProductionModuleRegistry.java'
      # 🔴 2026-09-01: reportApprovalMenuMatchesBackendRoles.spec.ts 读这两个文件, 钉的是
      # 「报工审批菜单放行的角色 == 后端实际放行的角色全集」。生产实测: 质量经理菜单里
      # 看得见本页, GET 却 403, 页面把它渲染成「待审批 0」——而真实待办有 26 条。
      # 一个**只改 @RequireRole 名单**(或只改 PLATFORM_ADMIN_ROLES 绕过集)的 PR
      # 恰好是它看不见的那类改动, 而那正是它要守的漂移。
      # ⛔ 逐文件登记, 不用 controller/** 这种宽 glob —— 2026-08-28 有人为补触发面加宽 glob,
      #    把另一道闸「证明自己不过宽」的阴性对照变成了恒真式。
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/controller/ProcessWorkReportingController.java'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/config/RequireRoleInterceptor.java'
      # 🔴 2026-09-06: moduleListsPairwiseConsistency.source.spec.ts 读这四个文件里的模块清单
      # 字面量 (ALL_MODULES / 两份 ALLOWED_MODULES / DISPLAY_MODULES), 与 web-admin 的 4 份两两
      # 比对并钉棘轮。一个**只往 Java 清单加模块**的 PR 恰好是它要守的漂移, 不登记它就看不见。
      # ⛔ 逐文件登记, 不用宽 glob (理由见上)。
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/service/impl/PermissionServiceImpl.java'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/controller/platform/PlatformRolePermissionController.java'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/controller/FactoryRoleModuleOverrideController.java'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/controller/RoleController.java'
      # 刀 D (#715): 模块码 -> 中文名的唯一来源。moduleListsPairwiseConsistency 读它,
      #   断言「轴上每个码都有中文名」—— 没有就会在角色权限页上给用户看英文裸码。
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/permission/PermissionModuleCatalog.java'
      # 🔴 2026-09-06 v2: 同一道闸的轴换成 L1 (RN 侧从 prod 只读导出的快照), 读这个 JSON。
      #    刷新快照 = 轴变了 = 偏离读数变了, 不登记它就是「改了轴而闸不跑」。
      - 'frontend/CretasFoodTrace/src/utils/permissionMatrix.l1Snapshot.json'
      # 🔴 2026-09-04: materialTypeWriteRolesMatchBackend.spec.ts 读这两个文件, 钉的是
      # 「MATERIAL_TYPE_WRITE_ROLES == RawMaterialTypeController@RequireRole ∪
      # PLATFORM_ADMIN_ROLES」——与上面报工审批那条同一形状: 只改 @RequireRole 角色名单
      # 的 PR 恰好是它要守的漂移, 不登记这两条它就看不见。
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/controller/RawMaterialTypeController.java'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/controller/MaterialPackagingHierarchyController.java'
      # 🔴 2026-08-29: floorPlanLimitsMatchBackend.spec.ts 读 WarehouseLayoutController
      # 里的体量上限常量, 钉的是「前端那份不许和后端漂开」。只改后端上限的 PR
      # 恰好是它要守的那类改动 —— 不列在这里, 它就永远看不见。
      # ⛔ 逐个文件列, 不用宽 glob: `src/main/java/**` 会把另一道元闸
      # 「证明自己不过宽」的阴性对照变成恒真式(2026-08-28 实测踩过)。
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/controller/WarehouseLayoutController.java'
      # 🔴 2026-08-27: 下面这些是 enumDisplayCoverage / salesStatusLabelsMatchBackend /
      # bomContractsSurvivingPageDeletion / seasoningProcessCategory 这几个 spec 用
      # readJava(...) **真读**的后端源码。建元判据闸当天实测: 24 个文件被读着,
      # 而触发面里一个都没有 —— 改它们不会触发本闸, 本闸只在「顺带被别的改动带起来」时才跑。
      # ⚠️ 以后新增 readJava(...) 必须同步加到这里, 否则
      #    web-admin/src/router/__tests__/gateTriggerSurfaceCoversWhatItReads.spec.ts 会红。
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/entity/**'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/constant/**'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/dto/bom/BomCostSummaryDTO.java'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/service/impl/BomServiceImpl.java'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/service/bom/impl/BomRecipeServiceImpl.java'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/service/production/ProductionDocumentTraceService.java'
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/service/trace/BusinessDocumentTraceService.java'
      # statisticsFieldNamesMatchBackend.source.spec.ts 读它, 断言前端 KPI 字段名 == 后端 stats.put 的键
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/service/impl/QualityCheckItemServiceImpl.java'
      # permissionGateMatchesBackend.spec.ts 读它, 断言前端菜单/路由的 module 与后端
      # @RequirePermission 是同一个权限码 (ARCH-PERMISSION-ADMIN-L1-EDITOR-20260906)
      - 'backend/java/cretas-api/src/main/java/com/cretas/aims/controller/permission/PermissionMatrixController.java'
