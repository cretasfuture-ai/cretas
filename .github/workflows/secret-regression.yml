name: Secret regression gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tracked-secret-scan:
    # 2026-08-26: 组织 Actions 免费额度(2000 分钟/月)用尽后, 托管 runner 起不来
    #   —— job 2~4 秒、0 个 step、无日志地失败。改用自建 runner(139, 4 核/7G)。
    # ⚠️ 用具体标签 `cretas` 而不是裸 `self-hosted`: 将来多一台 runner 时
    #    裸标签会被任意机器接走, 具名标签不会。
    # 实测资源(vitest 3300+ 用例): 4分41秒 / 峰值内存 1.2G / CPU 350%。
    # 服务侧已加 Nice=10 CPUWeight=50 MemoryMax=3G, 让它抢不过业务进程。
    runs-on: [self-hosted, cretas]
    # 2026-08-27: 5 分钟是按托管 runner(有本地缓存/高速骨干)定的, 自建 runner 上不够 ——
    #   checkout 本身就要 ~1.5 分钟(工作树 1.7G, 实测浅克隆 1:24), 首次还要下 setup-python。
    #   实测 5 分钟到点时 checkout 还没完成, job 被强杀, 表现为 `10m0s fail`。
    # ⚠️ 判据不是「调大到不报错」, 是「留够一次冷启动的余量」: 1.5 分 checkout
    #   + 运行时下载 + 扫描本身(本地实测 6 个单测 + 全树扫描 < 30 秒)。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scanner unit tests
        run: python -m unittest scripts/security/test_scan_tracked_secrets.py
      - name: Scan tracked tree
        run: python scripts/security/scan_tracked_secrets.py --root .
