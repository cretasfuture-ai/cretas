name: Secret regression gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tracked-secret-scan:
    # CI runner 路由: **默认托管**(快 1~2 倍 + 干净机器), 额度耗尽时切到自建 Mac mini。
    #   切换: `python scripts/ci/switch_ci_runner.py self-hosted` (或 hosted) 然后提交。
    #   详见 .claude/rules/ci-runner-routing.md (= .codex/rules/ 同名文件)
    # 2026-08-26 触发事故: 组织 Actions 免费额度(2000 分钟/月)用尽, job 2~4 秒、
    #   0 个 step、无日志地失败, 横跨 main 与各 feature 分支。
    # ⚠️ 这里**不能**用 `${{ vars.X }}` 做路由 —— 实测 job 被派成 labels=ubuntu-latest,
    #    即 vars 在 `runs-on` 求值时读到的是空(它在 job 编排阶段求值, 上下文比步骤里窄)。
    #    配置本身没问题: 变量 visibility=all、组织变量对本仓可见、创建早于 run。
    # ⇒ 改用**分支/文件**级切换: 平时保持 ubuntu-latest;
    #    额度耗尽时执行 `python scripts/ci/switch_ci_runner.py self-hosted` 并提交,
    #    额度恢复时 `... hosted`。一条命令改三个文件, 有闸钉着三处一致。
    runs-on: [self-hosted, cretas-quick]
    # 2026-08-27: 5 分钟是按托管 runner(有本地缓存/高速骨干)定的, 自建 runner 上不够 ——
    #   checkout 本身就要 ~1.5 分钟(工作树 1.7G, 实测浅克隆 1:24), 首次还要下 setup-python。
    #   实测 5 分钟到点时 checkout 还没完成, job 被强杀, 表现为 `10m0s fail`。
    # ⚠️ 判据不是「调大到不报错」, 是「留够一次冷启动的余量」: 1.5 分 checkout
    #   + 运行时下载 + 扫描本身(本地实测 6 个单测 + 全树扫描 < 30 秒)。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # setup-python 只在**托管** runner 上跑。
      # 自建 macOS runner 上它必失败: 它的 macOS 安装脚本把 `/Users/runner` 写死
      #   (托管 runner 的用户名就叫 runner), 而本机用户是 rex 且 /Users 不可写,
      #   报 `mkdir: /Users/runner: Permission denied`。
      # ⚠️ 预置工具缓存**不管用** —— 实测缓存结构完整(arm64 + .complete + 可执行链接)
      #   它仍走安装脚本。所以只能跳过它。
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.11'

      # 自建 runner 上用系统 Python, 并**断言版本满足要求** ——
      # ⛔ 不能默默用一个更老的版本跑, 那样闸绿了也不算数。
      - name: Use system Python (self-hosted)
        if: runner.environment != 'github-hosted'
        run: |
          set -e
          for c in python3.11 python3; do
            if command -v $c >/dev/null 2>&1; then
              V=$($c -c 'import sys;print("%d.%d"%sys.version_info[:2])')
              case "$V" in 3.1[1-9]|3.[2-9]*) echo "$(dirname $(command -v $c))" >> $GITHUB_PATH; ln -sf $(command -v $c) /tmp/python; echo "/tmp" >> $GITHUB_PATH; echo "使用 $c ($V)"; exit 0;; esac
            fi
          done
          echo '找不到 >= 3.11 的 python'; exit 1
      - name: Scanner unit tests
        run: python -m unittest scripts/security/test_scan_tracked_secrets.py
      - name: Scan tracked tree
        run: python scripts/security/scan_tracked_secrets.py --root .

      # Claude 读 .claude/rules/, Codex 读 .codex/rules/ —— 同一条规则两份会漂,
      # 而且**不报错**: 一边改了另一边没改, 两个 agent 拿着不同规则各干各的。
      # 实测 2026-08-27: 两目录 9 个同名文件全部已漂(最多差 147 行)。
      # 这道闸只钉 SHARED 清单里的(棘轮), 存量漂移另开任务收敛。
      - name: Shared agent rules must not drift
        run: python scripts/ci/check_shared_agent_rules.py

      # 三个闸的 runs-on 必须一致 —— 只切一半会让「额度耗尽」这件事只解决三分之一,
      # 而剩下那两个照样 2 秒失败, 看起来像是自建 runner 没生效。
      - name: CI runner target must be consistent
        run: python scripts/ci/switch_ci_runner.py --check
