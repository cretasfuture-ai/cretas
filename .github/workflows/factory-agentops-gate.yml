name: Factory AgentOps Gate

# 工厂域 AgentOps 离线回归闸 (S6-07/S6-08)。
# 用已录制的工厂意图/工具快照重放评测集, 与仓内基线比对; 不调任何 LLM / 网络 / 数据库。
# 退出码: 0 无回退 / 1 回退 / 2 没量到 (缺 fixture、评测集缩水、阴性对照没红…)。
# ⛔ 非 0 即红, 没量到不会变绿。闸本身用「注入回退 → 必须 rc=1」「缺文件 → 必须 rc=2」
#    在同一个 job 里自证, 这样闸坏了(永远返回 0)也会被抓到。

on:
  # pull_request 不带 paths (合并队列/必需检查要求每个 PR 都报告结果); 触发路径清单在
  # scripts/ci/trigger-paths/factory-agentops-gate.txt, 由下面的 changes 作业判定原作业跑不跑。
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - 'backend/python/smartbi/agent/eval/**'
      - 'backend/python/smartbi/agent/runtime/evaluation.py'
      - 'backend/python/tests/fixtures/factory_agentops/**'
      - 'scripts/ci/factory_agentops_gate.py'
      - 'scripts/ci/check_factory_evaluator_provenance.py'
      - 'backend/python/tests/agent_eval/test_legacy_factory_compatibility.py'
      - '.github/workflows/factory-agentops-gate.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 合并队列准备 (2026-11-12): 判断这次 PR 有没有改到本闸的触发路径。
  #   清单: scripts/ci/trigger-paths/factory-agentops-gate.txt (原 on.pull_request.paths 原样搬过去)。
  #   pull_request 以外的事件 (merge_group / push / schedule / workflow_dispatch) 一律 run=true;
  #   取不到 diff 也 run=true —— 宁可多跑, ⛔ 不因为没量到而跳过。
  # 下游作业的 if 写成 `!cancelled() && needs.changes.outputs.run != 'false'`: 本作业自己失败
  # (输出为空) 时下游照跑, ⛔ 不让判定仪器坏掉变成「被跳过 = 必需检查通过」。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 三点 diff 要 merge-base; 只要提交与树, blob 按需取。
          fetch-depth: 0
          filter: blob:none
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/changed-paths.py --patterns scripts/ci/trigger-paths/factory-agentops-gate.txt

  factory-agentops-gate:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The frozen factory evaluator is verified against pinned source blobs.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify frozen factory evaluator provenance
        run: python scripts/ci/check_factory_evaluator_provenance.py

      - name: Gate on the committed fixtures (must be rc=0)
        run: |
          set +e
          python scripts/ci/factory_agentops_gate.py > "$RUNNER_TEMP/gate.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/gate.log"
          echo "gate rc=$rc"
          [ "$rc" -eq 0 ] || exit 1
          [ "$(grep -c 'FACTORY_AGENTOPS_GATE rc=0' "$RUNNER_TEMP/gate.log")" -eq 1 ] || exit 1

      - name: Self-test, injected regression must give rc=1
        run: |
          set +e
          FX="$RUNNER_TEMP/fx-regress"
          cp -r backend/python/tests/fixtures/factory_agentops "$FX"
          python - "$FX/recorded_actuals.json" <<'PY'
          import json, sys
          p = sys.argv[1]
          d = json.load(open(p, encoding="utf-8"))
          d["fx-003"]["routeCode"] = "GENERAL_CHAT"
          json.dump(d, open(p, "w", encoding="utf-8"))
          PY
          python scripts/ci/factory_agentops_gate.py --eval-set "$FX/eval_set.json" \
            --actuals "$FX/recorded_actuals.json" --baseline "$FX/baseline.json"
          rc=$?
          echo "regression rc=$rc"
          [ "$rc" -eq 1 ]

      - name: Self-test, missing fixture must give rc=2 (never green)
        run: |
          set +e
          FX="$RUNNER_TEMP/fx-missing"
          cp -r backend/python/tests/fixtures/factory_agentops "$FX"
          rm "$FX/recorded_actuals.json"
          python scripts/ci/factory_agentops_gate.py --eval-set "$FX/eval_set.json" \
            --actuals "$FX/recorded_actuals.json" --baseline "$FX/baseline.json"
          rc=$?
          echo "unmeasured rc=$rc"
          [ "$rc" -eq 2 ]
