# Java 全量测试 · 夜间跑批 + 名单棘轮
#
# 🔴 为什么需要它（2026-08-18 实测）
#
#   origin/main 上有 19 个红的测试方法（8 Failures + 11 Errors），分布在 8 个类里，
#   全部落在采购 / 销售发货 / 生产结算这几条写路径上。它们能一直红着没人发现，
#   是因为【没有任何自动触发会执行它们】：
#
#     ci.yml:121  mvn -B test    if: inputs.full_audit   ← 只有手动全量审计才跑
#     ci.yml:309  mvn -B verify  if: inputs.full_audit   ← 同上
#     ci.yml:183  mvn -B package -Dmaven.test.skip=true  ← push / PR 上跑的是这条
#     ci.yml:26   # full_audit stays manual -- the whole suite takes over an hour
#
#   ⇒ PR 上那个绿 = 编译并打包成功，⛔ 不是测试通过。
#
# 它只回答一个问题：「有没有【新增】的红？」—— 已知的那些冻结在名单里，只许变少。
#
# 🔴 2026-08-27 起它【也】拦 PR（此前这里写的是「⛔ 它不拦 PR」）
#
#   改的理由是当天实测出来的：#184 / #185 引入的 8 条红从合并那天起就红在 main 上，
#   而 PR 上没有任何东西会执行它们 —— 窄闸只跑 `*ContractTest` / `*StartupGuardTest` /
#   `*RepositoryQueryValidationTest` ＋逐字列出的 `FlywayVersionUniquenessTest`，
#   那 4 个被改坏的类**一个都不在里面**。夜间跑批抓到了，但那已经是半天之后。
#
#   当初不拦 PR 的理由是「全量 8000+ 用例、约 12 分钟且吃内存」，而
#   「上闸的前提是它在目标环境已经是绿的」。**这两条现在都不成立了**：
#     · 自建 runner 上实测 **6 分 31 秒**（run 33085335136，12007 个测试）
#     · 存量红从 143 削到 **5**，且这 5 条全部在基线里
#   ⇒ 代价从 ~2 分钟（窄闸）涨到 ~6.5 分钟，覆盖从 1128 个测试涨到 12007 个。
#
#   ⚠️ PR 与夜间共用**同一份**基线和**同一段**判断（`workflow_call`），
#      ⛔ 不是各自复制一份 —— 那就是「同一个东西两份，它一定会漂」。
#
# ⛔ PR 触发的调用永远不许写基线，见下面 ratchet 那一步的双保险。
#
# 三态（与本仓硬约束 4 同源）
#   rc=0  没有新增红（或基线尚未落地）
#   rc=1  出现基线里没有的失败      ⇒ 🔴 NEW FAILURES
#   rc=2  这次没量到（编译失败/报告为空）⇒ ⚠️ INSTRUMENT DEAD，措辞必须与 rc=1 不同
#
# 首次使用：手动触发一次并把 write_baseline 设为 true，
#          从 artifact 里取出名单提交进仓库。
#          ⛔ 不要用本地跑的结果当基线 —— 环境不同，失败集合必然不同。

name: Java Full Test (nightly ratchet)

on:
  schedule:
    # UTC 18:37 = 北京时间次日 02:37（避开白天部署窗口与 GitHub 整点高负载）
    - cron: '37 18 * * *'
  workflow_dispatch:
    inputs:
      write_baseline:
        description: '用本次结果覆盖已知红名单（⛔ 只在确认新增红已修完后用）'
        type: boolean
        default: false
  # PR 闸从这里调用（java-gate-pr.yml），⇒ 判断只有一份。
  workflow_call:
    inputs:
      write_baseline:
        type: boolean
        default: false

# ⚠️ PR 与夜间必须分组，⛔ 不能共用一个 group：
#    共用会让所有 Java PR 和夜间跑批**全局串行**（2 台 runner 也只能跑 1 条）。
#    PR 侧还要 cancel-in-progress —— 同一分支连推两次时，旧的那次结果已经没用了。
concurrency:
  group: java-full-suite-${{ github.event_name == 'pull_request' && github.ref || 'nightly' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest  # java-heavy: self-hosted 时要 8G runner
    timeout-minutes: 120
    # GitHub-hosted 16 GB: the full suite needs 12g (8g ran to the end but OOMed in the tail).
    env:
      CRETAS_JAVA_NIGHTLY_XMX: 12g

    steps:
      - uses: actions/checkout@v4
        with:
          # PR 调用绑定原始 head；schedule / workflow_dispatch 绑定触发时的 SHA。
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # 合并 base 需要共同祖先; 浅克隆合不了。
          fetch-depth: 0
      # PR 调用时把 base 合进来 —— 最终候选的全量必须看合并结果 (schedule 路径整步跳过)。
      # 🔴 **内联, ⛔ 不用本地 composite action** (`uses: ./.github/actions/...`):
      #    pull_request 事件下 **workflow 定义从 base 读**, 而 `./` 开头的本地 action 从
      #    **checkout 出来的工作区**读 —— 我们 checkout 的是 `pull_request.head.sha`, 于是任何
      #    **head 不含那个目录**的 PR(旧分支 / 开了几天的 PR)这一步必死:
      #      `Can't find 'action.yml' … under .github/actions/merge-pr-base`, 9 秒红。
      #    2026-09-07 实测: 它炸掉了当时**所有**在飞 PR 的 Java 闸, 而且长得像「CI 没测出问题」
      #    而不是「CI 坏了」—— rebase 只能绕过去, 任何人从旧 base 开分支还会再撞一次。
      #    ⇒ 内联的 run 块跟着 workflow 定义走(**总是来自 base**), 与 head 的树无关。
      # ⚠️ 三处内联必须**逐字相同** —— scripts/tests/test-ci-gate-runs-merge-result.sh 钉了这条。
      - name: Merge PR base into head (pull_request only)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PAYLOAD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.email "ci@cretas.local"
          git config user.name "cretas-ci"

          # 🔴 ⛔ 不用 payload 里的 `base.sha` —— 它是**事件创建那一刻**的快照, 会滞后。
          # 实测(#710, run 34074881917): #716 合进 main 之后 **17 秒** 触发的那次 run, payload 的
          # base.sha 仍是 `f3ba01d172`(= `ced5a45397^`, 即合 #716 之前的 main) ⇒ 闸把 head 合进了
          # 一个**旧 main**, 打出 `merged_in_commits=0` / `base_already_ancestor`, 而 BUILD SUCCESS
          # 全绿。真正露馅的是**测试总数 13235 vs 13237**(#716 带进来的两条根本没跑到)。
          # ⚠️ 形状与 #682/#693 那次(31 秒)逐字相同: 窗口被 #707/#713 缩小了, **没有被关上** ——
          #    从「根本不合 base」变成「合了个旧 base」, 而后者更难发现(`merged_ok=yes` 长得像验过了)。
          # ⇒ 取 base 分支的**活 tip**, 并把「payload 说的」与「实际用的」**都打出来**。
          git fetch --no-tags --force origin "$BASE_REF" \
            || { echo "::error::取不到 base 分支 $BASE_REF 的 tip"; exit 1; }
          BASE_TIP_AT_FETCH=$(git rev-parse FETCH_HEAD)
          BASE_SHA="$BASE_TIP_AT_FETCH"
          if [ "$BASE_SHA" = "$PAYLOAD_BASE_SHA" ]; then PAYLOAD_STALE=no; else PAYLOAD_STALE=yes; fi
          # 竞态的**大小**要变成一个可读的数 —— ⛔ 不要指望「某个测试数恰好对不上」来发现它:
          # 那个锚点是碰巧的(#716 恰好带了 2 个测试; 换成纯重构就没有任何东西会对不上)。
          if git cat-file -e "${PAYLOAD_BASE_SHA}^{commit}" 2>/dev/null; then
            PAYLOAD_BEHIND_BY=$(git rev-list --count "$PAYLOAD_BASE_SHA..$BASE_SHA" 2>/dev/null || echo unknown)
          else
            PAYLOAD_BEHIND_BY=unknown   # payload 那个 commit 不在本地(base 被 force-push 过?)
          fi
          # 三个读数一起打, ⛔ 不只打最终 base:
          #   payload_base_sha    = 事件 payload 里那个**快照**(会滞后)
          #   base_ref_tip_at_fetch = 运行时 fetch 到的**活 tip**
          #   base                = 实际合进去的那个
          # ⚠️ 后两者由构造相等; 分开打是为了让「取到的」与「用掉的」各自可查 —— 将来若有人
          #    在中间插一步改了 BASE_SHA, 这两个数会立刻不一致, 而不是悄悄换了棵树。
          echo "READING: GATE_BASE ref=$BASE_REF payload_base_sha=$PAYLOAD_BASE_SHA base_ref_tip_at_fetch=$BASE_TIP_AT_FETCH base=$BASE_SHA payload_stale=$PAYLOAD_STALE payload_behind_by=$PAYLOAD_BEHIND_BY"
          # ⛔ payload 落后**不红**: base 在事件与 run 之间前进是常态, 红了就是天天红。
          #    但也 ⛔ 不静默用新的 —— 大声说出来, 让「这次跑的是哪棵树」可追。
          if [ "$PAYLOAD_STALE" = "yes" ]; then
            echo "::notice::base 分支在事件之后前进了: payload=$PAYLOAD_BASE_SHA 实际用 $BASE_SHA (这是对的 —— 闸要看的是能不能合进**现在**的 base)"
          fi

          # 🔴 硬约束 9: 只打 merged_ok=yes 分不出两种成因 ——
          #   (a) 真把 base 合进来了(这道修复在工作)
          #   (b) base 已经是 head 的祖先(PR 刚 rebase 过), merge 是 no-op
          # 两者读数完全相同, 而只有 (a) 证明闸看到了「别人合进 base 的东西」。
          BEHIND=$(git rev-list --count "HEAD..$BASE_SHA" 2>/dev/null || echo unknown)
          TREE_BEFORE=$(git rev-parse 'HEAD^{tree}')
          if git merge --no-edit "$BASE_SHA"; then
            TREE_AFTER=$(git rev-parse 'HEAD^{tree}')
            if [ "$TREE_BEFORE" = "$TREE_AFTER" ]; then TREE_CHANGED=no; else TREE_CHANGED=yes; fi
            echo "READING: GATE_TREE=merge head=$HEAD_SHA base=$BASE_SHA merged_ok=yes" \
                 "merged_in_commits=$BEHIND tree_changed=$TREE_CHANGED tree=$TREE_AFTER"
            if [ "$BEHIND" = "0" ]; then
              echo "READING: GATE_TREE_NOTE=base_already_ancestor (本次 merge 是 no-op; 这一趟证明不了闸能看见 base 的新东西)"
            fi
          else
            echo "READING: GATE_TREE=conflict head=$HEAD_SHA base=$BASE_SHA merged_ok=no"
            echo "::error::PR 与 base 冲突, 闸无法在合并结果上运行 —— 先解冲突再推(反正这样也合不进去)。"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run the full Java suite
        id: full-suite
        working-directory: backend/java/cretas-api
        # ⚠️ failure.ignore=true 是【故意的】: 我们要拿到【全部】测试的结果,
        #    让棘轮来决定红不红。让 surefire 中途停会让名单不完整,
        #    而不完整的名单会把「没跑到」误报成「修好了」。
        #
        # 🔴 continue-on-error 不是「容忍失败」, 是【让三态判定有机会跑到】。
        #    2026-08-26 首次真实运行实测: runner OOM (java.lang.OutOfMemoryError:
        #    Java heap space) -> surefire fork VM 崩 -> mvn 非零退出 -> 本步 failure
        #    -> 下面整条链(棘轮 / rc=2 告警)全被 skip。
        #    结果就是: 那套专门用来把「没量到」从「没问题」里拆出来的三态机制,
        #    在它最该开火的那一次**一次都没轮到**, 只报了一个笼统的 job failure。
        #    ⇒ 这一步的成败必须交给棘轮判, 而不是让它自己把工作流打断。
        #    ⛔ 别据此以为红被吞了: 编译失败/报告为空一律落到 rc=2, 那一步照样 exit 1。
        continue-on-error: true
        env:
          # runner 是 7GB 内存的 ubuntu-latest。默认堆对这套 1400+ 测试类
          # (含 37 个 @SpringBootTest, 每个都起一次 Spring 上下文) 不够。
          # ⚠️ 是给【surefire fork 出来的那个 VM】加, 不是给 maven 自己 ——
          #    OOM 发生在 fork VM 里, 只加 MAVEN_OPTS 治不到。
          # 🔴 2026-08-26 撤掉了曾经加过的 `-DforkCount=1 -DreuseForks=true`:
          #    本意是「降低峰值」, 实际【完全相反】—— 它把 1400+ 个测试类塞进
          #    同一个 VM, 内存只增不减(37 个 @SpringBootTest 各起一次 Spring
          #    上下文全堆在一个堆里)。实测后果: 加了 -Xmx3g 仍 OOM, 只是从
          #    「跑 0 条就崩」变成「跑 2866 条才崩」, 而后者【崩得像成功】。
          #    ⇒ 用 surefire 默认的 fork 回收, 才是治 OOM 的方向。
          # ⛔ argLine 是【整体覆盖】不是追加: pom.xml:576 原有
          #    `-XX:+EnableDynamicAgentLoading -Xshare:off`(Mockito 内联 mock 需要),
          #    所以下面必须把它们逐字带上, 否则一开闸就是另一片红。
          MAVEN_OPTS: -Xmx2g
        # ⚠️ setup-java 只装 JDK 不装 Maven —— 自建 macOS runner 上没有系统 mvn,
        #    只有仓库自带的 ./mvnw。解析逻辑收在 scripts/ci/resolve-maven.sh 一处
        #    (第二个工作流复制一份就是形态 D)。
        run: |
          set -uo pipefail
          MVN=$(bash "$GITHUB_WORKSPACE/scripts/ci/resolve-maven.sh")
          echo "MVN_USED=$MVN"
          # 堆: runner .env 的 CRETAS_JAVA_NIGHTLY_XMX, 没有就退到 java-gate-pr 用的
          # CRETAS_JAVA_FORK_XMX, 再没有就 3g(本机不设 = 3g, 行为不变)。
          # 2026-10-04 加拿大实测: 写死 3g -> 只跑到 2879/12012(run 37139116569, rc=2);
          # 6g -> 跑满 12744 但后段 Spring 上下文缓存撑爆, 9 次 OOM、lineage 三个类 10 红
          # (run 37140487356)。全量的上下文远多于 PR 闸的子集, 所以 nightly 单独一个变量
          # (加拿大 12g: 8g 跑满 12999 仍在尾段 OOM 出 11 红, run 37141895672; aurora 7g 跑不满,
          # 已知限制), PR 闸维持 6g。
          NIGHTLY_XMX="${CRETAS_JAVA_NIGHTLY_XMX:-${CRETAS_JAVA_FORK_XMX:-3g}}"
          echo "READING: JAVA_NIGHTLY_XMX=$NIGHTLY_XMX runner=${RUNNER_NAME:-?}"
          export MVN NIGHTLY_XMX
          /usr/bin/time -v -o "$RUNNER_TEMP/java-full-resources.txt" \
          bash "$GITHUB_WORKSPACE/scripts/ci/run-with-test-postgres.sh" bash -c '
            set -euo pipefail
            env -u CRETAS_WORKFLOW_PG_VERIFY \
                -u SMARTBI_PG_DSN \
                -u CRETAS_WORKFLOW_PG_URL \
                -u CRETAS_WORKFLOW_PG_USER \
                -u CRETAS_WORKFLOW_PG_PASSWORD \
                -u SPRING_DATASOURCE_URL \
                -u SPRING_DATASOURCE_USERNAME \
                -u SPRING_DATASOURCE_PASSWORD \
                "$MVN" -B test \
                  -Dmaven.test.failure.ignore=true \
                  -Dtest=!FactoryConfigServiceImplReorderIT \
                  -Dspring.profiles.active=test \
                  -DargLine="-XX:+EnableDynamicAgentLoading -Xshare:off -Xmx$NIGHTLY_XMX -XX:+HeapDumpOnOutOfMemoryError -Dspring.test.context.cache.maxSize=2"
            R10_REPORT=target/surefire-reports/TEST-com.cretas.aims.service.config.impl.FactoryConfigServiceImplReorderIT.xml
            rm -f "$R10_REPORT"
            if [[ "${CRETAS_WORKFLOW_PG_VERIFY:-}" != true ]]; then
              echo "R10 instrument failure: CRETAS_WORKFLOW_PG_VERIFY is not true"
              exit 86
            fi
            if [[ ! "${CRETAS_WORKFLOW_PG_URL:-}" =~ ^jdbc:postgresql://127\.0\.0\.1:[0-9]+/cretas_workflow_verify_test$ ]]; then
              echo "R10 instrument failure: wrapper URL is not an isolated loopback verify database"
              exit 86
            fi
            R10_PORT="${CRETAS_WORKFLOW_PG_URL##*:}"
            R10_PORT="${R10_PORT%/*}"
            R10_PORT_NUMBER=$((10#$R10_PORT))
            if (( R10_PORT_NUMBER < 1024 || R10_PORT_NUMBER > 65535 )); then
              echo "R10 instrument failure: wrapper port is outside the usable range"
              exit 86
            fi
            if [[ "${CRETAS_WORKFLOW_PG_USER:-}" != cretas_ci ]]; then
              echo "R10 instrument failure: wrapper user is not cretas_ci"
              exit 86
            fi
            if [[ "${CRETAS_WORKFLOW_PG_PASSWORD+x}" != x || -n "${CRETAS_WORKFLOW_PG_PASSWORD-}" ]]; then
              echo "R10 instrument failure: wrapper password must be explicitly empty"
              exit 86
            fi
            SPRING_DATASOURCE_URL="$CRETAS_WORKFLOW_PG_URL" \
            SPRING_DATASOURCE_USERNAME="$CRETAS_WORKFLOW_PG_USER" \
            SPRING_DATASOURCE_PASSWORD="$CRETAS_WORKFLOW_PG_PASSWORD" \
            "$MVN" -B test \
              -Dmaven.test.failure.ignore=true \
              -Dtest=FactoryConfigServiceImplReorderIT \
              -Dspring.profiles.active=test \
              -DargLine="-XX:+EnableDynamicAgentLoading -Xshare:off -Xmx$NIGHTLY_XMX -XX:+HeapDumpOnOutOfMemoryError -Dspring.test.context.cache.maxSize=2"
            test -s "$R10_REPORT" || {
              echo "R10 instrument failure: FactoryConfigServiceImplReorderIT produced no fresh XML report"
              exit 86
            }
            python3 - "$R10_REPORT" <<PY
          import sys
          from xml.etree import ElementTree

          path = sys.argv[1]
          try:
              root = ElementTree.parse(path).getroot()
              tests = int(root.attrib.get("tests", "0"))
              skipped = int(root.attrib.get("skipped", "0"))
          except (OSError, ValueError, ElementTree.ParseError) as exc:
              print(f"R10 instrument failure: cannot parse fresh XML: {exc}")
              raise SystemExit(86)
          if tests <= 0 or tests - skipped <= 0:
              print(f"R10 instrument failure: XML has no executed tests (tests={tests}, skipped={skipped})")
              raise SystemExit(86)
          PY
          '

      - name: Full-suite instrument gate
        if: always()
        run: |
          if [ "${{ steps.full-suite.outcome }}" != "success" ]; then
            echo "::error::full-suite instrument failed before ratchet; this run is not a valid full-suite measurement"
            exit 1
          fi

      - name: Ratchet — 已知红只许变少
        id: ratchet
        # always(): 上一步 continue-on-error 之后仍可能是 failure 状态,
        # 而【正是那种时候】最需要棘轮把它判成 rc=2「没量到」。
        if: always()
        # 🔴 2026-08-27 实测(run 33041333971): 这一步原来调的是**裸 `python`** ——
        #    自建 macOS runner 上**没有裸 `python`**(只有 python3), 于是
        #    `python: command not found` / rc=127。
        #    而 127 既不是 1 也不是 2 ⇒ 下面两条判定**全被 skip** ⇒
        #    job 报 success、artifact 只有 146 字节、`known-failing-tests.txt` 压根没产出。
        #    **这正是本文件头警告的「崩得像成功」, 只是这次发生在棘轮自己身上。**
        # ⇒ 用 python3（托管 ubuntu 与 macOS 都有它, 裸 python 只有前者有）。
        run: |
          set +e
          # ⛔ 双保险: PR 触发时永远不写基线。
          #    第一道是调用方不传这个 input(默认 false), 第二道是这里按 event 硬否决 ——
          #    一道「只靠调用方不传」的保护, 换个调用方就没了。
          python3 scripts/ci/java-test-ratchet.py \
            --reports backend/java/cretas-api/target/surefire-reports \
            --baseline backend/java/cretas-api/known-failing-tests.txt \
            ${{ (github.event_name != 'pull_request' && inputs.write_baseline) && '--write-baseline' || '' }} \
            | tee /tmp/ratchet.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "RATCHET_RC=$rc"
          exit 0

      - name: Record normalized testcase inventory
        if: always()
        working-directory: backend/java/cretas-api
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections, hashlib, json, os, pathlib, subprocess, xml.etree.ElementTree as ET
          reports = sorted(pathlib.Path('target/surefire-reports').glob('TEST-*.xml'))
          if not reports:
              raise SystemExit('No testcase reports available for inventory')
          cases, totals = [], collections.Counter()
          for path in reports:
              root = ET.parse(path).getroot()
              for field in ('tests', 'failures', 'errors', 'skipped'):
                  totals[field] += int(root.get(field, '0'))
              for case in root.iter('testcase'):
                  classname, name = case.get('classname', ''), case.get('name', '')
                  if not classname or not name:
                      raise SystemExit('Testcase identity missing')
                  identity = hashlib.sha256((classname + '\0' + name).encode()).hexdigest()
                  state = ('error' if case.find('error') is not None else 'failed' if case.find('failure') is not None
                           else 'skipped' if case.find('skipped') is not None else 'passed')
                  cases.append({'id': identity, 'class': classname, 'state': state, 'report': path.name})
          if not cases:
              raise SystemExit('No testcases available for inventory')
          result = {'schemaVersion': 1, 'actualHead': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'actualTree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                    'reportCount': len(reports), 'caseObservations': len(cases), 'uniqueCaseCount': len({c['id'] for c in cases}),
                    'statusObservations': dict(collections.Counter(c['state'] for c in cases)),
                    'suiteReportedTotals': dict(totals), 'cases': cases}
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'java-case-inventory.json'
          output.write_text(json.dumps(result, sort_keys=True, separators=(',', ':')), encoding='utf-8')
          print('JAVA_CASE_INVENTORY=' + json.dumps({k: v for k, v in result.items() if k != 'cases'}, sort_keys=True))
          PY

      - name: 上传本次的失败名单（便于重新落基线）
        if: always()
        # ⛔ 诊断制品上传失败不许判死这道闸 —— 它是给人事后查的, 不是判据本身。
        # 2026-08-29 实测: GitHub 制品配额打满
        #   "Failed to CreateArtifact: Artifact storage quota has been hit."
        # 于是 java-full-gate 连续三个 PR 报 fail, 而「跑全量」和「棘轮」两步都是绿的,
        # 更糟的是它后面那两步「判定」被 skip 掉 —— **这道闸说不出自己的结论**。
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: java-known-failing-tests
          path: |
            /tmp/ratchet.log
            backend/java/cretas-api/known-failing-tests.txt
            ${{ runner.temp }}/java-full-resources.txt
            ${{ runner.temp }}/java-case-inventory.json
          if-no-files-found: warn

      # 🔴 2026-08-27 补的洞: 三态判定**只列了 0/1/2**, 于是任何**第四种**退出码
      #    (实测那次是 127 = command not found) 两条判定都不命中 ⇒ 静默落进「绿」。
      #    ⚠️ 这与三态机制想解决的问题**是同一个** —— 它把「没量到」从「没问题」里
      #    拆出来, 却给自己留了一条「没量到但看起来像没问题」的缝。
      # ⇒ 判据反过来写: **不是 0 也不是 1, 一律当成「没量到」**, 不枚举。
      #    ⛔ 别再写成「rc == 2」—— 那是在枚举一个开放集合。
      # ⚠️ 两种失败【必须】用不同措辞 —— 否则「没量到」会被折叠进「没问题」，
      #    一个连编译都过不去的跑批会安静地天天绿，而它一个测试都没看过。
      # 🔴 这一步守的是「本次改动为什么安全」那个论据本身。
      #
      #    2026-08-27 把 PR 闸从「窄选择器 + 任何失败都红」换成「全量 + 棘轮」时，
      #    安全性的全部依据是一句实测：**当时基线里那 5 条，没有一条落在窄选择器里**
      #    ⇒ 换成棘轮语义不放松任何一道原来拦得住的东西。
      #
      #    但那是一个**快照**。哪天有人把一个 `*ContractTest` 写进基线，
      #    那句依据就悄悄失效了，而没有任何东西会喊 —— 窄闸原本会红的那一类，
      #    从此被基线吞掉。⛔ 依据不能只写在 PR 描述里，要有东西钉着它。
      - name: 基线不许吞掉窄闸原本覆盖的类
        if: always()
        run: |
          set -e
          BASELINE=backend/java/cretas-api/known-failing-tests.txt
          if [ ! -f "$BASELINE" ]; then
            echo "基线文件不存在 —— 跳过（首次落基线时是正常的）"; exit 0
          fi
          # 取每条 `pkg.Class[$Nested].method` 里的类名（剥掉 $Nested）
          CLASSES=$(grep '^com\.' "$BASELINE" \
                    | sed 's/.*\.\([A-Za-z0-9_$]*\)\.[A-Za-z0-9_]*$/\1/' \
                    | sed 's/\$.*//' | sort -u)
          BAD=$(echo "$CLASSES" | grep -E '(ContractTest|RepositoryQueryValidationTest|StartupGuardTest)$|^FlywayVersionUniquenessTest$' || true)
          # 阳性对照: 这把尺子确实能认出窄选择器覆盖的类名, 否则「没命中」是假的
          echo "AnythingContractTest" | grep -qE '(ContractTest|RepositoryQueryValidationTest|StartupGuardTest)$|^FlywayVersionUniquenessTest$' \
            || { echo "✗ 阳性对照没过 —— 这一步的判据是坏的，本次读数作废"; exit 1; }
          echo "基线里的类数: $(echo "$CLASSES" | grep -c . || true)"
          if [ -n "$BAD" ]; then
            echo "::error title=基线吞掉了窄闸原本覆盖的类::$BAD —— 这一类「坏了就一定坏在生产上」，⛔ 不许进基线，要修。"
            exit 1
          fi
          echo "✓ 基线里没有窄选择器覆盖的类"

      - name: 判定 —— 不是 0 也不是 1，一律「没量到」
        if: ${{ steps.ratchet.outputs.rc != '0' && steps.ratchet.outputs.rc != '1' }}
        run: |
          echo "::error title=Java 全量跑批没量到::棘轮退出码 = '${{ steps.ratchet.outputs.rc }}'。可能是编译失败 / surefire 报告为空 / 解析不出结果 / 解释器不存在(127)。本次读数作废，⛔ 不代表没有新增红。"
          exit 1

      - name: 判定 —— rc=1 有新增红
        if: steps.ratchet.outputs.rc == '1'
        run: |
          echo "::error title=Java 全量出现新增红::有基线里没有的失败。见上方清单。⛔ 不要把它们加进基线 —— 基线只许变少。"
          exit 1
