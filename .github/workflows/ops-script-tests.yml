name: Ops script tests

# scripts/tests/ 下的 bash 用例此前**没有任何 workflow 触发**(2026-09-06 实测:
# 22 个 workflow 里 0 个引用它), 于是 50 个用例只在有人想起来时手跑。
#
# ⚠️ 这里**新开一个 workflow**, ⛔ 没有把这些路径塞进别人的 paths: ——
#    2026-08-28 的教训: 给一道闸加宽 glob, 把**另一道闸**「证明自己不过宽」的
#    阴性对照变成了恒真式。新闸该有自己的 workflow。

on:
  # 🔴 2026-09-06 加 push:main —— 此前只在 pull_request 跑, main 自己从不跑。#660 合并后
  #    main 在 test-soft-delete-orphans-sql-drift.sh 上红了半天没人看见, 直到下一个无关 PR
  #    (#658) 撞上才发现: 「main 是绿的」当时是没人量过的假设。
  #    ⚠️ 这里刻意**不带 paths**: GitHub Actions 不支持 YAML 锚点, 再抄一份 12 条的清单就是
  #    第二份会漂的副本(形态 D); 一次 main 跑批 ~1 分钟, 每次都跑比漏一次便宜。
  push:
    branches: [main]
  pull_request:
    paths:
      # ⚠️ scripts/** 是整面 —— test-pipeline-tail-swallows-rc.sh 扫的是**所有** .sh,
      #    只列子目录的话, 改 scripts/ota/ 或 scripts/migrations/ 的 PR 触发不到这道闸。
      - 'scripts/**'
      - 'scripts/tests/**'
      - 'scripts/ci/run-script-tests.sh'
      - 'scripts/tests/known-failing.txt'
      - 'scripts/cron/**'
      - 'scripts/check-soft-delete-orphans.sh'
      - 'scripts/deploy/server-script-inventory.conf'
      # 🔴 2026-09-06 补: 这 48 个用例守的**被测对象**原本一个都不在 paths 里 ——
      #    改 scripts/deploy/*.sh 或 scripts/lib/deploy-common.sh 的 PR, 这道闸
      #    一次都不跑。那正是它自己刚照出来的那类缺陷(形态 B: 机制在, 没接上):
      #    · release-java-preflight.sh 少一个执行位 ⇒ 发布链 rc=126
      #    · acquire_deploy_lock 在判定前截断锁文件 ⇒ 锁永久卡住
      #    两处都在 scripts/deploy|lib 下, 改它们的那个 PR 不会触发本闸。
      #    ⚠️ 这里加宽的是**本闸自己的** paths, ⛔ 不是往别人的 workflow 里塞
      #    (2026-08-28 教训: 给别人加宽 glob 会把那边的阴性对照变成恒真式)。
      - 'scripts/deploy/**'
      - 'scripts/lib/**'
      # 🔴 2026-09-07: test-fresh-db-progress-ratchet.sh 声明 `# GUARDS=scripts/testing/…`,
      #    而 scripts/testing/ 原本不在触发面里 —— 这一条是**新装的 GUARDS 闸自己抓出来的**
      #    (它上线后第一次真用, 就红在加它的那个 PR 上)。⛔ 修法是加 paths, 不是改小声明。
      - 'scripts/testing/**'
      # 🔴 2026-09-07: test-fresh-db-baseline-contract.sh 声明依赖采集脚本与两个 pg profile
      #    (它钉的正是「基线不许变成一条 Flyway 迁移」那两条禁令)。同样是**新装的 GUARDS 闸
      #    自己抓出来的** —— 它第二次真用, 又红在加它的那个 PR 上。⛔ 修法是加 paths。
      - 'scripts/ops/**'
      # 🔴 2026-09-07: test-fresh-db-baseline-replays.sh(离线验证器)读的就是这个目录 ——
      #    改基线的 PR 必须触发它, 否则「基线被改坏了」与「没问题」读数相同。
      #    ⚠️ 这是那道 GUARDS 闸**第三次**抓住加它的那个 PR 自己。
      - 'ops/db-baseline/**'
      - 'backend/java/cretas-api/src/main/resources/application-pg.properties'
      - 'backend/java/cretas-api/src/main/resources/application-pg-prod.properties'
      # 🔴 2026-09-07: test-java-gate-selector-covers-gate-classes.sh 的**被测对象**是
      #    「测试类的名字」—— 它要拦的正是「有人新加了一道闸, 但名字逃出 java-gate-pr 的
      #    -Dtest」。那种 PR 只动 Java 测试源码, 不带这道闸就等于闸装了但那一族 PR 触发不到
      #    (同一个洞今天第三次了: #713 是 java-gate-pr.yml, #723 是 web-dist.yml)。
      #    ⚠️ 刻意只写**测试源目录**, ⛔ 不是整个 backend/java/** —— 改主代码不需要重跑这
      #    2 分 53 秒的跑批, 而新增/改名测试类必须。
      - 'backend/java/cretas-api/src/test/java/**'
      # 三个用例现在断言 ci.yml / java-artifact.yml 的结构(打包住在哪、push paths
      # 覆不覆盖整棵 backend 树、制品保留几天), 所以改这两个文件也要跑一遍。
      - '.github/workflows/ci.yml'
      - '.github/workflows/java-artifact.yml'
      # 🔴 2026-09-07 补: test-release-ci-artifact-prewarm.sh 第 9 节现在对 web-dist.yml
      #    **也**做断言(`Ship attestation bundle …` 这一步必须恰好 1 个 —— 改了名就把 web
      #    车道那段签名检查变成恒 unknown)。被断言的文件不在触发面里, 就是 #713 那个 P0 的
      #    形状: 只动它的 PR 触发不到这道闸, 而「没跑」与「跑了没问题」读数完全相同。
      - '.github/workflows/web-dist.yml'
      - '.github/workflows/ops-script-tests.yml'
      # 🔴 2026-09-07 P0 的直接教训: `test-ci-gate-runs-merge-result.sh` 断言的正是下面这几个
      #    文件的结构(三处 head.sha pin / 内联 merge 步骤 / ⛔ 不许用本地 composite action),
      #    而它们**一个都不在这份 paths 里** ⇒ 一个**只动 `.github/actions/`** 的 PR 让那道闸
      #    一次都没触发, 于是「删了 action 却留着三处 uses:」这种会让全仓 CI 停摆的状态,
      #    在 PR 上是**全绿**的。⇒ 闸断言谁的结构, 谁就必须在触发面里(形态 B)。
      #    ⚠️ `.github/actions/**` 现在是空目录也要留着 —— 它正是那次出事的路径。
      - '.github/workflows/java-gate-pr.yml'
      - '.github/workflows/java-full-nightly.yml'
      - '.github/actions/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  script-tests:
    # ⛔ 字面量。`${{ vars.X }}` 在 `runs-on` 里求值为**空**(job 被派成 ubuntu-latest
    #    而不报错) —— 已逐条排除 fork/visibility/授权/时序, 那是能力边界不是配错。
    #    见 .claude/rules/ci-runner-routing.md。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # 🔴 test-pipeline-tail-swallows-rc.sh 只拦**新增**行 ⇒ 要 merge-base ⇒ 要全历史。
          #    浅克隆下它会如实报 `base=<unavailable> —— **没量到**`, ⛔ 不会假绿, 但也就没用了。
          fetch-depth: 0

      # 🔴 2026-09-06 订正: 原来这里写「⛔ 不编译、不需要 JDK」—— 那句话是错的。
      #    test-release-artifacts-failfast.sh 与 test-release-parallel-fastlane.sh
      #    **真跑** scripts/deploy/release-java-preflight.sh, 而它硬性要求 JDK 21+。
      #    runner 的默认 JAVA_HOME 是 **Temurin 17**(image readme: `17.0.20+1 (default)`),
      #    于是这两个用例在 CI 上分别报
      #      "preflight rejected the current, working JDK"
      #      "ERROR: release requires JDK 21 or newer, found 17"
      #    —— 把「这台机器的 JDK 太老」说成了「预检坏了」。
      #    ⇒ 显式装 21。⛔ 不是让用例去迁就 17(那等于把发布预检的判据改松)。
      #    ⚠️ 装不上也不至于假绿: 两个用例都会探测前提, 探不到 21 就 rc=77 +
      #       `SKIPPED:`(见 scripts/tests/lib/release-jdk-probe.sh), 而 SKIPPED
      #       在 run-script-tests.sh 里**不计进 PASS**。
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prove the release JDK landed
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          major=$("$JAVA_HOME/bin/java" -version 2>&1 | sed -nE '1s/.*version "([0-9]+).*/\1/p')
          echo "JAVA_MAJOR=$major"
          # ⛔ 只断言下限, 不钉死 21 —— 装了更新的版本不该把这一步弄红。
          [ "$major" -ge 21 ]

      # 生成器只做**源码级**扫描(读 .java 文本 + 读 hasdel 快照), 不编译。
      - name: Show interpreter versions
        run: |
          set -euo pipefail
          echo "bash=$(bash --version | head -1)"
          echo "python3=$(python3 --version)"
          # 生成器调的是裸 `python`。ubuntu-latest 上只有 python3 ⇒ 显式补一个垫片,
          # ⛔ 不改生成器去迁就 CI(它在开发机上是 `python`)。
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec python3 "$@"\n' > "$HOME/.local/bin/python"
          chmod +x "$HOME/.local/bin/python"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prove the shim landed
        run: |
          set -euo pipefail
          command -v python
          python --version

      # ⛔ 没有 `|| true`、没有管道尾 tail —— runner 的 rc 就是这一步的 rc。
      - name: Run scripts/tests/*.sh
        run: bash scripts/ci/run-script-tests.sh
