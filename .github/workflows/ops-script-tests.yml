name: Ops script tests

# scripts/tests/ 下的 bash 用例此前**没有任何 workflow 触发**(2026-09-06 实测:
# 22 个 workflow 里 0 个引用它), 于是 50 个用例只在有人想起来时手跑。
#
# ⚠️ 这里**新开一个 workflow**, ⛔ 没有把这些路径塞进别人的 paths: ——
#    2026-08-28 的教训: 给一道闸加宽 glob, 把**另一道闸**「证明自己不过宽」的
#    阴性对照变成了恒真式。新闸该有自己的 workflow。

on:
  # 🔴 2026-09-06 加 push:main —— 此前只在 pull_request 跑, main 自己从不跑。#660 合并后
  #    main 在 test-soft-delete-orphans-sql-drift.sh 上红了半天没人看见, 直到下一个无关 PR
  #    (#658) 撞上才发现: 「main 是绿的」当时是没人量过的假设。
  #    ⚠️ 这里刻意**不带 paths**: GitHub Actions 不支持 YAML 锚点, 再抄一份 12 条的清单就是
  #    第二份会漂的副本(形态 D); 一次 main 跑批 ~1 分钟, 每次都跑比漏一次便宜。
  push:
    branches: [main]
  # pull_request 不带 paths (合并队列/必需检查要求每个 PR 都报告结果); 触发路径清单在
  # scripts/ci/trigger-paths/ops-script-tests.txt, 由下面的 changes 作业判定原作业跑不跑。
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 合并队列准备 (2026-11-12): 判断这次 PR 有没有改到本闸的触发路径。
  #   清单: scripts/ci/trigger-paths/ops-script-tests.txt (原 on.pull_request.paths 原样搬过去)。
  #   pull_request 以外的事件 (merge_group / push / schedule / workflow_dispatch) 一律 run=true;
  #   取不到 diff 也 run=true —— 宁可多跑, ⛔ 不因为没量到而跳过。
  # 下游作业的 if 写成 `!cancelled() && needs.changes.outputs.run != 'false'`: 本作业自己失败
  # (输出为空) 时下游照跑, ⛔ 不让判定仪器坏掉变成「被跳过 = 必需检查通过」。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 三点 diff 要 merge-base; 只要提交与树, blob 按需取。
          fetch-depth: 0
          filter: blob:none
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/changed-paths.py --patterns scripts/ci/trigger-paths/ops-script-tests.txt

  script-tests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    # ⛔ 字面量。`${{ vars.X }}` 在 `runs-on` 里求值为**空**(job 被派成 ubuntu-latest
    #    而不报错) —— 已逐条排除 fork/visibility/授权/时序, 那是能力边界不是配错。
    #    见 .claude/rules/ci-runner-routing.md。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # 🔴 test-pipeline-tail-swallows-rc.sh 只拦**新增**行 ⇒ 要 merge-base ⇒ 要全历史。
          #    浅克隆下它会如实报 `base=<unavailable> —— **没量到**`, ⛔ 不会假绿, 但也就没用了。
          fetch-depth: 0

      # 🔴 2026-09-06 订正: 原来这里写「⛔ 不编译、不需要 JDK」—— 那句话是错的。
      #    test-release-artifacts-failfast.sh 与 test-release-parallel-fastlane.sh
      #    **真跑** scripts/deploy/release-java-preflight.sh, 而它硬性要求 JDK 21+。
      #    runner 的默认 JAVA_HOME 是 **Temurin 17**(image readme: `17.0.20+1 (default)`),
      #    于是这两个用例在 CI 上分别报
      #      "preflight rejected the current, working JDK"
      #      "ERROR: release requires JDK 21 or newer, found 17"
      #    —— 把「这台机器的 JDK 太老」说成了「预检坏了」。
      #    ⇒ 显式装 21。⛔ 不是让用例去迁就 17(那等于把发布预检的判据改松)。
      #    ⚠️ 装不上也不至于假绿: 两个用例都会探测前提, 探不到 21 就 rc=77 +
      #       `SKIPPED:`(见 scripts/tests/lib/release-jdk-probe.sh), 而 SKIPPED
      #       在 run-script-tests.sh 里**不计进 PASS**。
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove the release JDK landed
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          # JAVA_TOOL_OPTIONS emits a preamble before the version line.
          major=$("$JAVA_HOME/bin/java" -version 2>&1 | sed -nE 's/.*version "([0-9]+).*/\1/p')
          echo "JAVA_MAJOR=$major"
          # ⛔ 只断言下限, 不钉死 21 —— 装了更新的版本不该把这一步弄红。
          [ "$major" -ge 21 ]

      - name: Install isolated script-test Python dependencies
        run: |
          set -euo pipefail
          # Same relocated-CPython handling as python-gate.yml: venv must use
          # the real executable, not its /usr/local/bin compatibility symlink.
          python_bin=''
          for candidate in python3.11 python3.12 python3; do
            if command -v "$candidate" >/dev/null 2>&1; then
              python_bin=$("$candidate" -c 'import os, sys; print(os.path.realpath(sys.executable))')
              break
            fi
          done
          [ -n "$python_bin" ] || { echo 'No Python interpreter available' >&2; exit 1; }
          echo "PYTHON_USED=$python_bin"
          "$python_bin" -m venv "$RUNNER_TEMP/ops-script-python"
          "$RUNNER_TEMP/ops-script-python/bin/python" -m pip install 'PyYAML>=6.0,<7.0.0'
          "$RUNNER_TEMP/ops-script-python/bin/python" -c 'import importlib.metadata, yaml; print("PyYAML=" + importlib.metadata.version("PyYAML")); print("PYTHON_YAML_MODULE=" + yaml.__file__)'
          echo "$RUNNER_TEMP/ops-script-python/bin" >> "$GITHUB_PATH"

      # 生成器只做**源码级**扫描(读 .java 文本 + 读 hasdel 快照), 不编译。
      - name: Show interpreter versions
        run: |
          set -euo pipefail
          echo "bash=$(bash --version | head -1)"
          echo "python3=$(python3 --version)"
          # 生成器调的是裸 `python`。ubuntu-latest 上只有 python3 ⇒ 显式补一个垫片,
          # ⛔ 不改生成器去迁就 CI(它在开发机上是 `python`)。
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec python3 "$@"\n' > "$HOME/.local/bin/python"
          chmod +x "$HOME/.local/bin/python"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prove the shim landed
        run: |
          set -euo pipefail
          command -v python
          python --version

      # ⛔ 没有 `|| true`、没有管道尾 tail —— runner 的 rc 就是这一步的 rc。
      - name: Run scripts/tests/*.sh
        env:
          CRETAS_BASELINE_NATIVE_PG: '1'
        run: bash scripts/ci/run-script-tests.sh

      - name: Verify isolated test PostgreSQL lifecycle
        run: python3 scripts/tests/test_ci_postgres_wrapper.py
