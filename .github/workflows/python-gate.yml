name: Python Gate

# 见 web-admin-gate.yml 顶部的「为什么是独立 workflow」。python 这边多两个坑:
#
# 1. ci.yml 的 `python-lint-test` 里那步是 `pytest ... || true` —— 就算 job 真跑了,
#    pytest 失败也不可能让它变红。本 workflow 不加 `|| true`。
#
# 2. ci.yml 只收 `tests/`, 而仓里有 186 个测试文件在 `tests/` 之外, 其中 37 个是
#    `smartbi/services/restaurant` —— 正是这一周一直在发布的那块代码, 一次都没被 CI 跑过。
#
# 2026-07-31 逐目录实测 (本机 py3.11), 决定下面这份路径清单:
#   ota/tests                                10 文件  116 passed
#   efficiency_recognition/tests              1 文件    5 passed
#   smartbi/agent|api|external_benchmarks|ingestion/tests  12 文件  293 passed
#   smartbi/services/**                       41 文件  ~590 passed / 3 failed
#   smartbi/gold/tests                        10 文件  109 passed / 35 failed(见下)
#   smartbi/tests                             75 文件  —— 刻意排除, 见下
#
# ⛔ 排除 `smartbi/tests/`: 那 75 个是 legacy 独立脚本 (test_e2e_quick /
#    test_full_e2e_with_save 之类), 要活服务才能跑。
#
#    2026-08-10 实测把这段说明修准了 —— 原文说「其中 test_e2e_performance_monitor.py
#    会关掉 stderr 搞崩整个进程」, **低估了范围**。逐文件量出来的真实构成:
#       1 个  真 pytest 用例(无顶层副作用)
#      63 个  有用例, 但**也有顶层副作用**
#      11 个  纯脚本(一个 test 函数都没有) —— 被 pytest 收集 = 被执行
#    进程归零有**两个**独立成因, 不是一个:
#      (a) 3 个文件在导入期改绑 sys.stdout/stderr(不是 1 个) → 掐断 pytest 捕获,
#          之后 seek(0) 抛 `ValueError: I/O operation on closed file`。
#          ✅ 已修: 加 `and "pytest" not in sys.modules` 守卫。
#      (b) 纯脚本在导入期跑到 `exit(1)`(如 test_vl_simple.py 图片不存在时)
#          → `INTERNALERROR> SystemExit: 1`, 收集阶段就死。**未修**。
#    要纳入门禁, 得给这 74 个补 `if __name__ == "__main__"` 守卫再逐个 triage
#    (多数还需活服务 / API key) —— 是独立一件事, 不该挡住这道闸。
#    判据: **模块导入期不要改全局 IO / 不要 exit** —— 一个导入期副作用挡住了
#          75 个文件几个月。
#
#    2026-08-10 第二次实测 —— **试着把它加进下面的路径清单, 结果否掉了这个想法**:
#      单独跑 smartbi/tests : 771 passed / 19 failed / 31 errors(集中在 17 个文件)
#      并进全套一起跑       : **37 failed**, 其中 **7 个是原本绿的别处用例**:
#          tests/test_llm_router_fallback.py                     ×2
#          smartbi/gold/tests/test_semantic_planner_budget.py    ×2
#          smartbi/gold/tests/test_llm_capacity_gate.py          ×2
#          smartbi/services/restaurant/tests/test_batch_regression_golden.py ×1
#      另外 test_sweep_drivers.py(18) / test_supplier_price_ingest.py(11) 单独跑是绿的,
#      并进来才红 —— 同样是顺序/全局态问题。
#    ⛔ 所以拦路的**不是**「这 17 个文件自己坏」, 而是**这个目录的全局态污染会外溢**,
#      把别人的绿用例带红。纳入门禁的前置条件是先找出污染源(疑似 LLM router / 全局
#      单例被模块级改写), 而不是把 17 个文件挂上台账了事 —— 那样闸会因为别处的红而
#      变红, 债记在错的地方。
#    判据: **「单独跑绿」不能推出「并进去也绿」; 要纳入一批测试, 必须用并进去之后的
#          读数做决定。**
#    📌 已经试过二分定位污染源, **没定到**: 传目录名 `smartbi/tests` 能稳定复现,
#       把 75 个文件逐个列在命令行上(排序后)**就不复现** —— 说明是**顺序依赖**,
#       而不是某一个文件单独作恶。(文件数两种数法都是 75, 不是清单遗漏。)
#       下一步该用 `-p no:randomly` + `--co -q` 对比两种形式的实际收集顺序, 或用
#       pytest-order / 逐步前缀法沿真实顺序二分。留给独立一轮。
#
# ⚠️ `smartbi/gold/tests` 本机 35 failed 全是同一句
#    `RuntimeError: There is no current event loop in thread 'MainThread'` ——
#    本机 py3.11 + pytest 9 的 asyncio 行为, 而这里跑的是 **py3.10**。
#    首次 CI 跑绿即证明是本机环境差异; 若在 CI 也红, 就把这一行摘掉并单独立项,
#    不要为了让闸变绿而给它加 `|| true` —— 那正是本 workflow 要根治的东西。
#
# 🔴 刻意**不跑 flake8**: ci.yml 那步 `flake8 --max-line-length=120 ... .` 目前有
#    299 条违规 (189 条 E501 等), 07-30 那次 python-lint-test 就是它挂的。
#    那是另一笔独立的债, 捆进来会让这道闸从第一天起就挡所有人。要清是另一个 PR。

on:
  push:
    branches:
      - main
    paths:
      - 'backend/python/**'
      - '.github/workflows/python-gate.yml'
      - 'scripts/cron/time-phrase-backlog-daily.sh'   # 闸读它/执行它 —— 触发面必须覆盖它
  pull_request:
    paths:
      - 'backend/python/**'
      - '.github/workflows/python-gate.yml'
      - 'scripts/cron/time-phrase-backlog-daily.sh'   # 闸读它/执行它 —— 触发面必须覆盖它
  # 手动触发 —— 2026-08-26 加。
  # 本闸此前在 GitHub 上被 disabled_manually, 停用期间攒了 8 条红(其中 1 条是真的
  # 产品退化: 第二个 `mismatch == …` 身份比较长了出来)。清完重新启用时发现:
  # 没有 workflow_dispatch 就**没有办法验证「开了之后它是绿的」** —— 只能等下一次
  # 有人碰 backend/python 才知道, 而那时红了又会变成「谁的锅」。
  # ⚠️ 本机 py3.11 跑绿 ≠ CI py3.10 跑绿, 所以「开闸后立刻手动跑一次」是必要动作,
  #    不是方便功能。
  workflow_dispatch:

concurrency:
  group: python-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # ⛔ 不要手工改这一行 —— 它由 `python scripts/ci/switch_ci_runner.py hosted|self-hosted`
    #    统一切换(一次改全部已接入的工作流并断言各处一致)。
    #    见 `.claude/rules/ci-runner-routing.md`。
    runs-on: [self-hosted, cretas]
    defaults:
      run:
        working-directory: backend/python
    steps:
      - uses: actions/checkout@v4

      # setup-python 只在**托管** runner 上跑。自建 macOS runner 上它必失败:
      # 它的 macOS 安装脚本把 `/Users/runner` 写死(托管 runner 的用户名就叫 runner),
      # 而本机用户是 rex 且 /Users 不可写 -> `mkdir: /Users/runner: Permission denied`。
      # (与 secret-regression.yml 里同一处理, 那边已实测过预置工具缓存不管用。)
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/python/requirements.txt

      # 🔴 自建 runner 上跑的**不是 3.10** —— 本文件顶部那句
      #    「本机 py3.11 跑绿 ≠ CI py3.10 跑绿」在这里同样成立, 方向相反:
      #    落到自建时这道闸测的是另一个小版本。
      # ⇒ 所以这一步**把版本打出来**, 并只断言下限(≥3.10)。
      #    ⛔ 不允许静默用一个更老的版本跑 —— 那样绿了也不算数。
      # ⚠️ 自建只是额度耗尽时的兜底; 额度恢复切回托管, 版本就回到 3.10。
      #    「这一轮的读数是在哪个解释器上量的」必须能从日志里读出来。
      - name: Use system Python in a venv (self-hosted)
        if: runner.environment != 'github-hosted'
        # ⛔ 不往系统 Python 里装包, 而是**建 venv**, 两个理由:
        #   1. homebrew 的 Python 3.11+ 带 PEP 668 标记, 直接 `pip install` 会被
        #      拒成 `externally-managed-environment`。
        #   2. 这台自建 runner 是**长期在跑的真机**, 往它的系统 Python 里装
        #      一整份 requirements.txt 是在污染别人的机器。
        # venv 建在 $RUNNER_TEMP 下, job 结束即随临时目录消失。
        run: |
          set -e
          for c in python3.10 python3.11 python3.12 python3; do
            if command -v "$c" >/dev/null 2>&1; then
              V=$("$c" -c 'import sys;print("%d.%d"%sys.version_info[:2])')
              case "$V" in
                3.1[0-9]|3.[2-9]*)
                  echo "PYTHON_USED=$c ($V)  ⚠️ 托管上是 3.10"
                  "$c" -m venv "$RUNNER_TEMP/venv"
                  echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
                  exit 0
                  ;;
              esac
            fi
          done
          echo "✗ 找不到 >=3.10 的 python —— 本闸不能在一个更老的解释器上假装绿"
          exit 1
      - name: Install dependencies
        # ⚠️ 一律用 `python -m pip`, ⛔ 不要用裸 `pip`。
        #    托管镜像里 setup-python 会同时放一个 `pip` 到 PATH 上, 自建的 macOS 上
        #    homebrew 只给 `pip3.11` / `pip3`, **没有裸 `pip`** ——
        #    2026-08-27 实测 `pip: command not found`, exit 127, 整个闸挂在装依赖这一步。
        #    `python -m pip` 用的就是上一步选中的那个解释器, 两边都成立, 也不会
        #    出现「pip 属于 A 解释器而代码跑在 B 解释器上」。
        run: |
          python -m pip install --upgrade pip
          python -m pip install --use-deprecated=legacy-resolver -r requirements.txt || python -m pip install -r requirements.txt
          # ⚠️ flake8 是 `tests/test_no_undefined_names.py` 那道 **F821 窄闸**
          #    需要的。⛔ 这里**不跑**全量 flake8(见本文件顶部: 299 条存量债),
          #    只让那道闸能开火 —— 它 `--select=F821`, 全仓 0 条。
          # 🔴 不装的后果实测过: 闸的「新增违规」那条会 skip(长得像绿),
          #    只有阳性对照会红。**闸不跑 = 没有闸。**
          python -m pip install pytest pytest-asyncio pytest-timeout flake8
      - name: Run pytest
        # 没有 `|| true` —— 红就是红, 这是本 workflow 的全部意义。
        #
        # 排除清单在 `ci-gate-excludes.txt`, 每条带原因, 清一条删一条。
        # 放文件而不是堆在这里, 是为了让「还欠多少」一眼可数 (当前 29 个文件),
        # 而不是变成 YAML 里一长串没人读的 --ignore。
        run: |
          EXCLUDES=$(grep -vE '^\s*#|^\s*$' ci-gate-excludes.txt \
            | sed 's/[[:space:]]*#.*$//' | sed 's/^/--ignore=/' | tr '\n' ' ')
          echo "排除 $(echo "$EXCLUDES" | wc -w) 个文件 (见 ci-gate-excludes.txt)"
          pytest \
            tests/ \
            ota/tests \
            efficiency_recognition/tests \
            smartbi/agent/tests \
            smartbi/api/tests \
            smartbi/external_benchmarks/tests \
            smartbi/gold/tests \
            smartbi/ingestion/tests \
            smartbi/services \
            smartbi/tests \
            --timeout=60 \
            --ignore=tests/test_data_accuracy.py \
            $EXCLUDES \
            -k "not e2e and not integration" \
            --tb=short
