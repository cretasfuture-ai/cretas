name: Java Gate

# Java PR 分层门禁：
#
# 1. 每次 push 都跑快速门禁。它编译全部 main/test 源码，并执行契约、真实 JPA
#    Repository 启动、Flyway、权限/安全等高信号测试；任何失败直接红，不走基线。
# 2. 独立 PostgreSQL job 每次 push 都在唯一 disposable DB 上验证撤回审批行锁并发。
# 3. 只有最终候选加上 `java-full-ready` 标签后才调用全量棘轮。
#    标签保留时再 push 会触发 synchronize，对新的 PR HEAD 重跑；旧 run 由 concurrency
#    取消，不能拿旧 HEAD 的绿灯冒充最终候选。
# 4. 夜间全量仍由 java-full-nightly.yml 的 schedule 独立执行。
#
# 这不是恢复 2026-08-27 以前的“只跑窄闸就允许合并”。快速门禁负责反馈速度，
# `java-full-ready` 全量负责最终候选覆盖；两者缺一不可。

on:
  # pull_request 不带 paths (合并队列/必需检查要求每个 PR 都报告结果); 触发路径清单在
  # scripts/ci/trigger-paths/java-gate-pr.txt, 由下面的 changes 作业判定原作业跑不跑。
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    types: [checks_requested]

concurrency:
  # merge_group 下没有 pull_request.number: 若只用它, 所有队列运行同组互相取消 ⇒ 回落到 github.ref
  # (队列分支 gh-readonly-queue/... 每个合并组唯一)。
  group: java-pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # mini 优先、满了溢出的阈值: 该标签上排队作业数 >= 它就走托管。
  # 2026-11-19 Steve: mini 槽 1-4 注册 cretas-mini-pg (PG 线), 槽 5 专给 fast-contracts (cretas-mini-fast)。
  # 2026-11-19 Steve「晚上 22:00 之后恢复跑满 runner, 8 点之后变成 1 pg 1 fast」(北京时间, 时段唯一定义在
  # scripts/ci/canada-mini-gate/refill.sh 的 mini_window, changes 作业调 `refill.sh --window` 取 full/day):
  #   day  (08-22): mini 只开槽 1、2 (PG) + 槽 5 (fast), 共 3 个 (2026-11-19 Steve「白天最多总计 3 个」);
  #         PG 只派第 2、3 片, 阈值 MINI_PG_QUEUE_THRESHOLD (2)。
  #   full (22-08): 槽 1-5 全开; PG 4 片都可上 mini, 阈值 MINI_PG_QUEUE_THRESHOLD_FULL (4)。
  # 时段读不到 (输出为空) 按 day 处理: 只会少派, 不会多派。
  MINI_PG_QUEUE_THRESHOLD: '2'
  MINI_PG_QUEUE_THRESHOLD_FULL: '4'
  MINI_FAST_QUEUE_THRESHOLD: '1'

jobs:
  # 合并队列准备 (2026-11-12): 判断这次 PR 有没有改到本闸的触发路径。
  #   清单: scripts/ci/trigger-paths/java-gate-pr.txt (原 on.pull_request.paths 原样搬过去)。
  #   pull_request / merge_group 按 diff 判, 其余事件 (push / schedule / workflow_dispatch) 一律 run=true;
  #   取不到 diff 也 run=true —— 宁可多跑, ⛔ 不因为没量到而跳过。
  # 下游作业的 if 写成 `!cancelled() && needs.changes.outputs.run != 'false'`: 本作业自己失败
  # (输出为空) 时下游照跑, ⛔ 不让判定仪器坏掉变成「被跳过 = 必需检查通过」。
  changes:
    # 2026-11-18 mini 优先、满了溢出: 本作业兼做分片路由, ⛔ 必须在托管机上 (放 mini 上的话 mini 一满它自己也排队,
    # 溢出就失效了)。路由脚本 scripts/ci/route-mini-or-hosted.sh 按标签各跑一次: 数该标签上排队的作业,
    # 少于阈值输出该标签, 否则 ubuntu-latest; 每次打一行 ROUTE=... label=...
    #   runner_pg   cretas-mini-pg   阈值按时段 (槽 1-4; 白天只开槽 1、2, 只派 PG 第 2、3 片, 夜间 4 片都可上 mini)
    #   runner_fast cretas-mini-fast 阈值 MINI_FAST_QUEUE_THRESHOLD (槽 5, 只派 fast 第 3 片, 其余 3 片并行在托管)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read   # 路由脚本读 Java Gate 运行/作业列表
    outputs:
      run: ${{ steps.filter.outputs.run }}
      runner_pg: ${{ steps.route-pg.outputs.runner_pg }}
      runner_fast: ${{ steps.route-fast.outputs.runner_fast }}
      mini_window: ${{ steps.window.outputs.mini_window }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 三点 diff 要 merge-base; 只要提交与树, blob 按需取。
          fetch-depth: 0
          filter: blob:none
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: python3 scripts/ci/changed-paths.py --patterns scripts/ci/trigger-paths/java-gate-pr.txt
      # 路由: 脚本恒 exit 0; 读不到排队数走托管并打 ROUTE=hosted reason=api-error。
      # 本步骤自己崩了 (输出为空) 时下游表达式同样落 ubuntu-latest。
      # 时段 full/day (北京时间, 定义见 refill.sh mini_window); 失败时输出为空 = 按 day。
      # 仓库变量 MINI_DAY_FULL=1 = 白天也按 full 派 (mini 端同时要有 ~/gh-gate/day-full, 见 refill.sh mini_window)。
      - id: window
        env:
          GH_GATE_DAY_FULL: ${{ vars.MINI_DAY_FULL }}
        run: echo "mini_window=$(bash scripts/ci/canada-mini-gate/refill.sh --window)" | tee -a "$GITHUB_OUTPUT"
      - id: route-pg
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          MINI_LABEL: cretas-mini-pg
          # mini 在线心跳 (refill.sh 每分钟写); 缺失/超过 3 分钟 -> 整片托管 (reason=mini-offline)
          MINI_HEARTBEAT: ${{ vars.MINI_HEARTBEAT }}
          MINI_QUEUE_THRESHOLD: ${{ steps.window.outputs.mini_window == 'full' && env.MINI_PG_QUEUE_THRESHOLD_FULL || env.MINI_PG_QUEUE_THRESHOLD }}
          ROUTE_OUTPUT_KEY: runner_pg
        run: bash scripts/ci/route-mini-or-hosted.sh
      - id: route-fast
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          MINI_LABEL: cretas-mini-fast
          # mini 在线心跳 (refill.sh 每分钟写); 缺失/超过 3 分钟 -> 整片托管 (reason=mini-offline)
          MINI_HEARTBEAT: ${{ vars.MINI_HEARTBEAT }}
          MINI_QUEUE_THRESHOLD: ${{ env.MINI_FAST_QUEUE_THRESHOLD }}
          ROUTE_OUTPUT_KEY: runner_fast
        run: bash scripts/ci/route-mini-or-hosted.sh

  fast-contracts-shard:
    needs: changes
    # 最终候选的全量已经包含这些测试；2 台 runner 上再跑一份只会与全量争槽。
    # merge_group 下没有标签 ⇒ !contains(...) 为真, 队列里照跑快速门禁。
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' && !contains(github.event.pull_request.labels.*.name, 'java-full-ready') }}
    # 分片 (2026-11-10): 类清单 scripts/ci/java-gate-fast-patterns.txt 按类名哈希取模分 4 片并行;
    # 原 job 名 fast-contracts 由下面的汇总 job 保留 (分支保护/各会话判据不变)。
    name: fast-contracts-shard (${{ matrix.shard }}/4)
    # 2026-11-18 (Steve「直接开始接托管那边的部分」) 上 canada-mini; 2026-11-19 Steve 改为 mini 第 5 槽 (标签
    # cretas-mini-fast) 专给 fast: 只有第 3 片可能派去 mini (该标签没有排队时), 其余 3 片并行在托管, 不因串行变慢。
    # (不派第 0 片: 2026-11-19 它在 mini 上有 OOM, 另一条线在查。) fork PR / ci-hosted 仍托管。
    runs-on: ${{ matrix.shard == 3 && needs.changes.outputs.runner_fast == 'cretas-mini-fast' && (github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository) && !contains(github.event.pull_request.labels.*.name, 'ci-hosted') && 'cretas-mini-fast' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    # 2026-11-14: 正常一片 ≤16 分钟; 卡死会拖到平台 55 分钟取消。30 分钟必然是异常。
    timeout-minutes: 30
    # GitHub-hosted (public repo: 4 vCPU / 16 GB): one shared surefire fork (Maven default) at 6g (2026-11-19: 10g→6g, 上下文缓存上限 8, 见 step 内根因)。
    # 下面 2026-11-14 那段是降到 10g 时的历史记录。
    # 2026-11-14: 12g→10g (Maven 保持 2g: 1g 实测编译测试就 OOM)。实测 (PR #1700 MEMGUARD): 存活堆 >8g (8g 会 GC 死循环后 OOM), 12g 吃光整机
    # (无 swap ⇒ 日志断流, fork 内看门狗和步骤超时都不开火); 10g 下可用内存最低 1.2GB。
    # mem-guard.sh 每 30 秒打印 MEMGUARD 读数, 可用内存见底时在冻住前杀 fork。
    # Measured 2026-10-25: a shared fork reached 3759 tests in 13 min but OOMed at 6g; one fresh JVM per
    # class (-DreuseForks=false) took 44 min with 2 forks and >60 min with 3 (~700 Spring startups).
    env:
      CRETAS_JAVA_FORK_XMX: 6g
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # 合并 base 需要共同祖先; 浅克隆合不了。
          fetch-depth: 0
      # 闸要跑在【合并结果】上, 不是 PR 分支自己 (见该 action 的注释)。
      # 🔴 **内联, ⛔ 不用本地 composite action** (`uses: ./.github/actions/...`):
      #    pull_request 事件下 **workflow 定义从 base 读**, 而 `./` 开头的本地 action 从
      #    **checkout 出来的工作区**读 —— 我们 checkout 的是 `pull_request.head.sha`, 于是任何
      #    **head 不含那个目录**的 PR(旧分支 / 开了几天的 PR)这一步必死:
      #      `Can't find 'action.yml' … under .github/actions/merge-pr-base`, 9 秒红。
      #    2026-09-07 实测: 它炸掉了当时**所有**在飞 PR 的 Java 闸, 而且长得像「CI 没测出问题」
      #    而不是「CI 坏了」—— rebase 只能绕过去, 任何人从旧 base 开分支还会再撞一次。
      #    ⇒ 内联的 run 块跟着 workflow 定义走(**总是来自 base**), 与 head 的树无关。
      # ⚠️ 三处内联必须**逐字相同** —— scripts/tests/test-ci-gate-runs-merge-result.sh 钉了这条。
      - name: Merge PR base into head (pull_request only)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PAYLOAD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.email "ci@cretas.local"
          git config user.name "cretas-ci"

          # 🔴 ⛔ 不用 payload 里的 `base.sha` —— 它是**事件创建那一刻**的快照, 会滞后。
          # 实测(#710, run 34074881917): #716 合进 main 之后 **17 秒** 触发的那次 run, payload 的
          # base.sha 仍是 `f3ba01d172`(= `ced5a45397^`, 即合 #716 之前的 main) ⇒ 闸把 head 合进了
          # 一个**旧 main**, 打出 `merged_in_commits=0` / `base_already_ancestor`, 而 BUILD SUCCESS
          # 全绿。真正露馅的是**测试总数 13235 vs 13237**(#716 带进来的两条根本没跑到)。
          # ⚠️ 形状与 #682/#693 那次(31 秒)逐字相同: 窗口被 #707/#713 缩小了, **没有被关上** ——
          #    从「根本不合 base」变成「合了个旧 base」, 而后者更难发现(`merged_ok=yes` 长得像验过了)。
          # ⇒ 取 base 分支的**活 tip**, 并把「payload 说的」与「实际用的」**都打出来**。
          git fetch --no-tags --force origin "$BASE_REF" \
            || { echo "::error::取不到 base 分支 $BASE_REF 的 tip"; exit 1; }
          BASE_TIP_AT_FETCH=$(git rev-parse FETCH_HEAD)
          BASE_SHA="$BASE_TIP_AT_FETCH"
          if [ "$BASE_SHA" = "$PAYLOAD_BASE_SHA" ]; then PAYLOAD_STALE=no; else PAYLOAD_STALE=yes; fi
          # 竞态的**大小**要变成一个可读的数 —— ⛔ 不要指望「某个测试数恰好对不上」来发现它:
          # 那个锚点是碰巧的(#716 恰好带了 2 个测试; 换成纯重构就没有任何东西会对不上)。
          if git cat-file -e "${PAYLOAD_BASE_SHA}^{commit}" 2>/dev/null; then
            PAYLOAD_BEHIND_BY=$(git rev-list --count "$PAYLOAD_BASE_SHA..$BASE_SHA" 2>/dev/null || echo unknown)
          else
            PAYLOAD_BEHIND_BY=unknown   # payload 那个 commit 不在本地(base 被 force-push 过?)
          fi
          # 三个读数一起打, ⛔ 不只打最终 base:
          #   payload_base_sha    = 事件 payload 里那个**快照**(会滞后)
          #   base_ref_tip_at_fetch = 运行时 fetch 到的**活 tip**
          #   base                = 实际合进去的那个
          # ⚠️ 后两者由构造相等; 分开打是为了让「取到的」与「用掉的」各自可查 —— 将来若有人
          #    在中间插一步改了 BASE_SHA, 这两个数会立刻不一致, 而不是悄悄换了棵树。
          echo "READING: GATE_BASE ref=$BASE_REF payload_base_sha=$PAYLOAD_BASE_SHA base_ref_tip_at_fetch=$BASE_TIP_AT_FETCH base=$BASE_SHA payload_stale=$PAYLOAD_STALE payload_behind_by=$PAYLOAD_BEHIND_BY"
          # ⛔ payload 落后**不红**: base 在事件与 run 之间前进是常态, 红了就是天天红。
          #    但也 ⛔ 不静默用新的 —— 大声说出来, 让「这次跑的是哪棵树」可追。
          if [ "$PAYLOAD_STALE" = "yes" ]; then
            echo "::notice::base 分支在事件之后前进了: payload=$PAYLOAD_BASE_SHA 实际用 $BASE_SHA (这是对的 —— 闸要看的是能不能合进**现在**的 base)"
          fi

          # 🔴 硬约束 9: 只打 merged_ok=yes 分不出两种成因 ——
          #   (a) 真把 base 合进来了(这道修复在工作)
          #   (b) base 已经是 head 的祖先(PR 刚 rebase 过), merge 是 no-op
          # 两者读数完全相同, 而只有 (a) 证明闸看到了「别人合进 base 的东西」。
          BEHIND=$(git rev-list --count "HEAD..$BASE_SHA" 2>/dev/null || echo unknown)
          TREE_BEFORE=$(git rev-parse 'HEAD^{tree}')
          if git merge --no-edit "$BASE_SHA"; then
            TREE_AFTER=$(git rev-parse 'HEAD^{tree}')
            if [ "$TREE_BEFORE" = "$TREE_AFTER" ]; then TREE_CHANGED=no; else TREE_CHANGED=yes; fi
            echo "READING: GATE_TREE=merge head=$HEAD_SHA base=$BASE_SHA merged_ok=yes" \
                 "merged_in_commits=$BEHIND tree_changed=$TREE_CHANGED tree=$TREE_AFTER"
            if [ "$BEHIND" = "0" ]; then
              echo "READING: GATE_TREE_NOTE=base_already_ancestor (本次 merge 是 no-op; 这一趟证明不了闸能看见 base 的新东西)"
            fi
          else
            echo "READING: GATE_TREE=conflict head=$HEAD_SHA base=$BASE_SHA merged_ok=no"
            echo "::error::PR 与 base 冲突, 闸无法在合并结果上运行 —— 先解冲突再推(反正这样也合不进去)。"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Maven 仓库缓存由 maven-cache-warm.yml 在 main 上跑过一次真实 mvn test 后写入（key 含 pom 哈希）。
      # 不再用 setup-java 的 `cache: maven`: 它的 key 一旦存在就不可覆盖, main 上那份 158MB 只含部分依赖,
      # 实测 2026-11-12 每片仍要从 central 现下 1160 个文件（约 2 分钟）。命中不了就退化成现状, 不会更慢。
      # ⛔ 自建 runner (canada-mini) 不恢复: 5 个槽共用常驻的 ~ghgate/.m2 (本来就是热的), 恢复会把 158MB
      # 缓存原地解压到别的槽正在读的仓库上。2026-11-19 run 44403277567: PG 第 0 片 22:48:52 恢复完开始编译,
      # 22:48:56 读到 spring-integration-core-6.2.11.jar「zip END header not found」, 同时槽 1/2/4 还在解压
      # (到 22:48:56 / 22:49:01 才结束); 事后扫 376 个 jar 全部完好。Maven 自己下载是临时文件 + 原子改名,
      # 不会读到半截文件, 所以加 Maven 跨进程文件锁防不住这个, 只能不解压。闸: test-route-mini-or-hosted.sh。
      - name: Restore Maven repository (warmed on main)
        if: ${{ runner.environment != 'self-hosted' }}
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: maven-gate-${{ hashFiles('backend/java/cretas-api/pom.xml') }}
          restore-keys: maven-gate-

      # 兜底 (2026-11-13): 分片偶发在 Spring 上下文启动后静默卡死, 拖满 job 超时。
      # 1) 主兜底在 fork 里: src/test 的 IdleWatchdogTestExecutionListener, 7 分钟没有任何 JUnit 事件就
      #    打线程转储并 halt fork ⇒ surefire 报失败 (不是跳过)。
      # 2) 这里的 step 超时是第二道: 正常一片 ≤16 分钟 (含编译/下依赖), 25 分钟必然是卡死。
      - name: Compile all Java tests and run high-signal gates
        timeout-minutes: 22
        working-directory: backend/java/cretas-api
        env:
          MAVEN_OPTS: -Xmx2g
        run: |
          set -euo pipefail
          MVN_OUT="$RUNNER_TEMP/mvn-shard.out"
          : > "$MVN_OUT"
          # 内存看门狗: 可用内存见底时在 VM 冻住之前 kill fork, 让构建带着最后一个类名快速失败。
          bash "$GITHUB_WORKSPACE/scripts/ci/mem-guard.sh" "$MVN_OUT" &
          # 测试 fork 的堆按 runner 取 (2026-10-03): 本机 8G runner 不设 -> 3g; 加拿大 canada-mini-cretas
          # 的 .env 设 6g —— 那边的执行顺序下 3g/4g 都在第 324 个类 OOM, 6g/8g 全过 (实测, 见 PR #874)。
          echo "READING: JAVA_FORK_XMX=${CRETAS_JAVA_FORK_XMX:-3g} runner=${RUNNER_NAME:-?}"
          MVN=$(bash "$GITHUB_WORKSPACE/scripts/ci/resolve-maven.sh")
          TESTS=$(python3 "$GITHUB_WORKSPACE/scripts/ci/shard-tests.py" --list "$GITHUB_WORKSPACE/scripts/ci/java-gate-fast-patterns.txt" --shard "${{ matrix.shard }}" --shards 4 --test-root "$GITHUB_WORKSPACE/backend/java/cretas-api/src/test/java")
          echo "READING: SHARD=${{ matrix.shard }}/4 CLASSES=$(echo "$TESTS" | tr ',' '\n' | wc -l)"
          # ExitOnOutOfMemoryError: 堆溢出时 fork 立即退出 (而不是半死不活挂着); MaxMetaspaceSize/MaxDirectMemorySize
          # 给非堆封顶, 让 fork 总占用有上界。
          # 根因 (PR #1700 MEMGUARD 实测): 共用 fork 的存活堆随 Spring 上下文缓存 (默认 32 个, 每个带 H2 + 全部实体) 涨到
          # 约 8GB+: 8g 下 337 秒顶满, 之后同一个类上 GC 死循环直到 OOM (3/4 片); 12g 吃光 16GB 整机 (无 swap) 而冻住;
          # 10g 4/4 片通过但 runner 可用内存只剩 1.2GB。
          # 2026-11-19 复测 (本机同一份分片 0 类清单) 与修法: 每片启动 24-37 个不同上下文, 都装得进默认 32 格, 一个也不淘汰,
          # 每个约 0.3-0.4GB ⇒ 存活堆涨到 10g (本机 246 次 Full GC 后空转, 7 分钟无 JUnit 事件被看门狗 halt, 丢最后 2 个类;
          # CI 上表现为 OOM / mem-guard 杀 fork: #1896 #1904 #1905 的分片 0)。
          # -Dspring.test.context.cache.maxSize=8 让最久未用的上下文被淘汰关闭: 上下文启动 36 -> 38 次, 清理后存活堆约 3.5-4GB,
          # 6g 堆 0 次 Full GC, 逐类结果与基线一致。堆上限同步 10g -> 6g, 给托管机 16GB 留可用内存。
          # ⚠️ 只适用于本 job: H2 + ddl-auto=create, 共享内存库不会因上下文关闭被 drop (application-test.properties)。
          #    ⛔ 不要搬到 postgres-reversal-concurrency-shard: 那里压到 4 让共享 PG 库被别的上下文关闭, 95 个测试报 SQL 错。
          rc=0
          "$MVN" -B test \
            -Dtest="$TESTS" \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dspring.profiles.active=test \
            -DargLine="-XX:+EnableDynamicAgentLoading -Xshare:off -Xmx${CRETAS_JAVA_FORK_XMX:-3g} -XX:+ExitOnOutOfMemoryError -XX:MaxMetaspaceSize=1g -XX:MaxDirectMemorySize=512m -Dspring.test.context.cache.maxSize=8" \
            2>&1 | tee "$MVN_OUT" || rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::fast-contracts 分片失败 rc=$rc; 最后运行的测试类: $(grep -a 'Running com\.' "$MVN_OUT" | tail -1 | sed 's/.*Running //')"
            grep -a "OutOfMemoryError\|Terminating due to\|MEMGUARD" "$MVN_OUT" | tail -5 || true
          fi
          exit "$rc"

  postgres-reversal-concurrency-shard:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    name: postgres-reversal-concurrency-shard (${{ matrix.shard }}/4)
    # 2026-11-18 (Steve 撤销「公开仓库禁自建 runner」, 前提实测更快): 本仓库分支的 PR 和合并队列跑在
    # canada-mini 自建 runner (标签 cretas-mini-pg, 2 台); fork PR 一律托管 (陌生人代码不上我们的机器)。
    # 逃生口: 给 PR 打 `ci-hosted` 标签 = 回托管 (mini 离线时 job 会一直排队, 不会自动回落)。
    # 2026-11-18 mini 优先、满了溢出: 先看 changes 作业的路由输出 (mini 排队 >= 阈值 / 读不到 -> ubuntu-latest),
    # 守卫照旧串在后面, 路由输出只能把作业从 mini 挪到托管, fork PR 无论如何落托管。
    # ⚠️ 这一行是闸 scripts/tests/test-public-repo-hosted-only.sh 里唯一放行的表达式, 逐字钉住。
    runs-on: ${{ (matrix.shard >= 2 || needs.changes.outputs.mini_window == 'full') && needs.changes.outputs.runner_pg == 'cretas-mini-pg' && (github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository) && !contains(github.event.pull_request.labels.*.name, 'ci-hosted') && 'cretas-mini-pg' || 'ubuntu-latest' }}
    # 分片 (2026-11-10): 类清单 scripts/ci/java-gate-pg-tests.txt (一行一类, 新类追加到文件末尾)。
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    # 25 -> 40 (2026-11-04): 近 29 次实测 job 总耗时 17-22 分(成功), 3 次 25.x 分被取消且 0 失败用例;
    # 慢的那次 checkout 占 6.2 分(常态 0.3 分, 偶发 2-4 分, 是拉取抖动不是测试变慢)。
    timeout-minutes: 40
    # GitHub-hosted (public repo: 4 vCPU / 16 GB). 2026-11-12 起共用一个测试 JVM (不再 -DreuseForks=false):
    # 实测 run 43212152997 每个 PG 分片 17~22 次 Spring 启动、合计 308~473 秒, 占分片 9~14 分钟的一半。
    # 当年改成每类新 JVM 是因为共用 JVM 在 6g 下累积上下文 OOM; 现在用 10g。
    # ⛔ 不压 spring.test.context.cache.maxSize: 试验 run 43215916062 压到 4 后, 上下文被中途淘汰,
    #    4 片共 95 个测试报 SQL 错 (同库被别的上下文关闭/改动)。保持默认上限, 不中途淘汰。
    # 机器上还跑着 PostgreSQL 和 Maven 本身 (MAVEN_OPTS 2g), 所以不用 12g。
    env:
      CRETAS_JAVA_FORK_XMX: 10g
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # 合并 base 需要共同祖先; 浅克隆合不了。
          fetch-depth: 0
          # 只要提交与树, 历史 blob 按需取: 共同祖先照样有, 拉取量大幅减少(慢 checkout 的缓解)。
          filter: blob:none
      # 闸要跑在【合并结果】上, 不是 PR 分支自己 (见该 action 的注释)。
      # 🔴 **内联, ⛔ 不用本地 composite action** (`uses: ./.github/actions/...`):
      #    pull_request 事件下 **workflow 定义从 base 读**, 而 `./` 开头的本地 action 从
      #    **checkout 出来的工作区**读 —— 我们 checkout 的是 `pull_request.head.sha`, 于是任何
      #    **head 不含那个目录**的 PR(旧分支 / 开了几天的 PR)这一步必死:
      #      `Can't find 'action.yml' … under .github/actions/merge-pr-base`, 9 秒红。
      #    2026-09-07 实测: 它炸掉了当时**所有**在飞 PR 的 Java 闸, 而且长得像「CI 没测出问题」
      #    而不是「CI 坏了」—— rebase 只能绕过去, 任何人从旧 base 开分支还会再撞一次。
      #    ⇒ 内联的 run 块跟着 workflow 定义走(**总是来自 base**), 与 head 的树无关。
      # ⚠️ 三处内联必须**逐字相同** —— scripts/tests/test-ci-gate-runs-merge-result.sh 钉了这条。
      - name: Merge PR base into head (pull_request only)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PAYLOAD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.email "ci@cretas.local"
          git config user.name "cretas-ci"

          # 🔴 ⛔ 不用 payload 里的 `base.sha` —— 它是**事件创建那一刻**的快照, 会滞后。
          # 实测(#710, run 34074881917): #716 合进 main 之后 **17 秒** 触发的那次 run, payload 的
          # base.sha 仍是 `f3ba01d172`(= `ced5a45397^`, 即合 #716 之前的 main) ⇒ 闸把 head 合进了
          # 一个**旧 main**, 打出 `merged_in_commits=0` / `base_already_ancestor`, 而 BUILD SUCCESS
          # 全绿。真正露馅的是**测试总数 13235 vs 13237**(#716 带进来的两条根本没跑到)。
          # ⚠️ 形状与 #682/#693 那次(31 秒)逐字相同: 窗口被 #707/#713 缩小了, **没有被关上** ——
          #    从「根本不合 base」变成「合了个旧 base」, 而后者更难发现(`merged_ok=yes` 长得像验过了)。
          # ⇒ 取 base 分支的**活 tip**, 并把「payload 说的」与「实际用的」**都打出来**。
          git fetch --no-tags --force origin "$BASE_REF" \
            || { echo "::error::取不到 base 分支 $BASE_REF 的 tip"; exit 1; }
          BASE_TIP_AT_FETCH=$(git rev-parse FETCH_HEAD)
          BASE_SHA="$BASE_TIP_AT_FETCH"
          if [ "$BASE_SHA" = "$PAYLOAD_BASE_SHA" ]; then PAYLOAD_STALE=no; else PAYLOAD_STALE=yes; fi
          # 竞态的**大小**要变成一个可读的数 —— ⛔ 不要指望「某个测试数恰好对不上」来发现它:
          # 那个锚点是碰巧的(#716 恰好带了 2 个测试; 换成纯重构就没有任何东西会对不上)。
          if git cat-file -e "${PAYLOAD_BASE_SHA}^{commit}" 2>/dev/null; then
            PAYLOAD_BEHIND_BY=$(git rev-list --count "$PAYLOAD_BASE_SHA..$BASE_SHA" 2>/dev/null || echo unknown)
          else
            PAYLOAD_BEHIND_BY=unknown   # payload 那个 commit 不在本地(base 被 force-push 过?)
          fi
          # 三个读数一起打, ⛔ 不只打最终 base:
          #   payload_base_sha    = 事件 payload 里那个**快照**(会滞后)
          #   base_ref_tip_at_fetch = 运行时 fetch 到的**活 tip**
          #   base                = 实际合进去的那个
          # ⚠️ 后两者由构造相等; 分开打是为了让「取到的」与「用掉的」各自可查 —— 将来若有人
          #    在中间插一步改了 BASE_SHA, 这两个数会立刻不一致, 而不是悄悄换了棵树。
          echo "READING: GATE_BASE ref=$BASE_REF payload_base_sha=$PAYLOAD_BASE_SHA base_ref_tip_at_fetch=$BASE_TIP_AT_FETCH base=$BASE_SHA payload_stale=$PAYLOAD_STALE payload_behind_by=$PAYLOAD_BEHIND_BY"
          # ⛔ payload 落后**不红**: base 在事件与 run 之间前进是常态, 红了就是天天红。
          #    但也 ⛔ 不静默用新的 —— 大声说出来, 让「这次跑的是哪棵树」可追。
          if [ "$PAYLOAD_STALE" = "yes" ]; then
            echo "::notice::base 分支在事件之后前进了: payload=$PAYLOAD_BASE_SHA 实际用 $BASE_SHA (这是对的 —— 闸要看的是能不能合进**现在**的 base)"
          fi

          # 🔴 硬约束 9: 只打 merged_ok=yes 分不出两种成因 ——
          #   (a) 真把 base 合进来了(这道修复在工作)
          #   (b) base 已经是 head 的祖先(PR 刚 rebase 过), merge 是 no-op
          # 两者读数完全相同, 而只有 (a) 证明闸看到了「别人合进 base 的东西」。
          BEHIND=$(git rev-list --count "HEAD..$BASE_SHA" 2>/dev/null || echo unknown)
          TREE_BEFORE=$(git rev-parse 'HEAD^{tree}')
          if git merge --no-edit "$BASE_SHA"; then
            TREE_AFTER=$(git rev-parse 'HEAD^{tree}')
            if [ "$TREE_BEFORE" = "$TREE_AFTER" ]; then TREE_CHANGED=no; else TREE_CHANGED=yes; fi
            echo "READING: GATE_TREE=merge head=$HEAD_SHA base=$BASE_SHA merged_ok=yes" \
                 "merged_in_commits=$BEHIND tree_changed=$TREE_CHANGED tree=$TREE_AFTER"
            if [ "$BEHIND" = "0" ]; then
              echo "READING: GATE_TREE_NOTE=base_already_ancestor (本次 merge 是 no-op; 这一趟证明不了闸能看见 base 的新东西)"
            fi
          else
            echo "READING: GATE_TREE=conflict head=$HEAD_SHA base=$BASE_SHA merged_ok=no"
            echo "::error::PR 与 base 冲突, 闸无法在合并结果上运行 —— 先解冲突再推(反正这样也合不进去)。"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ⛔ 自建 runner (canada-mini) 不恢复: 5 个槽共用常驻的 ~ghgate/.m2 (本来就是热的), 恢复会把 158MB
      # 缓存原地解压到别的槽正在读的仓库上。2026-11-19 run 44403277567: PG 第 0 片 22:48:52 恢复完开始编译,
      # 22:48:56 读到 spring-integration-core-6.2.11.jar「zip END header not found」, 同时槽 1/2/4 还在解压
      # (到 22:48:56 / 22:49:01 才结束); 事后扫 376 个 jar 全部完好。Maven 自己下载是临时文件 + 原子改名,
      # 不会读到半截文件, 所以加 Maven 跨进程文件锁防不住这个, 只能不解压。闸: test-route-mini-or-hosted.sh。
      - name: Restore Maven repository (warmed on main)
        if: ${{ runner.environment != 'self-hosted' }}
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: maven-gate-${{ hashFiles('backend/java/cretas-api/pom.xml') }}
          restore-keys: maven-gate-

      # 自建 runner (canada-mini) 的隔离与资源读数。runner 是一次性 JIT runner, 跑在无密码、非管理员的
      # ghgate 账户下, 每个任务一个全新目录; 发布优先由 mini 上的补位脚本 (~rex/gh-gate/refill.sh) 保证:
      # 发布构建持有 ~/cretas-build/.build.lock 时不领新任务。这里只读数: 账户、rex 目录不可读、空闲内存。
      - name: Self-hosted isolation reading (self-hosted only)
        if: ${{ runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          set -u
          if ls /Users/rex >/dev/null 2>&1; then rex_home=readable; else rex_home=denied; fi
          echo "READING: SELF_HOSTED user=$(id -un) admin=$(id -Gn | tr ' ' '\n' | grep -cx admin) rex_home=$rex_home runner=${RUNNER_NAME:-?} free=$(/usr/bin/memory_pressure 2>/dev/null | sed -nE 's/.*free percentage: ([0-9]+)%.*/\1/p')%"
          [ "$rex_home" = denied ] || { echo "::error::自建 runner 能读 /Users/rex (部署密钥/令牌所在), 隔离失效"; exit 1; }

      - name: Prove PostgreSQL-only workflow and correction invariants
        working-directory: backend/java/cretas-api
        env:
          MAVEN_OPTS: -Xmx2g
        run: |
          set -euo pipefail
          # 测试 fork 的堆按 runner 取 (2026-10-03): 本机 8G runner 不设 -> 3g; 加拿大 canada-mini-cretas
          # 的 .env 设 6g —— 那边的执行顺序下 3g/4g 都在第 324 个类 OOM, 6g/8g 全过 (实测, 见 PR #874)。
          echo "READING: JAVA_FORK_XMX=${CRETAS_JAVA_FORK_XMX:-3g} runner=${RUNNER_NAME:-?}"
          MVN=$(bash "$GITHUB_WORKSPACE/scripts/ci/resolve-maven.sh")
          TESTS=$(python3 "$GITHUB_WORKSPACE/scripts/ci/shard-tests.py" --list "$GITHUB_WORKSPACE/scripts/ci/java-gate-pg-tests.txt" --shard "${{ matrix.shard }}" --shards 4 --test-root "$GITHUB_WORKSPACE/backend/java/cretas-api/src/test/java")
          echo "READING: SHARD=${{ matrix.shard }}/4 CLASSES=$(echo "$TESTS" | tr ',' '\n' | wc -l)"
          bash "$GITHUB_WORKSPACE/scripts/ci/run-with-test-postgres.sh" "$MVN" -B test \
            -Dtest="$TESTS" \
            -Dspring.profiles.active=test \
            -DargLine="-XX:+EnableDynamicAgentLoading -Xshare:off -Xmx${CRETAS_JAVA_FORK_XMX:-3g}"

      - name: Prove activity event migration and committed JDBC writes
        if: ${{ matrix.shard == 0 }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/run-with-test-postgres.sh" bash "$GITHUB_WORKSPACE/scripts/ci/test-activity-events-migration.sh"

  # 汇总 job: 保留原 job 名, 分支保护的必需检查与各会话判据不变。任一分片不是 success 就红
  # (被取消 / 被跳过都算红; 唯一放行: 本 run 被并发组取消且同一 PR 头 SHA 上已有更新的 run, 见
  #  scripts/ci/java-gate-shard-summary.sh; 例外: java-full-ready 标签时分片整体 skipped, 汇总也跳过;
  #  changes 判定本 PR 没改 Java 触发路径 (run=false) 时汇总也跳过 —— 跳过的必需检查算通过)。
  # ⚠️ 判 `!= 'false'` 而不是 `== 'true'`: changes 作业自己失败 (输出为空) 时汇总照跑, 此时分片
  #    结论不是 success ⇒ 红; ⛔ 不让判定仪器坏掉变成整道闸被跳过。
  fast-contracts:
    needs: [changes, fast-contracts-shard]
    if: ${{ always() && needs.changes.outputs.run != 'false' && !contains(github.event.pull_request.labels.*.name, 'java-full-ready') }}
    runs-on: ${{ needs.changes.outputs.runner_fast == 'cretas-mini-fast' && (github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository) && !contains(github.event.pull_request.labels.*.name, 'ci-hosted') && 'cretas-mini-fast' || 'ubuntu-latest' }}
    timeout-minutes: 5
    # actions: read 只给判定脚本查「同一头 SHA 上有没有更新的 run」(被并发组取消 ⇒ 结论交给那条)。
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci/java-gate-shard-summary.sh
          sparse-checkout-cone-mode: false
      - name: Require every shard to succeed
        env:
          RESULT: ${{ needs.fast-contracts-shard.result }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci/java-gate-shard-summary.sh fast-contracts "$RESULT"

  postgres-reversal-concurrency:
    needs: [changes, postgres-reversal-concurrency-shard]
    if: ${{ always() && needs.changes.outputs.run != 'false' }}
    # 和 PG 分片同一条自建路由 (见 postgres-reversal-concurrency-shard 注释): PG 这条线首尾的小作业也在 mini 上,
    # 否则托管机排队 (2026-11-18 实测全仓 94 个 run 在排) 时, 分片要等托管机上的这个作业, mini 省下的排队又被吃回去。
    runs-on: ${{ needs.changes.outputs.runner_pg == 'cretas-mini-pg' && (github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository) && !contains(github.event.pull_request.labels.*.name, 'ci-hosted') && 'cretas-mini-pg' || 'ubuntu-latest' }}
    timeout-minutes: 5
    # actions: read 只给判定脚本查「同一头 SHA 上有没有更新的 run」(被并发组取消 ⇒ 结论交给那条)。
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci/java-gate-shard-summary.sh
          sparse-checkout-cone-mode: false
      - name: Require every shard to succeed
        env:
          RESULT: ${{ needs.postgres-reversal-concurrency-shard.result }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci/java-gate-shard-summary.sh postgres-reversal-concurrency "$RESULT"


  final-full-suite:
    needs: changes
    # 仅 java-full-ready 标签时运行 (merge_group 下没有标签 ⇒ 不跑, 队列跑快速门禁)。
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' && contains(github.event.pull_request.labels.*.name, 'java-full-ready') }}
    uses: ./.github/workflows/java-full-nightly.yml
    # 不传 write_baseline：PR 永远不许改已知红基线。
