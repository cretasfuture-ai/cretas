name: Java Gate

# Java PR 分层门禁：
#
# 1. 每次 push 都跑快速门禁。它编译全部 main/test 源码，并执行契约、真实 JPA
#    Repository 启动、Flyway、权限/安全等高信号测试；任何失败直接红，不走基线。
# 2. 独立 PostgreSQL job 每次 push 都在唯一 disposable DB 上验证撤回审批行锁并发。
# 3. 只有最终候选加上 `java-full-ready` 标签后才调用全量棘轮。
#    标签保留时再 push 会触发 synchronize，对新的 PR HEAD 重跑；旧 run 由 concurrency
#    取消，不能拿旧 HEAD 的绿灯冒充最终候选。
# 4. 夜间全量仍由 java-full-nightly.yml 的 schedule 独立执行。
#
# 这不是恢复 2026-08-27 以前的“只跑窄闸就允许合并”。快速门禁负责反馈速度，
# `java-full-ready` 全量负责最终候选覆盖；两者缺一不可。

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'backend/java/cretas-api/**'
      - '.github/workflows/java-gate-pr.yml'
      - '.github/workflows/java-full-nightly.yml'
      - 'scripts/ci/java-test-ratchet.py'

concurrency:
  group: java-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-contracts:
    # 最终候选的全量已经包含这些测试；2 台 runner 上再跑一份只会与全量争槽。
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'java-full-ready') }}
    runs-on: [self-hosted, cretas]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # 合并 base 需要共同祖先; 浅克隆合不了。
          fetch-depth: 0
      # 闸要跑在【合并结果】上, 不是 PR 分支自己 (见该 action 的注释)。
      # 🔴 **内联, ⛔ 不用本地 composite action** (`uses: ./.github/actions/...`):
      #    pull_request 事件下 **workflow 定义从 base 读**, 而 `./` 开头的本地 action 从
      #    **checkout 出来的工作区**读 —— 我们 checkout 的是 `pull_request.head.sha`, 于是任何
      #    **head 不含那个目录**的 PR(旧分支 / 开了几天的 PR)这一步必死:
      #      `Can't find 'action.yml' … under .github/actions/merge-pr-base`, 9 秒红。
      #    2026-09-07 实测: 它炸掉了当时**所有**在飞 PR 的 Java 闸, 而且长得像「CI 没测出问题」
      #    而不是「CI 坏了」—— rebase 只能绕过去, 任何人从旧 base 开分支还会再撞一次。
      #    ⇒ 内联的 run 块跟着 workflow 定义走(**总是来自 base**), 与 head 的树无关。
      # ⚠️ 三处内联必须**逐字相同** —— scripts/tests/test-ci-gate-runs-merge-result.sh 钉了这条。
      - name: Merge PR base into head (pull_request only)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.email "ci@cretas.local"
          git config user.name "cretas-ci"

          # base 对象必须在本地才能合。调用方给了 fetch-depth: 0 就已经有了;
          # 万一没有(浅克隆)就单独取一次, 取不到直接红 —— ⛔ 不静默跳过合并,
          # 那会退化成「跑的还是 PR 分支自己」而读数看起来一切正常。
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA" \
              || { echo "::error::取不到 base 提交 $BASE_SHA —— 调用方需要 fetch-depth: 0"; exit 1; }
          fi

          # 🔴 硬约束 9: 只打 merged_ok=yes 分不出两种成因 ——
          #   (a) 真把 base 合进来了(这道修复在工作)
          #   (b) base 已经是 head 的祖先(PR 刚 rebase 过), merge 是 no-op
          # 两者读数完全相同, 而只有 (a) 证明闸看到了「别人合进 base 的东西」。
          BEHIND=$(git rev-list --count "HEAD..$BASE_SHA" 2>/dev/null || echo unknown)
          TREE_BEFORE=$(git rev-parse 'HEAD^{tree}')
          if git merge --no-edit "$BASE_SHA"; then
            TREE_AFTER=$(git rev-parse 'HEAD^{tree}')
            if [ "$TREE_BEFORE" = "$TREE_AFTER" ]; then TREE_CHANGED=no; else TREE_CHANGED=yes; fi
            echo "READING: GATE_TREE=merge head=$HEAD_SHA base=$BASE_SHA merged_ok=yes" \
                 "merged_in_commits=$BEHIND tree_changed=$TREE_CHANGED tree=$TREE_AFTER"
            if [ "$BEHIND" = "0" ]; then
              echo "READING: GATE_TREE_NOTE=base_already_ancestor (本次 merge 是 no-op; 这一趟证明不了闸能看见 base 的新东西)"
            fi
          else
            echo "READING: GATE_TREE=conflict head=$HEAD_SHA base=$BASE_SHA merged_ok=no"
            echo "::error::PR 与 base 冲突, 闸无法在合并结果上运行 —— 先解冲突再推(反正这样也合不进去)。"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile all Java tests and run high-signal gates
        working-directory: backend/java/cretas-api
        env:
          MAVEN_OPTS: -Xmx2g
        run: |
          set -euo pipefail
          MVN=$(bash "$GITHUB_WORKSPACE/scripts/ci/resolve-maven.sh")
          "$MVN" -B test \
            -Dtest='*ContractTest,*RepositoryQueryValidationTest,FlywayVersionUniquenessTest,*StartupGuardTest,*RoleGateTest,*SecurityTest,*AuthorizationTest,*PermissionTest' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dspring.profiles.active=test \
            -DargLine="-XX:+EnableDynamicAgentLoading -Xshare:off -Xmx3g"

  postgres-reversal-concurrency:
    runs-on: [self-hosted, cretas]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # 合并 base 需要共同祖先; 浅克隆合不了。
          fetch-depth: 0
      # 闸要跑在【合并结果】上, 不是 PR 分支自己 (见该 action 的注释)。
      # 🔴 **内联, ⛔ 不用本地 composite action** (`uses: ./.github/actions/...`):
      #    pull_request 事件下 **workflow 定义从 base 读**, 而 `./` 开头的本地 action 从
      #    **checkout 出来的工作区**读 —— 我们 checkout 的是 `pull_request.head.sha`, 于是任何
      #    **head 不含那个目录**的 PR(旧分支 / 开了几天的 PR)这一步必死:
      #      `Can't find 'action.yml' … under .github/actions/merge-pr-base`, 9 秒红。
      #    2026-09-07 实测: 它炸掉了当时**所有**在飞 PR 的 Java 闸, 而且长得像「CI 没测出问题」
      #    而不是「CI 坏了」—— rebase 只能绕过去, 任何人从旧 base 开分支还会再撞一次。
      #    ⇒ 内联的 run 块跟着 workflow 定义走(**总是来自 base**), 与 head 的树无关。
      # ⚠️ 三处内联必须**逐字相同** —— scripts/tests/test-ci-gate-runs-merge-result.sh 钉了这条。
      - name: Merge PR base into head (pull_request only)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.email "ci@cretas.local"
          git config user.name "cretas-ci"

          # base 对象必须在本地才能合。调用方给了 fetch-depth: 0 就已经有了;
          # 万一没有(浅克隆)就单独取一次, 取不到直接红 —— ⛔ 不静默跳过合并,
          # 那会退化成「跑的还是 PR 分支自己」而读数看起来一切正常。
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA" \
              || { echo "::error::取不到 base 提交 $BASE_SHA —— 调用方需要 fetch-depth: 0"; exit 1; }
          fi

          # 🔴 硬约束 9: 只打 merged_ok=yes 分不出两种成因 ——
          #   (a) 真把 base 合进来了(这道修复在工作)
          #   (b) base 已经是 head 的祖先(PR 刚 rebase 过), merge 是 no-op
          # 两者读数完全相同, 而只有 (a) 证明闸看到了「别人合进 base 的东西」。
          BEHIND=$(git rev-list --count "HEAD..$BASE_SHA" 2>/dev/null || echo unknown)
          TREE_BEFORE=$(git rev-parse 'HEAD^{tree}')
          if git merge --no-edit "$BASE_SHA"; then
            TREE_AFTER=$(git rev-parse 'HEAD^{tree}')
            if [ "$TREE_BEFORE" = "$TREE_AFTER" ]; then TREE_CHANGED=no; else TREE_CHANGED=yes; fi
            echo "READING: GATE_TREE=merge head=$HEAD_SHA base=$BASE_SHA merged_ok=yes" \
                 "merged_in_commits=$BEHIND tree_changed=$TREE_CHANGED tree=$TREE_AFTER"
            if [ "$BEHIND" = "0" ]; then
              echo "READING: GATE_TREE_NOTE=base_already_ancestor (本次 merge 是 no-op; 这一趟证明不了闸能看见 base 的新东西)"
            fi
          else
            echo "READING: GATE_TREE=conflict head=$HEAD_SHA base=$BASE_SHA merged_ok=no"
            echo "::error::PR 与 base 冲突, 闸无法在合并结果上运行 —— 先解冲突再推(反正这样也合不进去)。"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Create one disposable PostgreSQL database for this job
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/postgresql@17/bin:$PATH"
          command -v psql >/dev/null 2>&1 || {
            echo "::error title=PostgreSQL 并发闸没量到::runner 缺少 psql；不能把跳过当通过。"
            exit 1
          }
          suffix=$(printf '%s_%s_%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "${RUNNER_NAME:-runner}" \
            | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9_' '_' | cut -c1-34)
          DB="cretas_workflow_verify_${suffix}"
          dropdb --if-exists --force "$DB"
          createdb -O cretas_user "$DB"
          echo "CRETAS_WORKFLOW_PG_DB=$DB" >> "$GITHUB_ENV"
          echo "CRETAS_WORKFLOW_PG_VERIFY=true" >> "$GITHUB_ENV"
          echo "CRETAS_WORKFLOW_PG_URL=jdbc:postgresql://localhost:5432/$DB" >> "$GITHUB_ENV"
          echo "CRETAS_WORKFLOW_PG_USER=cretas_user" >> "$GITHUB_ENV"
          echo "CRETAS_WORKFLOW_PG_PASSWORD=" >> "$GITHUB_ENV"

      - name: Prove PostgreSQL-only workflow and correction invariants
        working-directory: backend/java/cretas-api
        env:
          MAVEN_OPTS: -Xmx2g
        run: |
          set -euo pipefail
          MVN=$(bash "$GITHUB_WORKSPACE/scripts/ci/resolve-maven.sh")
          "$MVN" -B test \
            -Dtest=ReportReversalLogRepositoryPostgresConcurrencyIT,ProductionBatchRepositoryPostgresConcurrencyIT,ProductionReportCorrectionPartialUniquePostgresIT,ProductionSettlementPartialUniqueIndexPostgresContractTest,WorkflowEngineRestartWithCurrentDefinitionOrderingPostgresIT,SoftDeletePartialUniqueIndexPostgresContractTest \
            -Dspring.profiles.active=test \
            -DargLine="-XX:+EnableDynamicAgentLoading -Xshare:off -Xmx3g"

      - name: Drop the disposable PostgreSQL database
        if: always()
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/postgresql@17/bin:$PATH"
          if [ -n "${CRETAS_WORKFLOW_PG_DB:-}" ] && command -v dropdb >/dev/null 2>&1; then
            dropdb --if-exists --force "$CRETAS_WORKFLOW_PG_DB"
          fi

  final-full-suite:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'java-full-ready') }}
    uses: ./.github/workflows/java-full-nightly.yml
    # 不传 write_baseline：PR 永远不许改已知红基线。
