name: Java Gate

# Java PR 分层门禁：
#
# 1. 每次 push 都跑快速门禁。它编译全部 main/test 源码，并执行契约、真实 JPA
#    Repository 启动、Flyway、权限/安全等高信号测试；任何失败直接红，不走基线。
# 2. 独立 PostgreSQL job 每次 push 都在唯一 disposable DB 上验证撤回审批行锁并发。
# 3. 只有最终候选加上 `java-full-ready` 标签后才调用全量棘轮。
#    标签保留时再 push 会触发 synchronize，对新的 PR HEAD 重跑；旧 run 由 concurrency
#    取消，不能拿旧 HEAD 的绿灯冒充最终候选。
# 4. 夜间全量仍由 java-full-nightly.yml 的 schedule 独立执行。
#
# 这不是恢复 2026-08-27 以前的“只跑窄闸就允许合并”。快速门禁负责反馈速度，
# `java-full-ready` 全量负责最终候选覆盖；两者缺一不可。

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'backend/java/cretas-api/**'
      - '.github/workflows/java-gate-pr.yml'
      - '.github/workflows/java-full-nightly.yml'
      - 'scripts/ci/java-test-ratchet.py'
      - 'scripts/ci/run-with-test-postgres.sh'
      - 'scripts/ci/test-activity-events-migration.sh'

concurrency:
  group: java-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-contracts:
    # 最终候选的全量已经包含这些测试；2 台 runner 上再跑一份只会与全量争槽。
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'java-full-ready') }}
    runs-on: [self-hosted, java]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # 合并 base 需要共同祖先; 浅克隆合不了。
          fetch-depth: 0
      # 闸要跑在【合并结果】上, 不是 PR 分支自己 (见该 action 的注释)。
      # 🔴 **内联, ⛔ 不用本地 composite action** (`uses: ./.github/actions/...`):
      #    pull_request 事件下 **workflow 定义从 base 读**, 而 `./` 开头的本地 action 从
      #    **checkout 出来的工作区**读 —— 我们 checkout 的是 `pull_request.head.sha`, 于是任何
      #    **head 不含那个目录**的 PR(旧分支 / 开了几天的 PR)这一步必死:
      #      `Can't find 'action.yml' … under .github/actions/merge-pr-base`, 9 秒红。
      #    2026-09-07 实测: 它炸掉了当时**所有**在飞 PR 的 Java 闸, 而且长得像「CI 没测出问题」
      #    而不是「CI 坏了」—— rebase 只能绕过去, 任何人从旧 base 开分支还会再撞一次。
      #    ⇒ 内联的 run 块跟着 workflow 定义走(**总是来自 base**), 与 head 的树无关。
      # ⚠️ 三处内联必须**逐字相同** —— scripts/tests/test-ci-gate-runs-merge-result.sh 钉了这条。
      - name: Merge PR base into head (pull_request only)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PAYLOAD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.email "ci@cretas.local"
          git config user.name "cretas-ci"

          # 🔴 ⛔ 不用 payload 里的 `base.sha` —— 它是**事件创建那一刻**的快照, 会滞后。
          # 实测(#710, run 34074881917): #716 合进 main 之后 **17 秒** 触发的那次 run, payload 的
          # base.sha 仍是 `f3ba01d172`(= `ced5a45397^`, 即合 #716 之前的 main) ⇒ 闸把 head 合进了
          # 一个**旧 main**, 打出 `merged_in_commits=0` / `base_already_ancestor`, 而 BUILD SUCCESS
          # 全绿。真正露馅的是**测试总数 13235 vs 13237**(#716 带进来的两条根本没跑到)。
          # ⚠️ 形状与 #682/#693 那次(31 秒)逐字相同: 窗口被 #707/#713 缩小了, **没有被关上** ——
          #    从「根本不合 base」变成「合了个旧 base」, 而后者更难发现(`merged_ok=yes` 长得像验过了)。
          # ⇒ 取 base 分支的**活 tip**, 并把「payload 说的」与「实际用的」**都打出来**。
          git fetch --no-tags --force origin "$BASE_REF" \
            || { echo "::error::取不到 base 分支 $BASE_REF 的 tip"; exit 1; }
          BASE_TIP_AT_FETCH=$(git rev-parse FETCH_HEAD)
          BASE_SHA="$BASE_TIP_AT_FETCH"
          if [ "$BASE_SHA" = "$PAYLOAD_BASE_SHA" ]; then PAYLOAD_STALE=no; else PAYLOAD_STALE=yes; fi
          # 竞态的**大小**要变成一个可读的数 —— ⛔ 不要指望「某个测试数恰好对不上」来发现它:
          # 那个锚点是碰巧的(#716 恰好带了 2 个测试; 换成纯重构就没有任何东西会对不上)。
          if git cat-file -e "${PAYLOAD_BASE_SHA}^{commit}" 2>/dev/null; then
            PAYLOAD_BEHIND_BY=$(git rev-list --count "$PAYLOAD_BASE_SHA..$BASE_SHA" 2>/dev/null || echo unknown)
          else
            PAYLOAD_BEHIND_BY=unknown   # payload 那个 commit 不在本地(base 被 force-push 过?)
          fi
          # 三个读数一起打, ⛔ 不只打最终 base:
          #   payload_base_sha    = 事件 payload 里那个**快照**(会滞后)
          #   base_ref_tip_at_fetch = 运行时 fetch 到的**活 tip**
          #   base                = 实际合进去的那个
          # ⚠️ 后两者由构造相等; 分开打是为了让「取到的」与「用掉的」各自可查 —— 将来若有人
          #    在中间插一步改了 BASE_SHA, 这两个数会立刻不一致, 而不是悄悄换了棵树。
          echo "READING: GATE_BASE ref=$BASE_REF payload_base_sha=$PAYLOAD_BASE_SHA base_ref_tip_at_fetch=$BASE_TIP_AT_FETCH base=$BASE_SHA payload_stale=$PAYLOAD_STALE payload_behind_by=$PAYLOAD_BEHIND_BY"
          # ⛔ payload 落后**不红**: base 在事件与 run 之间前进是常态, 红了就是天天红。
          #    但也 ⛔ 不静默用新的 —— 大声说出来, 让「这次跑的是哪棵树」可追。
          if [ "$PAYLOAD_STALE" = "yes" ]; then
            echo "::notice::base 分支在事件之后前进了: payload=$PAYLOAD_BASE_SHA 实际用 $BASE_SHA (这是对的 —— 闸要看的是能不能合进**现在**的 base)"
          fi

          # 🔴 硬约束 9: 只打 merged_ok=yes 分不出两种成因 ——
          #   (a) 真把 base 合进来了(这道修复在工作)
          #   (b) base 已经是 head 的祖先(PR 刚 rebase 过), merge 是 no-op
          # 两者读数完全相同, 而只有 (a) 证明闸看到了「别人合进 base 的东西」。
          BEHIND=$(git rev-list --count "HEAD..$BASE_SHA" 2>/dev/null || echo unknown)
          TREE_BEFORE=$(git rev-parse 'HEAD^{tree}')
          if git merge --no-edit "$BASE_SHA"; then
            TREE_AFTER=$(git rev-parse 'HEAD^{tree}')
            if [ "$TREE_BEFORE" = "$TREE_AFTER" ]; then TREE_CHANGED=no; else TREE_CHANGED=yes; fi
            echo "READING: GATE_TREE=merge head=$HEAD_SHA base=$BASE_SHA merged_ok=yes" \
                 "merged_in_commits=$BEHIND tree_changed=$TREE_CHANGED tree=$TREE_AFTER"
            if [ "$BEHIND" = "0" ]; then
              echo "READING: GATE_TREE_NOTE=base_already_ancestor (本次 merge 是 no-op; 这一趟证明不了闸能看见 base 的新东西)"
            fi
          else
            echo "READING: GATE_TREE=conflict head=$HEAD_SHA base=$BASE_SHA merged_ok=no"
            echo "::error::PR 与 base 冲突, 闸无法在合并结果上运行 —— 先解冲突再推(反正这样也合不进去)。"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile all Java tests and run high-signal gates
        working-directory: backend/java/cretas-api
        env:
          MAVEN_OPTS: -Xmx2g
        run: |
          set -euo pipefail
          # 测试 fork 的堆按 runner 取 (2026-10-03): 本机 8G runner 不设 -> 3g; 加拿大 canada-mini-cretas
          # 的 .env 设 6g —— 那边的执行顺序下 3g/4g 都在第 324 个类 OOM, 6g/8g 全过 (实测, 见 PR #874)。
          echo "READING: JAVA_FORK_XMX=${CRETAS_JAVA_FORK_XMX:-3g} runner=${RUNNER_NAME:-?}"
          MVN=$(bash "$GITHUB_WORKSPACE/scripts/ci/resolve-maven.sh")
          "$MVN" -B test \
            -Dtest='*ContractTest,*ContractsTest,*RepositoryQueryValidationTest,FlywayVersionUniquenessTest,*StartupGuardTest,*RoleGateTest,*RoleGateMvcTest,*SecurityTest,*VulnerabilityTest,*AuthorizationTest,*PermissionTest,*PermissionGateTest,PermissionServiceImpl*Test,*ArchitectureTest' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dspring.profiles.active=test \
            -DargLine="-XX:+EnableDynamicAgentLoading -Xshare:off -Xmx${CRETAS_JAVA_FORK_XMX:-3g}"

  postgres-reversal-concurrency:
    runs-on: [self-hosted, java]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # 合并 base 需要共同祖先; 浅克隆合不了。
          fetch-depth: 0
      # 闸要跑在【合并结果】上, 不是 PR 分支自己 (见该 action 的注释)。
      # 🔴 **内联, ⛔ 不用本地 composite action** (`uses: ./.github/actions/...`):
      #    pull_request 事件下 **workflow 定义从 base 读**, 而 `./` 开头的本地 action 从
      #    **checkout 出来的工作区**读 —— 我们 checkout 的是 `pull_request.head.sha`, 于是任何
      #    **head 不含那个目录**的 PR(旧分支 / 开了几天的 PR)这一步必死:
      #      `Can't find 'action.yml' … under .github/actions/merge-pr-base`, 9 秒红。
      #    2026-09-07 实测: 它炸掉了当时**所有**在飞 PR 的 Java 闸, 而且长得像「CI 没测出问题」
      #    而不是「CI 坏了」—— rebase 只能绕过去, 任何人从旧 base 开分支还会再撞一次。
      #    ⇒ 内联的 run 块跟着 workflow 定义走(**总是来自 base**), 与 head 的树无关。
      # ⚠️ 三处内联必须**逐字相同** —— scripts/tests/test-ci-gate-runs-merge-result.sh 钉了这条。
      - name: Merge PR base into head (pull_request only)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PAYLOAD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
