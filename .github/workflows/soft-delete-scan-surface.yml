name: Soft-delete scan surface

# 票 OPS-SOFT-DELETE-SCAN-SURFACE-DRIFTS-ON-NEW-ENTITY-20260907。
#
# 现象: 新增(或删除)一个带 `deleted_at` 的实体, 就会让 `scripts/cron/soft-delete-orphans.sql`
# 与生成器的当前产出不一致 —— 而这件事**只在 main 上**被 `ops-script-tests` 发现:
#   · #665: 第一次(430 个实体那次)
#   · #685: 第二次(430→431, `platform_role_permission_audits`), 而且把两个**无关** PR
#           (#681 / #686) 一起连坐红, 我为此把两条分支各 rebase 了一遍
# ⇒ 代价落在「下一个碰 CI 的人」身上, 而不是引入漂移的那个 PR。
#
# 本 workflow 把**同一道**判据挪到 PR 上: 在实体 / repository / 生成器 / 两个快照被改动时,
# 跑那道已经存在的权威检查(`--regen-offline` 重放后逐字比对)。
#
# ⛔ 不是「文件改了没改」那种代理判据 —— 那会把「改了但改错」放过去。这里跑的是真生成器。
# ⛔ 没有把这些路径塞进 `ops-script-tests` 的 paths: 2026-08-28 的教训是给一道闸加宽 glob
#    会把**另一道闸**「证明自己不过宽」的阴性对照变成恒真式。新闸自带 workflow。
#
# ⚠️ paths 必须覆盖**生成器实际扫描的两个根**(`entity/` 与 `repository/`, 见
#    scripts/check-soft-delete-orphans.sh 的 ENTITY_ROOT / REPOSITORY_ROOT)。少一个,
#    这道闸就会在那半棵树上静默不触发 —— 与「闸不存在」读数相同。
#    scripts/tests/test-soft-delete-scan-surface-gate.sh 把这两者钉在一起。

on:
  # pull_request 不带 paths (合并队列/必需检查要求每个 PR 都报告结果); 触发路径清单在
  # scripts/ci/trigger-paths/soft-delete-scan-surface.txt, 由下面的 changes 作业判定原作业跑不跑。
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# ⚠️ 这里**只有** pull_request, 没有 `push: main` —— main 侧的覆盖靠 `ops-script-tests.yml`:
#    它的 push 车道**刻意不带 paths**(那边注释写明: 再抄一份 12 条清单就是第二份会漂的副本),
#    每次 push 都跑同一个 `test-soft-delete-orphans-sql-drift.sh`。
#    🔴 这是一条**隐式耦合**: 哪天有人给那条 push 车道加上 `paths:`, main 侧就又瞎了,
#    而本文件这边一点感觉都没有。改那边之前先回来看这一句。

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 合并队列准备 (2026-11-12): 判断这次 PR 有没有改到本闸的触发路径。
  #   清单: scripts/ci/trigger-paths/soft-delete-scan-surface.txt (原 on.pull_request.paths 原样搬过去)。
  #   pull_request 以外的事件 (merge_group / push / schedule / workflow_dispatch) 一律 run=true;
  #   取不到 diff 也 run=true —— 宁可多跑, ⛔ 不因为没量到而跳过。
  # 下游作业的 if 写成 `!cancelled() && needs.changes.outputs.run != 'false'`: 本作业自己失败
  # (输出为空) 时下游照跑, ⛔ 不让判定仪器坏掉变成「被跳过 = 必需检查通过」。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 三点 diff 要 merge-base; 只要提交与树, blob 按需取。
          fetch-depth: 0
          filter: blob:none
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/changed-paths.py --patterns scripts/ci/trigger-paths/soft-delete-scan-surface.txt

  scan-surface-in-sync:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    # ⛔ 字面量 —— `${{ vars.X }}` 在 runs-on 里求值为空(见 .claude/rules/ci-runner-routing.md)。
    #
    # 2026-09-09：与 ops-script-tests 一起纳入统一切换表。
    # 当前由隔离 Windows WSL Linux runner 执行，目标脚本已实跑；不恢复旧 Mac 标签。
    # 2026-10-24：改走 cretas-quick 小检查槽（1 核 / 1G），aurora 与 windows-light 也带这个标签兜底。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 生成器只做源码级扫描 + 重放 hasdel 快照, ⛔ 不连库、不编译 Java、不需要 JDK。
      # 它调的是裸 `python`, 而 ubuntu-latest 上只有 python3 ⇒ 补垫片,
      # ⛔ 不改生成器去迁就 CI(它在开发机上就是 `python`)。与 ops-script-tests.yml 同一处理。
      - name: Provide a bare `python`
        run: |
          set -euo pipefail
          echo "python3=$(python3 --version)"
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec python3 "$@"\n' > "$HOME/.local/bin/python"
          chmod +x "$HOME/.local/bin/python"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prove the shim landed
        run: |
          set -euo pipefail
          command -v python
          python --version

      # ⛔ 没有 `|| true`、没有管道尾 —— 这一步的 rc 就是闸的 rc。
      # 用例失败时自带下一步命令(`./scripts/check-soft-delete-orphans.sh --write` 后提交)。
      - name: Scan surface must match the committed SQL
        run: bash scripts/tests/test-soft-delete-orphans-sql-drift.sh

      # 扫描**根**本身盖不盖得住所有软删实体 —— 与上一步是两件事:
      # 上一步问「生成物跟不跟得上源」, 这一步问「源里有没有它根本没看过的东西」。
      - name: Scan roots must cover every soft-deletable entity
        run: bash scripts/tests/test-soft-delete-scan-root-covers-entities.sh
